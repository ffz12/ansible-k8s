# ============================================================================
#  env.yaml —— 部署新环境「需要改」的变量都在这里(其余默认见 defaults.yaml)
# ============================================================================

# ---- Harbor(域名/地址/账号) ----
harbor_instances:
  - { dns: "harbor.local.clusters", ip: "172.171.0.206" }
harbor_admin_username: admin
harbor_admin_password: Harbor12345      # 建议改
password: root123                        # harbor 数据库密码,建议改

# ---- 数据目录(数据盘挂载点及各组件数据位置) ----
container_base: "/var/lib/container"     # containerd/kubelet 数据盘主挂载点
data_root: /var/lib/docker               # docker 数据目录
harbor_copy_path: /data/harbor-install   # harbor 安装目录
data_volume: /data/harbor-data           # harbor 数据目录

# ---- 容器运行时版本 ----
containerd_version: "1.7.32"             # 可选 "2.2.3"(config v3) / "1.7.32"(config v2)
runc_version: "1.1.12"

# ---- Kubernetes 版本 & CNI ----
k8s_version: "1.34.3"                    # 当前 1.34.3; 另一支持版本 1.28.8。切版本改这一处
kube_network_plugin: calico             # calico(manifest) / flannel(manifest) / cilium(helm)
# calico 封装模式: none(纯 BGP,无封装,性能最好,需节点二层互通)
#                / crosssubnet(仅跨子网才 IPIP 封装,同子网走 BGP,跨网段推荐)
#                / ipip(全程 IPIP 封装) / vxlan(全程 VXLAN 封装)
calico_encapsulation: none
# cilium 网络模式: tunnel(默认,overlay) / native(直接路由,同二层,类似 calico 的 none)
cilium_routing_mode: tunnel
cilium_tunnel_protocol: vxlan           # tunnel 模式下: vxlan / geneve
cilium_kube_proxy_replacement: false    # true=eBPF 替换 kube-proxy(需内核>=5.10)
enable_multus: false                     # 是否叠加 multus 多网卡
# 独立组件版本(跟 k8s 版本无关,按各自兼容矩阵挑)
etcd_version: "3.6.8"
calico_version: "3.27.5"
flannel_version: "0.26.7"
cilium_version: "1.16.5"
helm_version: "3.16.4"
multus_cni_version: "4.2.4"

# ---- 网络 ----
pod_subnet: 10.244.0.0/12
service_subnet: 10.96.0.0/12
apiserver_port: 6443                     # apiserver 本地监听端口(LB 后端)
apiserver_lb_port: 8443                  # 经 VIP 访问 apiserver 的端口(kubeadm controlPlaneEndpoint + LB 前端)
kube_criSocket: unix:///run/containerd/containerd.sock   # 默认 containerd; cri-dockerd 用 unix:///var/run/cri-dockerd.sock

# ---- kubelet 调优 ----
# CPU 管理策略: none(通用默认,兼容任意硬件) / static(CPU 绑核, 仅 AI 物理机)
kubelet_cpu_manager_policy: "none"
# 仅 static 且硬件满足 sockets<=NUMA 节点数时才设 true(否则 kubelet 起不来)
kubelet_cpu_align_by_socket: false
kubelet_max_pods: 110                    # AI 大节点可调大(注意 pod CIDR 每节点容量)
# 资源预留(通用默认; AI 大节点可调大)
kubelet_kube_reserved_cpu: "200m"
kubelet_kube_reserved_mem: "512Mi"
kubelet_system_reserved_cpu: "200m"
kubelet_system_reserved_mem: "256Mi"

# ---- 安装路径 ----
nginx_dir: /data/nginx                   # nginx-ha 安装目录
keepalived_dir: /data/keepalived         # keepalived 安装目录
etcd_install_dir: "/opt/etcd"            # etcd 二进制目录
etcd_data_dir: "/var/lib/etcd"           # etcd 数据目录

# ---- etcd 调优 ----
etcd_cert_expiry: "36500"                # etcd 证书有效期(天)
etcd_cluster_token: "prod-etcd-cluster-01"
etcd_config:
  quota_backend_bytes: 8589934592        # 8G
  auto_compaction_retention: "1h"
  auto_compaction_mode: periodic
  heartbeat_interval: 500
  election_timeout: 5000
  log_level: info

# ---- 在线镜像 / 下载源(官网受限时改这里;离线不用管) ----
kube_image_mirror: "registry.aliyuncs.com/google_containers"   # kubeadm 组件在线仓
# CNI 在线镜像仓(海外原仓,受限可换国内 mirror)
calico_registry_online: "docker.io/calico"
flannel_registry_online: "docker.io/flannel"
cilium_registry_online: "quay.io/cilium"
cilium_helm_repo: "https://helm.cilium.io"
# 容器加速器(containerd/docker registry mirror)
docker_mirrors:
  - "https://docker.hlmirror.com"
  - "https://docker.1ms.run"
  - "https://docker.m.daocloud.io"
  - "https://proxy.1panel.live"
# 二进制在线下载源
k8s_bin_mirror: "https://dl.k8s.io/release"          # 国内可换 https://mirrors.aliyun.com/kubernetes-new/...
etcd_bin_mirror: "https://mirrors.huaweicloud.com/etcd"   # 华为云,国内稳
# containerd/runc/crictl 走 github, 国内用代理(ghfast.top 等,可换)
gh_proxy: "https://ghfast.top/https://github.com"
containerd_bin_mirror: "{{ gh_proxy }}/containerd/containerd/releases/download"
runc_bin_mirror: "{{ gh_proxy }}/opencontainers/runc/releases/download"
crictl_bin_mirror: "{{ gh_proxy }}/kubernetes-sigs/cri-tools/releases/download"

# ---- DNS(Debian 系初始化用) ----
dns:
- 114.114.114.114
- 223.5.5.5
domains: "local.clusters"
