# ================= VRRP 传输方式(keepalived) =================
# true(默认) = 单播: 显式把对端 IP 列进 unicast_peer, VRRP 报文点对点发送。
# false      = 组播: keepalived 的默认行为, 报文发往 224.0.0.18, 依赖交换机在同 VLAN 内泛洪。
#
# 为什么默认改成单播(2026-09-10 现网踩过):
#   某站点三台 LB, .1 的 VRRP 组播【出了物理口】(eth3 上 tcpdump 抓到了)但交换机没转发给
#   同 VLAN 的另外两台, 而 .2 <-> .3 之间双向正常 —— 单向组播故障。后果:
#     .1 收得到 .2 的 advert 却每秒 "forcing new election" 无人响应;
#     .2 收不到 .1, 认定自己是唯一 MASTER -> 两台同时持 VIP 且【永不收敛】。
#   表面还能用(两台跑同样的 haproxy、后端同样几台 apiserver), 但双方 GARP 互打、
#   交换机 ARP 表在两个 MAC 间抖, 症状是偶发 apiserver 连接重置, 极难定位。
#   改单播后立即收敛, 且故障转移实测正常(停 MASTER -> VIP 漂移 -> 恢复 -> 漂回)。
#
# 单播的代价: 每台要知道对端 IP, 所以【只支持同一 play 内的固定成员】。
#   本模板从 groups['k8slb'] 自动生成并排除自己, 不需要手填 —— 手填极易出错:
#   现网手工改时三台的 unicast_src_ip 全复制成了同一个 IP, 非本机地址 bind 失败
#   (bind unicast_src ... failed 99 - Cannot assign requested address)-> 直接进 FAULT
#   状态, 不参与选主也不持 VIP。
#
# 什么时候用组播: LB 成员会动态增减、或交换机组播确认可靠且希望少改配置时。
lb_vrrp_unicast: true

# ---- 抢占策略(三选一) ----
#   immediate  原主恢复后【立即】抢回 VIP。VRRP 默认行为。
#   delay      原主恢复后等 lb_vrrp_preempt_delay 秒再抢回 —— 仍然会回切, 只是防抖动。
#   nopreempt  原主恢复后【永不】抢回。VIP 一直留在当前 MASTER, 直到它自己故障。
#
# ⚠ 三者的关键前提: nopreempt 与 preempt_delay 【只在 state BACKUP 下生效】。
#   本模板因此在这两种模式下把所有节点都渲染成 state BACKUP。
#   历史上模板写的是 `state MASTER` + `nopreempt`, keepalived 启动时直接报
#     (VI_1) Warning - nopreempt will not work with initial state MASTER - clearing
#   把 nopreempt 清掉 —— 也就是说那行配置一直【没生效】, 实际行为是 immediate。
#   配置意图与实际行为不一致, 后来人会误判"已经配了不回切"。
#
# ⚠ 全节点 state BACKUP 的副作用: 冷启动(全部同时起)时没有天然的 MASTER,
#   要等约 3×advert_int(默认 3 秒)选主才有 VIP。热启动/单台重启不受影响。
#
# ⚠ nopreempt 的取舍: 它保证不回切, 但也意味着【VIP 可能长期停在低优先级节点上】。
#   若各 LB 节点性能不对等(比如首台配置更好), 或希望 VIP 有确定的归属, 用 delay 更合适。
lb_vrrp_preempt_mode: delay
# delay 模式下等待多少秒再抢回。太短起不到防抖作用, 太长则故障恢复后 VIP 归位慢。
# keepalived 允许 0-1000; 5-30 秒是常见区间。
lb_vrrp_preempt_delay: 10

# ================= Nginx / Keepalived 派生路径(nginx_dir/keepalived_dir 在 env.yaml) =================
nginx_conf_dir: "{{ nginx_dir }}/conf"
nginx_logs_dir: "{{ nginx_dir }}/logs"
nginx_sbin_dir: "{{ nginx_dir }}/sbin"
keepalived_conf_dir: "{{ keepalived_dir }}/etc"
keepalived_sbin_dir: "{{ keepalived_dir }}/sbin"

# ================= 派生: 离线路径 / Harbor 地址 =================
offline_artifacts: "{{ playbook_dir | dirname }}/offline/artifacts"

# ---- 离线预取范围(prefetch-all.sh 经 versions.env 读取; 临时可用 ARCH=/DISTRO= 环境变量覆盖) ----
# 学 kk 的思路: 本套集群「什么架构、哪些系统」在 env.yaml 声明一次, 预取自动只下这些, 不用每次手打 ARCH=/DISTRO=。
# 默认全 all = 现状(双架构、全发行版), 不改任何人行为。优先级: 环境变量 > env.yaml(这里) > all。
offline_arch: all              # amd64 | arm64 | all —— 下载哪些架构(对 k8s/docker/packages 各层都生效)
offline_distros: all           # all 或列表 [ubuntu, kylin, openeuler] —— packages(系统依赖包)层下哪些发行版
harbor_dns: "{{ harbor_instances[0].dns }}"
harbor_ip: "{{ harbor_instances[0].ip }}"
registry: "{{ harbor_dns }}/{{ harbor_project | default('kubernetes') }}"   # 自建 harbor 前缀(项目名可在 env.yaml 覆盖, 默认 kubernetes)

# ================= apt 代理(playbook/apt-proxy.yaml 用) =================
# ⚠ 这是【站点专属值】, 必须在 env.yaml 里覆盖, 别改 playbook ——
#   原先 apt-proxy.yaml 把地址硬编码在 vars 里, 每个站点都得改那一行, 于是每次
#   git pull 都撞 "Your local changes would be overwritten by merge"。
#   env.yaml 在 .gitignore 里(不入库), 值放那儿就再也不会和上游打架。
# 用法(inventory/group_vars/all/env.yaml):
#   apt_proxy_url: "http://10.14.73.20:3128"
# 下面这个默认值只是兜底(保持引入本变量之前 playbook 里的写法), 基本一定要覆盖。
apt_proxy_url: "http://10.2.0.15:3128"

# ================= k8s 版本配套(A 组自动派生) =================
# ================= 版本兜底(env.yaml 未定义时生效) =================
# ⚠ 这些是【变参】, 正常由 env.yaml 提供(见 tmp/env.yaml.example)。这里给兜底是因为
#   scripts/offline/versions.env.j2 会引用它们 —— 精简版/老版 env.yaml 少写任一项,
#   gen-offline-versions.yaml 就会 undefined 渲染失败, 连带 prefetch 拿不到版本。
#   env.yaml 后加载, 写了就覆盖这里, 不影响现有站点。
k8s_version: "1.34.3"
containerd_version: "1.7.32"
runc_version: "1.1.12"
docker_version: "29.4.2"
buildx_version: "0.32.1"
compose_version: "2.32.4"
cri_dockerd_version: "0.3.16"
calico_version: "3.31.3"
flannel_version: "0.26.7"
flannel_cni_version: "1.6.2-flannel1"
cilium_version: "1.16.5"
helm_version: "3.18.5"                   # 不带 v; 模板会拼 helm-v{{helm_version}}
multus_cni_version: "4.2.4"
# 装哪个 CNI。被 roles/cni 及 k8s-cni-switch / sync-cni-images 裸引用(9 处 {{ }} + 6 处 when:,
# 均无 default()), 精简 env.yaml 少这一项会直接 undefined。取值 = example 与 2492b30^ 一致。
kube_network_plugin: calico              # calico(manifest) / flannel(manifest) / cilium(helm)

k8s_minor: "{{ k8s_version.split('.')[0] ~ '.' ~ k8s_version.split('.')[1] }}"
# k8s 小版本 -> 配套组件(兜底默认). 权威值在装 k8s 时由 `kubeadm config images list` 自动查询覆盖
# (见 roles/kubernetes/kube-init-master/tasks/sync-images-to-harbor.yml),一般不用手维护此表。
# 仅用于 containerd sandbox 的 pause(k8s 装之前就要用)+ 离线兜底。只列在用版本,新版本自动查,pause 变号再加行。
# 校准记录(避免后人重复怀疑):
#   1.36 那行四项已全部实测核对 ——
#     coredns/pause/etcd 来自 `kubeadm config images list --kubernetes-version v1.36.3`
#       (输出 etcd:3.6.8-0, 表里取二进制版本 3.6.8, 去掉镜像构建后缀 -0)
#     crictl 1.36.0 由实际下载的二进制 `crictl -v` 确认
#   1.35 那行实测核对(2026-09-11): kubeadm v1.35.8 给出 coredns v1.13.1 / pause 3.10.1 /
#     etcd 3.6.6-0; crictl 取 1.35.0(cri-tools 只发 minor.0, 无补丁版)。
#   crictl 官方兼容 k8s ±1 个次要版本, 故各行的 crictl 需与该行 k8s 次要版本对齐, 不可混用
#   (如 1.36.0 覆盖 1.35/1.36/1.37, 但不覆盖 1.34)。
# ⚠ 换 k8s 次要版本必须先加对应行 —— 缺行时 crictl_version 兜底成补丁版(如 1.35.8)必然 404。
k8s_compat:
  "1.28": { coredns: "1.10.1", pause: "3.9",    crictl: "1.28.0", etcd: "3.5.12" }
  "1.34": { coredns: "1.12.1", pause: "3.10.1", crictl: "1.34.0", etcd: "3.6.5"  }
  "1.35": { coredns: "1.13.1", pause: "3.10.1", crictl: "1.35.0", etcd: "3.6.6"  }
  "1.36": { coredns: "1.14.2", pause: "3.10.2", crictl: "1.36.0", etcd: "3.6.8"  }
coredns_version:     "{{ (k8s_compat[k8s_minor] | default({})).coredns | default('1.12.1') }}"
pause_image_version: "{{ (k8s_compat[k8s_minor] | default({})).pause   | default('3.10.1') }}"
crictl_version:      "{{ (k8s_compat[k8s_minor] | default({})).crictl  | default(k8s_version) }}"
# etcd 跟随 k8s 版本, 不在 env.yaml 手写。三处取值口径:
#   下载端: download-k8s-offline.sh 跑 `kubeadm config images list` 校准(权威值), 按 v<版本>/ 建目录;
#   离线部署: roles/etcd/etcd-install 直接扫 offline/artifacts/etcd/ 用实际下到的版本(不看本表);
#   在线部署: 用下面这个派生值兜底。
# ⚠ 本表是兜底, 会随 k8s 补丁版飘(如 1.34.3 实际是 3.6.5 而非 3.6.4) —— 以 kubeadm/物料为准。
etcd_version:        "{{ (k8s_compat[k8s_minor] | default({})).etcd    | default('3.6.5') }}"

# ===== 在线下载源 / 镜像源(默认值; 可在 env.yaml 覆盖) =====
# 说明: 这些是【在线模式】拉镜像/下二进制的源。默认值放这里, 保证即便 env.yaml
#       是旧版/精简版没写它们, 下面的派生列表也不会因 undefined 而报错。
#       想换源/加代理, 在 env.yaml 里重定义同名变量即可覆盖本默认(env.yaml 后加载胜出)。
kube_image_mirror: "registry.aliyuncs.com/google_containers"   # kubeadm 组件在线仓
calico_registry_online: "docker.io/calico"
flannel_registry_online: "docker.io/flannel"
cilium_registry_online: "quay.io/cilium"
cilium_helm_repo: "https://helm.cilium.io"
docker_mirrors:
  - "https://docker.hlmirror.com"
  - "https://docker.1ms.run"
  - "https://docker.m.daocloud.io"
  - "https://proxy.1panel.live"
k8s_bin_mirrors:
  - "https://files.m.daocloud.io/dl.k8s.io/release"
  - "https://dl.k8s.io/release"
etcd_bin_mirrors:
  - "https://mirrors.huaweicloud.com/etcd"
  - "https://files.m.daocloud.io/github.com/etcd-io/etcd/releases/download"
helm_bin_mirrors:
  - "https://mirrors.huaweicloud.com/helm/v{{ helm_version }}"
  - "https://get.helm.sh"
gh_proxies:
  - "https://ghfast.top/https://github.com"
  - "https://ghproxy.net/https://github.com"
  - "https://mirror.ghproxy.com/https://github.com"
download_retries: 3
download_delay: 5
download_timeout: 30

# ===== 派生: github 类二进制的多源下载列表(由 env.yaml 的 gh_proxies 拼各仓库路径) =====
# 每个源都是 <代理前缀>/<owner>/<repo>/releases/download; 下载时再接 /v{ver}/<文件名>。
# ghfast 风格(.../https://github.com) 与 daocloud 风格(.../github.com) 都能这样拼。
containerd_bin_mirrors: "{{ gh_proxies | map('regex_replace', '$', '/containerd/containerd/releases/download') | list }}"
runc_bin_mirrors:       "{{ gh_proxies | map('regex_replace', '$', '/opencontainers/runc/releases/download') | list }}"
crictl_bin_mirrors:     "{{ gh_proxies | map('regex_replace', '$', '/kubernetes-sigs/cri-tools/releases/download') | list }}"

# ================= 派生: 镜像仓库(离线 Harbor / 在线 mirror) =================
kube_image_repository: "{{ registry if (is_offline | default(false) | bool) else kube_image_mirror }}"
calico_images:
  cni:             "{{ (registry ~ '/calico-cni')             if (is_offline | default(false) | bool) else (calico_registry_online ~ '/cni') }}:v{{ calico_version }}"
  node:            "{{ (registry ~ '/calico-node')            if (is_offline | default(false) | bool) else (calico_registry_online ~ '/node') }}:v{{ calico_version }}"
  kube_controllers: "{{ (registry ~ '/calico-kube-controllers') if (is_offline | default(false) | bool) else (calico_registry_online ~ '/kube-controllers') }}:v{{ calico_version }}"
flannel_images:
  flannel:        "{{ (registry ~ '/flannel')        if (is_offline | default(false) | bool) else (flannel_registry_online ~ '/flannel') }}:v{{ flannel_version }}"
  flannel_cni:    "{{ (registry ~ '/flannel-cni-plugin') if (is_offline | default(false) | bool) else (flannel_registry_online ~ '/flannel-cni-plugin') }}:v{{ flannel_cni_version }}"

# ================= Calico 双 IPPool(GPU/CPU 分池, 可选) =================
# 默认关闭 —— 走原来的单池逻辑(calico 用 CALICO_IPV4POOL_CIDR/podSubnet 自建一个池),
# 现有站点/生产 111 节点集群不受影响。仅当需要按硬件类型隔离 Pod 网段时才开。
#
# 开启方式(env.yaml):
#   calico_dual_ippool_enabled: true
#   calico_gpu_pool_cidr: <GPU 段, 自己规划, 不与 service_subnet/LB/ApiServer 冲突>
#   calico_cpu_pool_cidr: <CPU 段, 同上>
#   pod_subnet 改填能同时覆盖上面两段的超网(仅用于 kubeadm --cluster-cidr 语义占位;
#     实际分池由下面两个 IPPool 决定, calico 不会再用 podSubnet 自建默认池)
#
# 节点归池判定: 按 inventory 里已有的 accelerator_type(nvidia/dcu/npu -> gpu 池,
# none/未写 -> cpu 池), 见 kube-add-node / kube-add-master / kube-init-master 里的打标签任务。
# 也可在某台机器的 inventory 行显式写 calico_pool=cpu(或 calico_pool=gpu)覆盖自动判定
# (不用自己拼 "hardware=xxx" 这种键值对里套键值对的格式)。
calico_dual_ippool_enabled: false
# blockSize 决定"每节点一次拿多少地址"。calico 按块分配, 节点上 Pod 数超过一块容量就再要一块,
# 所以【池内块数不等于可容纳节点数】—— 可容纳节点数 = 块数 / ceil(每节点Pod数 / 每块地址数)。
# 规划时按"实际每节点 Pod 数"算, 别只看块数。注意 kubelet_max_pods 默认 110:
#   /28(16 地址) 跑满 110 需 7 块;  /26(64 地址) 跑满 110 需 2 块。
calico_gpu_pool_blockSize: 28    # 每块 16 个地址; GPU 节点 Pod 数通常不多(但别忘 DaemonSet 也占)
calico_cpu_pool_blockSize: 26    # 每块 64 个地址; 若 CPU 节点真按 kubelet_max_pods=110 跑, 每节点要 2 块
# ---- 两池的资源名(IPPool 的 metadata.name) ----
# ⚠ 必须与【线上现有】的池名一致。kubectl apply 按 metadata.name 匹配 —— 名字对不上时
#   它会【新建】一个池而不是更新现有的, 于是同一段地址出现两个池, 且两者 nodeSelector
#   相同(hardware == "gpu"/"cpu"), 同一节点同时匹配两个池, IPAM 从哪个取块变得不确定。
#   这条在【换 calico 版本】时最容易踩: k8s-cni.yaml 会连带 apply 双池 IPPool(见
#   roles/cni/tasks/calico.yaml 的 "apply 双池 IPPool"), 不是只更新主 manifest。
# 手工建过池、名字不是默认值的站点(如带 -v2 后缀), 在 env.yaml 里覆盖成实际名字:
#   calico_gpu_pool_name: gpu-pool-v2
#   calico_cpu_pool_name: cpu-pool-v2
# 核对线上实际名字: kubectl get ippools.crd.projectcalico.org
calico_gpu_pool_name: gpu-pool
calico_cpu_pool_name: cpu-pool
# 两池 CIDR 必填(calico_dual_ippool_enabled=true 时), 由使用者自己规划。
# roles/cni/tasks/calico.yaml 开头有 assert 校验【非空 + 形如 a.b.c.d/n】; 但做不到:
#   掩码取值合法性(/33 也通过) / 两池是否重叠 / 池与 service_subnet 是否重叠 /
#   pod_subnet 是否覆盖两池 —— 这些要 netaddr 滤镜(本仓库无该依赖), 需自行验算,
#   算法与 python 片段见 docs/部署说明.md 十三.1。
calico_gpu_pool_cidr: ""
calico_cpu_pool_cidr: ""
cilium_image_repo: "{{ registry if (is_offline | default(false) | bool) else cilium_registry_online }}"

# ================= 离线包路径(多版本 v{{k8s_version}}) =================
k8s_bin_src: "{{ offline_artifacts }}/kubernetes/v{{ k8s_version }}/bin"
src_k8s_images_dir: "{{ offline_artifacts }}/kubernetes/v{{ k8s_version }}/images"
k8s_images_dir: "/opt/kubernetes"
src_calico_images_dir: "{{ offline_artifacts }}/cni/calico/v{{ calico_version }}/images"
calico_images_dir: "/opt/calico"
src_flannel_images_dir: "{{ offline_artifacts }}/cni/flannel/v{{ flannel_version }}/images"
flannel_images_dir: "/opt/flannel"
src_cilium_images_dir: "{{ offline_artifacts }}/cni/cilium/v{{ cilium_version }}/images"
cilium_images_dir: "/opt/cilium"
src_multus_cni_images_dir: "{{ offline_artifacts }}/cni/multus/v{{ multus_cni_version }}/images"
multus_cni_images_dir: "/opt/multus_cni"
helm_bin_src: "{{ offline_artifacts }}/helm/v{{ helm_version }}"
cilium_chart_src: "{{ offline_artifacts }}/cni/cilium/v{{ cilium_version }}/cilium-{{ cilium_version }}.tgz"

# ================= NodeLocal DNSCache (每节点本地 DNS 缓存) =================
# 忠实复刻现网(KubeKey/KubeSphere 风味): DS/CM/SA 名 nodelocaldns, 单绑, 转发现网 coredns svc。
# 查询链: Pod(clusterDNS=nodelocaldns_ip) -> nodelocaldns 本地缓存 -> CoreDNS。部署: playbook/nodelocaldns.yaml。
nodelocaldns_ip: "169.254.25.10"                 # link-local; 必须与各节点 kubelet clusterDNS 一致(现网即此值)
# 是否启用 NodeLocal DNSCache。置 true 会让 kubeadm 模板把 kubelet 的 clusterDNS 指向
# nodelocaldns_ip(否则 Pod 仍直连 coredns ClusterIP, 装了 nodelocaldns 也不走它)。
# 置 true 后, k8s-init-master 会在 CNI 之后自动部署 nodelocaldns DaemonSet(与 kk 同款做法),
# 无需再单独跑 playbook/nodelocaldns.yaml(该 playbook 保留, 供事后单独部署/重配)。
# clusterDNS 在 kubeadm init 时即写死是安全的: nodelocaldns/coredns 都是 hostNetwork +
# dnsPolicy Default, 走宿主机 DNS 启动, 不依赖集群内解析。worker 由 kubeadm join 拉取
# 集群的 kubelet-config ConfigMap, 自动继承该值, 无需单独配置。
# 本模板是单绑(link-local)形态, iptables / ipvs 两种 kube-proxy 模式都适用。
enable_nodelocaldns: false
nodelocaldns_version: "1.26.4"                    # k8s-dns-node-cache 版本(现网 1.26.4), 可 env.yaml 覆盖
# 1.26.4 是 registry.k8s.io/dns 的正规上游 tag(现网镜像即拉自此)。在线走 daocloud 的 k8s 代理(国内快);
# 离线由 download-k8s-offline.sh 从同源拉好存 tar, 部署时 load 进自建 Harbor。不再走 kk hub。
nodelocaldns_image_online: "k8s.m.daocloud.io/dns/k8s-dns-node-cache"   # = registry.k8s.io/dns/...(可 env.yaml 覆盖)
nodelocaldns_image: "{{ (registry ~ '/k8s-dns-node-cache:' ~ nodelocaldns_version) if (is_offline | default(false) | bool) else (nodelocaldns_image_online ~ ':' ~ nodelocaldns_version) }}"
nodelocaldns_coredns_svc: "coredns"              # 上游 CoreDNS Service 名(kk=coredns; kubeadm 原生=kube-dns)
nodelocaldns_health_port: 9254
nodelocaldns_metrics_listen: "127.0.0.1:9353"
# 站点定制(默认空; 现网的桩区/registry hosts 写进 gitignored env.yaml, 见 env.yaml.example):
#   nodelocaldns_stub_zones: 每项 {zone, forward, cache(可选,默认30), health(可选 true)}
#   nodelocaldns_hosts:      .:53 里的静态解析, 每项 {ip, names:[...]}
nodelocaldns_stub_zones: []
nodelocaldns_hosts: []
src_nodelocaldns_images_dir: "{{ offline_artifacts }}/kubernetes/v{{ k8s_version }}/images"   # node-cache tar 与 k8s 组件镜像同目录
nodelocaldns_images_dir: "/opt/nodelocaldns"

# ================= kubelet 证书有效期(走 CSR 签发) =================
# kubeadm 直接签的控制面证书由 caCertificateValidityPeriod/certificateValidityPeriod 控制(100y);
# 但 kubelet 的 client/serving 证书是走 CSR 由 controller-manager 签的, 归 --cluster-signing-duration
# 管, 默认才 8760h(1y) —— 两者不一致会让 kubelet 证书 1 年就到期。这里对齐 100 年。
# 876000h = 100y, 与 kubeadm-config 的 certificateValidityPeriod 同值。
kube_signing_duration: "876000h"
# 是否在 KubeletConfiguration 的 featureGates 里【显式】写 RotateKubeletServerCertificate: true。
# 该 gate 自 k8s 1.12 起默认即为 true, 显式写出不改变行为, 只是让"serving 证书会自动轮换"
# 在配置里可见, 并与现网 kk 集群的写法一致。
# ⚠ 它已 GA-locked: 未来某个版本移除该 gate 后, kubelet 见到它会【启动失败】。
#   届时把本项置 false 即可(行为不变, 只是不再显式声明), 无需改模板。
kubelet_rotate_server_cert_gate: true

# ================= 节点调优可选开关(与本仓库既有默认值可能冲突, 故做成开关) =================
# 全部默认【关】—— 不影响现网 111 节点集群及其它站点。需要的站点在 env.yaml 逐项打开。
#
# ---- 已废弃(2026-09-09): node_tuning_sysctl / node_tuning_keep_higher_net_buffers ----
# 交付标准 1.6 的 13 项 sysctl 原先走 /etc/sysctl.d/99-node-tuning.conf drop-in, 由这两个
# 变量控制。现已【全部合并进 roles/init/files/sysctl.conf】, 模板与这两个变量一并删除。
#
# 为什么合并: drop-in 想靠 99- 前缀覆盖主配置, 但方向搞反了 —— systemd 把
# /etc/sysctl.conf 当作 99-sysctl.conf 处理, 字母序 99-node-tuning < 99-sysctl,
# 于是主配置【后】加载、一律覆盖 drop-in 的同名项。现网 35 节点实测: 两处都定义的 6 项
# 全按 sysctl.conf 生效(netdev_max_backlog/rmem_max/wmem_max/file-max/inotify×2),
# 只在 drop-in 里定义的 5 项才真正生效。keep_higher_net_buffers 因此一直是空转的。
#
# ⚠ 若你的 env.yaml 里还留着这两行, 删掉即可 —— 它们现在【不被任何代码读取】,
#   留着会让人误以为改它们能调整 sysctl。改这 13 项请直接改 files/sysctl.conf。
#
# kubelet: podPidsLimit: -1(不限) + serializeImagePulls: false(并行拉镜像)
# ⚠ -1 等于【放弃单 Pod 进程数上限】, fork 炸弹可打满整机 pid。
#   本仓库默认 kubelet_pod_pids_limit=50000(既够用又留保护); 仅在明确需要不限时打开。
kubelet_unlimited_pids: false

# calico 封装: none(纯 BGP) / crosssubnet / ipip / vxlan —— 见 env.yaml.example
# CNI conflist 是否启用 bandwidth 插件(Pod 限速: kubernetes.io/{ingress,egress}-bandwidth 注解)。
# ⚠ 默认 false —— 与现网生产集群(calico 3.27, conflist 本就无此段)行为一致。
#   calico-cni 镜像【不含】bandwidth 二进制(镜像里只有 calico/calico-ipam/flannel/host-local/
#   install/loopback/portmap/tuning), 它属于上游 containernetworking/plugins 包。而 calico 3.28+
#   官方 manifest 默认写了这段却不提供该二进制 —— 升级到 3.31 后就会:
#     plugin type="bandwidth" failed (add): failed to find plugin "bandwidth" in path [/opt/cni/bin]
#   → 全节点所有 Pod 都建不了 sandbox(coredns/calico-kube-controllers 卡 ContainerCreating)。
#   确需限速再置 true: kube-common 会自动给每个节点装 cni-plugins 包(见下方 cni_plugins_*)。
calico_enable_bandwidth: false

# calico-node 用哪种方式自动探测本机 IP(BGP 对端地址 / 隧道源地址)。
# 默认 first-found = calico 上游默认, 保持现网行为不变: 按网卡顺序取第一个非本地地址。
# ⚠ 多网卡机器上 first-found 很容易挑错(挑到管理网/存储网), 表现为跨节点 Pod 不通、
#   或流量走错网卡; 而 kubelet 那层已用 kube_node_ip 钉成 ansible_host(见上方),
#   两层不一致时症状很像"CNI 没装好", 排查费劲。
# 多网卡站点建议在 env.yaml 设为 kubernetes-internal-ip —— 直接跟随 Node 的 InternalIP
#   (即 kubelet 上报、已被 kube_node_ip 钉死的那个地址), 两层自动对齐。
# 其它可选写法: interface=bond0 / interface=eth.* / can-reach=<网关IP> / cidr=10.14.64.0/24
# ⚠ 改这个值会让 calico-node 重启并重新选址 —— 已跑起来且当前挑对了的集群不要动。
calico_ip_autodetection_method: first-found

# ---- CNI 标准插件包(containernetworking/plugins) ----
# 提供 bandwidth/portmap/tuning/firewall 等; calico 只装自己那几个, 这个包要另外装。
cni_plugins_version: "1.6.2"
cni_plugins_bin_dir: /opt/cni/bin
cni_plugins_bin_src: "{{ offline_artifacts }}/cni/plugins/v{{ cni_plugins_version }}"
cni_plugins_mirrors:
  - "https://files.m.daocloud.io/github.com/containernetworking/plugins/releases/download"
  - "https://ghfast.top/https://github.com/containernetworking/plugins/releases/download"

# ================= 组件清单 =================
k8s_components:
- kube-apiserver
- kube-controller-manager
- kube-scheduler
- kube-proxy
calico_components:
- cni
- node
- kube-controllers
multus_cni_components:
- multus-cni

# ================= apiserver 入口(lbvip 空值统一处理) =================
# ⚠ lbvip 是可选的(单 master 不需要)。历史上四处写法不一致, 空串 lbvip: "" 时:
#     · `lbvip is defined` 判定为【真】(空串也算已定义) -> kubeadm 渲出 ":8443"、cilium 取 8443
#     · `default(x)` 不带 true 时空串【不】回退 -> cilium k8sServiceHost 渲成 ""
#   两者叠加会让单 master 站点在"写了空 lbvip"这种很自然的写法下静默坏掉。
#   故统一走下面两个派生变量, 各处不再各自判断。
# has_lbvip: 只有【已定义且非空】才算有 VIP
has_lbvip: "{{ (lbvip is defined) and ((lbvip | default('') | trim | length) > 0) }}"
# apiserver 入口地址/端口: 有 VIP 走 VIP:lb_port, 否则首 master:apiserver_port
apiserver_entry_host: "{{ lbvip | default(hostvars[groups['k8s_master'][0]].ansible_host, true) if (has_lbvip | bool) else hostvars[groups['k8s_master'][0]].ansible_host }}"
apiserver_entry_port: "{{ apiserver_lb_port if (has_lbvip | bool) else apiserver_port }}"
# 端口兜底(与 13 个版本变量同理: versions/模板都要用, 精简 env.yaml 不该 undefined)
apiserver_port: 6443
apiserver_lb_port: 8443
# ============================================================================
#  ⚠【故意不在此兜底】的 4 个: pod_subnet / service_subnet / dns_domain / etcd_data_dir
#
#  它们都是【建集群后不可改】的值 —— 改了等于重建集群或重签证书。给兜底的代价是:
#  精简版 env.yaml 会【静默】拿到默认值而不是报错, 拿错网段建完集群才发现, 代价是重建。
#  对这 4 个, "宁可明确报错也别猜" 比 "不炸" 更合理。
#
#  改为在真正消费它们的 role 里做预检 assert, 缺了就明确报错并告知该在 env.yaml 填什么:
#    pod_subnet     -> kube-init-master/tasks/main.yml + cni/tasks/main.yaml
#    service_subnet -> kube-init-master/tasks/main.yml
#    dns_domain     -> kube-init-master/tasks/main.yml + nodelocaldns/tasks/main.yml
#    etcd_data_dir  -> etcd/etcd-common/tasks/main.yaml + etcd/etcd-destroy/tasks/main.yml
#  (放 role 而非 playbook: 所有入口 playbook 自动覆盖, 不会漏掉单独跑的那些)
#
#  取值见 tmp/env.yaml.example, 必须在 env.yaml 显式写。【不要往这里加默认值。】
# ============================================================================

# ---- kubeadm-config 模板要用的其余变量, 兜底 ----
# 下面这些被 kube-init-master/templates/kubeadm-config.yaml.j2 【裸引用、无 default()】,
# 且都在模板顶层(不在 {% if %} 守卫内), 原先只定义在 tmp/env.yaml.example 里 ——
# 早先生成的精简版 env.yaml 少任一项, 跑 k8s-init-master 就在渲染模板时报 undefined。
# 只补 example 治不了已生成的老 env.yaml(改 example 不回写 live), 故在此兜底。
# 取值 = 当前 tmp/env.yaml.example 的值(权威口径; 不取 2492b30^ 基线 —— 其中
#   kubelet_pod_pids_limit 已由 7d82b51 有意从 10000 调到 50000)。
# env.yaml 后加载, 写了仍然覆盖这里; 这里只保证"不写也不炸"。
#
# ⚠ pod_subnet / service_subnet 不在这里兜底(见上方那段说明), 改走 role 内预检 assert。
kube_proxy_mode: ipvs                    # ipvs(默认,需内核 ip_vs 模块) / iptables(无 ipvs 时退回)
# kubelet 资源预留 / 驱逐阈值 / 日志与关机宽限。这些是【调优值】, 按机型该调:
#   AI 大节点常调 kubelet_max_pods 与两组 *_reserved_*; 调之前先看清各项含义。
kubelet_cpu_manager_policy: "none"       # none(通用) / static(CPU 绑核, 仅 AI 物理机)
kubelet_kube_reserved_cpu: "200m"
kubelet_kube_reserved_mem: "512Mi"
kubelet_system_reserved_cpu: "200m"
kubelet_system_reserved_mem: "256Mi"
kubelet_eviction_hard_mem: "5%"          # 硬驱逐: 低于此立即驱逐 Pod(无宽限)
kubelet_eviction_soft_mem: "10%"         # 软驱逐: 低于此且持续超宽限期才驱逐
kubelet_eviction_soft_grace: "1m30s"     # 软驱逐宽限期
kubelet_eviction_max_pod_grace: 120      # 驱逐时给 Pod 的最大优雅退出秒数
kubelet_eviction_pressure_transition: "30s"   # 退出驱逐压力状态的最短停留(防抖)
kubelet_max_pods: 110                    # AI 大节点可调大(注意 pod CIDR 每节点容量)
# 仅在 kubelet_unlimited_pids=false(本文件默认)时生效; 为 true 时模板走 podPidsLimit: -1
kubelet_pod_pids_limit: 50000            # 单 Pod 最大进程数(防 fork 炸弹); AI 训练易撞 1w, 故 5w
kubelet_container_log_max_size: "5Mi"    # 单容器日志文件上限
kubelet_container_log_max_files: 3       # 容器日志保留文件数
kubelet_shutdown_grace: "30s"            # 节点关机时给普通 Pod 的优雅退出时间
kubelet_shutdown_grace_critical: "10s"   # 其中留给关键 Pod 的部分

# ================= k8s 路径 =================
kube_bin_dir: /usr/local/bin
kube_config_dir: /etc/kubernetes
kubelet_config_dir: /var/lib/kubelet
kubelet_pki_dir: /var/lib/kubelet/pki        # kubelet 自持的证书(client/serving current.pem 都在这)
kubelet_service_dir: /etc/systemd/system/kubelet.service.d
# kubelet 资源预留已移到 env.yaml(kubelet_kube_reserved_* / kubelet_system_reserved_*)
# kubelet 上报的 Node InternalIP。默认取 ansible_host(与 etcd/master advertiseAddress 同源),
# 钉死后 kubelet 不再靠「默认路由网卡」自选 IP(多网卡节点会选错, 如落到 10.101.16.x)。
# 每台可在 inventory 里单独覆盖: `cpu06 ansible_host=172.18.1.66 kube_node_ip=172.18.1.66`。
# 留空(既无 ansible_host 也未指定)则不下发 --node-ip, 退回 kubelet 默认自选行为。
kube_node_ip: "{{ ansible_host | default('', true) }}"
crictl_arch_map:
  x86_64: "crictl-v{{ crictl_version }}-linux-amd64.tar.gz"
  aarch64: "crictl-v{{ crictl_version }}-linux-arm64.tar.gz"

# ================= etcd(外置二进制集群) =================
# etcd_install_dir 原先只在 tmp/env.yaml.example 里定义, 但被裸引用(无 default()):
#   下面 etcd_bin_dir 直接派生它, 另在 etcd-install/etcd-common 的 tasks 里用 ——
#   即本节第一行就依赖一个可能未定义的变量, 精简版 env.yaml 跑 etcd-deploy 直接 undefined。
#   取值 = 当前 example 与 2492b30^ 基线一致(无漂移)。二进制目录改了重装即可, 故给兜底。
etcd_install_dir: "/opt/etcd"            # 二进制目录
# ⚠ etcd_data_dir 【故意不兜底】(见上方 "故意不在此兜底" 那段): 它是已建集群的数据落盘
#   位置, 猜错等于指向空目录、集群起不来, 且 etcd-destroy 会按它删目录。改走 role 内预检
#   assert(etcd-common / etcd-destroy), 必须在 env.yaml 显式写。【不要往这里加默认值。】
# etcd_config 整个 dict 也要兜底 —— etcd.conf.yml.j2 里 6 处写的是
#   {{ etcd_config.X | default(...) }}, 那个 default 守的是【属性】, 守不住 etcd_config 本身:
#   etcd_config 未定义时 jinja2 直接抛 UndefinedError('etcd_config' is undefined), default 不生效
#   (仅 ChainableUndefined 才会兜住, ansible 默认不用它)。安全写法应是 (x | default({})).attr,
#   即本文件 k8s_compat 那种; 此处不改模板, 用兜底 dict 达到同样效果。
# 取值 = 当前 example 与 2492b30^ 基线(两边一致)。注意 heartbeat/election 取 500/5000 ——
#   模板里那对 default(100)/default(1000) 是没同步的旧兜底, 别按它来。
etcd_config:
  quota_backend_bytes: 8589934592        # 8G
  auto_compaction_retention: "1h"
  auto_compaction_mode: periodic
  heartbeat_interval: 500
  election_timeout: 5000
  log_level: info
etcd_bin_dir: "{{ etcd_install_dir }}/bin"
etcd_conf_dir: "/etc/etcd"
etcd_cert_dir: "{{ etcd_conf_dir }}/ssl"
etcd_user: "etcd"
etcd_group: "etcd"
etcd_cluster_members: >-
  {{
    ((groups.etcd | default([])) + (groups.etcd_to_add | default([])))
    | difference(groups.etcd_to_delete | default([]))
    | unique
  }}
etcd_peer_port: 2380
