# ============================================================================
#  connection.yaml —— 连接身份(默认 root 直连; auto 探测为可选)
#
#  connect_as(默认 root, 在 env.yaml 覆盖):
#    root  → 强制 root 免密直连【本项目常态】: 集群全程 root 免密时用这个, 最稳最快。
#    sudo  → 强制 普通用户 + sudo(用 env.yaml 的 bootstrap_*; 控制机需装 sshpass)。
#    auto  → 逐台探测: 控制机能免密 ssh 到目标 root ? root : 用户+sudo。
#            仅用于「首次还没下发免密」的引导期(判不通即走 sudo, 正好用来跑 add-control-key)。
#
#  ⚠ auto 的探测是「group_var 里惰性跑 ssh」(BatchMode, ConnectTimeout=4), 有已知局限:
#     - delegate_to 场景(加节点/拿 join/etcd 等委派任务)委派机地址解析对不齐, 易误判 no →
#       误回退到 sudo, 撞上没填的 bootstrap_user 就报错。委派密集的操作请用 connect_as: root。
#     - 不认 ansible_ssh_common_args 里的跳板/ProxyJump; 慢节点可能 4s 超时误判。
#     故默认给 root; auto 只在首次引导时临时 -e connect_as=auto。
#
#  说明:
#    - root 探测/直连走【控制机当前用户】的 ssh key(先跑 add-control-key.yml 下发控制机公钥)。
#    - bootstrap_user / bootstrap_ssh_pass / bootstrap_become_pass 在 env.yaml 配(见示例);
#      root 全程免密时可不填(仅 sudo 分支才用到)。
#    - ansible_python_interpreter / ansible_ssh_common_args 仍在 hosts [all:vars] 配, 不受本文件影响。
#  彻底关掉本套逻辑: 删掉本文件, 回到 hosts/[all:vars] 手工配 ansible_user 等。
# ============================================================================

connect_as: root          # 默认 root 直连; 可在 env.yaml 覆盖为 sudo / auto

# 控制机 → 目标 root 免密是否可用(BatchMode 不交互, 4s 超时; 通=yes 否=no)
_root_login_ok: >-
  {{ lookup('pipe',
     'ssh -o BatchMode=yes -o ConnectTimeout=4 -o StrictHostKeyChecking=no'
     ~ ' -o UserKnownHostsFile=/dev/null -p ' ~ (ansible_port | default(22))
     ~ ' root@'
     ~ (ansible_host | default(inventory_hostname))
     ~ ' true >/dev/null 2>&1 && echo yes || echo no') }}

# 最终是否用 root(auto 且探测通, 或强制 root)
_use_root: >-
  {{ connect_as == 'root'
     or (connect_as == 'auto' and _root_login_ok == 'yes') }}

# —— 推导出的连接参数 ——
# 回退到「普通用户+sudo」但 bootstrap_user 没填时, mandatory 让它明确报错(而非默默用错身份)。
# ⚠ 不给 mandatory 传自定义消息 —— 老版本 Ansible(<2.8)的 mandatory 只收 1 个参数,
#    传消息会报 "mandatory() takes 1 positional argument but 2 were given"(与本机现象一致)。
#    缺 bootstrap_user 时的指引: 在 env.yaml 填 bootstrap_user(及 bootstrap_ssh_pass /
#    bootstrap_become_pass), 或用 -e connect_as=root 强制 root 免密直连。
# ternary 只求值命中的那支: root 直连时不会触发 mandatory。
ansible_user: >-
  {{ 'root' if (_use_root | bool)
     else (bootstrap_user | mandatory) }}
ansible_become: "{{ not (_use_root | bool) }}"
ansible_become_method: sudo
# 密码仅在有 bootstrap_* 时才带(root 全程免密→omit→纯密钥); root 分支即便带上, ssh 也先走密钥
ansible_ssh_pass: "{{ bootstrap_ssh_pass | default(omit) }}"
ansible_become_pass: "{{ bootstrap_become_pass | default(bootstrap_ssh_pass | default(omit)) }}"
