# 预取物料: 指定联网节点([stager] 组)下齐离线物料 -> 汇控制机 offline/artifacts/ -> 各节点离线装。
#
# 用法:
#   1) inventory [stager] 组填一台能联网、网速好的节点。
#   2) ansible-playbook playbook/prefetch-artifacts.yaml
#      可选覆盖:
#        -e prefetch_arch=amd64                                  # 纯单架构省一半(默认 all 双架构)
#        -e '{"prefetch_scripts":["download-k8s-offline.sh","download-harbor-offline.sh"]}'
#   3) 完成后物料在控制机 offline/artifacts/; 正式部署时 is_offline=true。
- hosts: stager
  gather_facts: yes
  roles:
    - prefetch-artifacts
