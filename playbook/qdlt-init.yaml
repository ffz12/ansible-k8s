---
# ============================================================================
#  qdlt-init.yaml —— 青岛联通交付标准 操作系统环境初始化
#
#  作用域: 【只做纯软件配置】
#    ✅ 时区 UTC + chrony 对时 / cloud-init 关闭 / apt 自动更新关闭
#    ✅ 统一登录账号 wwxq / CPU performance + TurboBoost / ipmitool
#    ✅ 主机名规范(CPU-xxx / GPU-SUn-xxx) / GRUB 固定内核 / 日志外送(可选)
#    ❌ 完全不碰网络: netplan、bond、vlan、RDMA hca_id、策略路由、IP、网卡驱动
#       —— 这些由 qdlt-check 只读体检出报告, 人工按报告处置
#
#  执行顺序建议:
#    1) ansible-playbook playbook/qdlt-check.yaml                  # 改之前先存档现状
#    2) ansible-playbook playbook/init.yaml                        # 通用基线(可选)
#    3) ansible-playbook playbook/qdlt-init.yaml -e @secrets.yml   # 本 playbook
#    4) ansible-playbook playbook/qdlt-check.yaml                  # 改之后复查出交付报告
#
#  用法:
#    # 密码从 inventory/qdlt-secrets.yml 传入(明文保存, 但该文件已 gitignore, 不得入库)
#    ansible-playbook playbook/qdlt-init.yaml -e @inventory/qdlt-secrets.yml
#    # 或临时:
#    ansible-playbook playbook/qdlt-init.yaml -e "qdlt_user_password=xxxx"
#
#    # 先空跑看会改什么(强烈建议)
#    ansible-playbook playbook/qdlt-init.yaml -e "qdlt_user_password=xxxx" --check --diff
#
#    # 只跑某一类(tags: pkgs/time/cloudinit/apt/user/cpu/hostname/grub/syslog)
#    ansible-playbook playbook/qdlt-init.yaml -e "qdlt_user_password=xxxx" --tags time,cpu
#
#    # 跳过风险最高的 GRUB 改动
#    ansible-playbook playbook/qdlt-init.yaml -e "qdlt_user_password=xxxx" --skip-tags grub
# ============================================================================

- name: 青岛联通交付标准 —— 操作系统环境初始化
  hosts: qdlt
  gather_facts: yes
  become: yes
  serial: "{{ qdlt_serial | default('100%') }}"   # 需要灰度时: -e qdlt_serial=1
  roles:
    - qdlt-init
