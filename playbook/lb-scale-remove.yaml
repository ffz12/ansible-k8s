---
# 第一步：在 localhost 上解析最终 LB 节点列表（用于 hosts）
- name: 解析最终 LB 节点列表
  hosts: localhost
  gather_facts: no
  vars:
    lb_upstream_servers: >-
      {{
        (
          (groups.k8s_master | default([])) +
          (groups.master_to_add | default([]))
        )
        | difference(groups.master_to_delete | default([]))
        | unique
      }}
  tasks:
    - name: 确保至少保留 2 个 LB 节点
      assert:
        that: lb_upstream_servers | length >= 2
        fail_msg: "删除后 LB 节点少于 2 个！当前: {{ lb_upstream_servers }}"
      run_once: yes

- name: 停止LB删除节点服务
  hosts: "{{ groups['master_to_delete'] | default([]) }}"
  tasks:
  - name: 停止并禁用 nginx 和 keepalived 服务
    systemd:
      name: "{{ item }}"
      state: stopped
      enabled: no
      daemon_reload: yes
    loop:
    - nginx
    - keepalived
    ignore_errors: yes

  # 2026-09-16: 改为按发行版包安装后 systemd unit 归包管理器所有, 不再手删
  # (原先删的是自建的 /etc/systemd/system/{nginx,keepalived}.service, 现在没有了)。
  - name: 重新加载 systemd 配置
    systemd:
      daemon_reload: yes

- name: 更新剩余 LB 节点的 Nginx-HA 配置
  hosts: "{{ lb_upstream_servers }}"
  vars:
    # 直接复用同一逻辑，确保完全一致
    lb_upstream_servers: >-
      {{
        (
          (groups.k8s_master | default([])) +
          (groups.master_to_add | default([]))
        )
        | difference(groups.master_to_delete | default([]))
        | unique
      }}
  tasks:
  - name: 更新 nginx config 
    include_role:
      name: nginx-ha
      tasks_from: config-nginx.yml
  - name: 更新 keepalived config
    include_role:
      name: nginx-ha
      tasks_from: config-keepalived.yml
    
- name: 清理已删除的 LB 节点
  hosts: "{{ groups['master_to_delete'] | default([]) }}"
  tasks:
  # 2026-09-16: nginx 用户/组由包管理器负责, 手删会让包处于半残状态, 故不再删。
  # 目录也不再是 /data/{nginx,keepalived}, 改为清理发行版默认路径下本 role 写的配置。
  - name: 删除 nginx / keepalived 配置文件
    file:
      path: "{{ item }}"
      state: absent
    loop:
    - /etc/nginx/nginx.conf
    - /etc/keepalived/keepalived.conf
    - /etc/keepalived/check_nginx

  - name: 清理可能残留的 pid 文件
    file:
      path: /run/nginx.pid
      state: absent
    ignore_errors: yes

  - name: 输出卸载完成信息
    debug:
      msg: "✅ Nginx-HA 卸载完成：服务、用户、配置、二进制均已清除"
