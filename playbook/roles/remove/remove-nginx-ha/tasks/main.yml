---
# 2026-09-16: nginx-ha 改为按发行版包安装后, 卸载口径对齐 remove-haproxy-ha ——
#   systemd unit、nginx 用户/组都由包管理器负责, 这里不再手工删(手删会让包处于半残状态);
#   配置目录也改成发行版默认路径。
- name: 停止并禁用 nginx 和 keepalived 服务
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
    daemon_reload: yes
  loop:
    - nginx
    - keepalived
  ignore_errors: yes

- name: 删除 nginx / keepalived 配置文件
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/nginx.conf
    - /etc/keepalived/keepalived.conf
    - /etc/keepalived/check_nginx

- name: 卸载 nginx / keepalived 软件包(RedHat 系)
  yum:
    name:
      - nginx
      - keepalived
    state: absent
  ignore_errors: yes
  when: ansible_distribution in ['RedHat', 'openEuler', 'CentOS', 'Kylin Linux Advanced Server', 'Kylin']

- name: 卸载 nginx / keepalived 软件包(Debian 系)
  apt:
    name:
      - nginx
      - libnginx-mod-stream
      - keepalived
    state: absent
    purge: yes
  ignore_errors: yes
  when: ansible_distribution in ['Debian', 'Ubuntu']

- name: 重新加载 systemd 配置
  systemd:
    daemon_reload: yes

- name: 清理可能残留的 pid 文件
  file:
    path: /run/nginx.pid
    state: absent
  ignore_errors: yes

- name: 输出卸载完成信息
  debug:
    msg: "✅ Nginx-HA 卸载完成：服务已停、配置已删、软件包已卸载"
