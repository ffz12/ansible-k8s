# 单节点 / 双主 判定与预检。
# 开关是 inventory 的 [harbor] 组台数: 1 台 = 单节点(与原行为一致), 2 台 = 双主。
# 双主 = 两台各自独立(各自 DB/存储, 不共享), 互相 push 复制; 不用 VIP,
#        客户端连 harbor_instances 的 ip(主节点), 故障时手动改 ip 切到另一台。

- name: "[Harbor] 节点 IP(未写 ansible_host 时用组里写的名字/IP)"
  set_fact:
    _harbor_node_ips: "{{ _harbor_node_ips_fixed }}"
  vars:
    _harbor_node_ips_fixed: >-
      {%- set out = [] -%}
      {%- for h in groups['harbor'] -%}
      {%- set _ = out.append(hostvars[h].ansible_host | default(h)) -%}
      {%- endfor -%}
      {{ out }}

- name: "[Harbor] 双主预检"
  when: harbor_ha | bool
  block:
    - name: "[Harbor] 双主只支持 2 台"
      assert:
        that: groups['harbor'] | length == 2
        fail_msg: "[harbor] 组有 {{ groups['harbor'] | length }} 台, 双主只支持 2 台(3 台要两两复制, 暂不支持)"

    - name: "[Harbor] harbor_instances 的 ip 必须是其中一台 Harbor"
      assert:
        that: harbor_ip in _harbor_node_ips
        fail_msg: >-
          harbor_instances 第一项的 ip={{ harbor_ip }} 不是 [harbor] 里的任何一台({{ _harbor_node_ips | join(', ') }})。
          双主不用 VIP, 这里填主节点的 IP; 主故障时改成另一台再跑 harbor-trust.yaml。
