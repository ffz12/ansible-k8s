# 部署 Calico (manifest 方式, kubectl apply)
# 镜像地址由 calico_images 变量提供(离线->Harbor, 在线->docker.io/calico, 见 group_vars/all.yaml)
# pod CIDR 由 kubeadm 的 podSubnet({{ pod_subnet }}) 决定, calico 自动继承

# 双池模式下两个 pool CIDR 必填: 默认是空串, 开了开关但没填会渲染出 `cidr: ""` 的非法
# IPPool —— kubectl apply 未必立刻报错, 但 Pod 永远拿不到 IP, 排查成本高。
# ⚠ 本 assert 只校验【非空 + 形如 a.b.c.d/n】。做不到的部分(需 netaddr/ipaddr 滤镜, 本仓库
#   无该依赖, Kylin 离线环境额外装 python 包很麻烦, 故不引入):
#     · 掩码取值是否合法(/33 这种也会被判通过);
#     · 两池之间、池与 service_subnet 之间是否重叠;
#     · pod_subnet 是否覆盖两个池段。
#   这三项请实跑前用 docs/部署说明.md 十三.1 里的 python 片段自行验算。
- name: 校验双池 CIDR 已填且形如 CIDR(仅双池模式)
  assert:
    that:
      - (calico_gpu_pool_cidr | default('') | trim
         | regex_search('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$')) is not none
      - (calico_cpu_pool_cidr | default('') | trim
         | regex_search('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$')) is not none
    fail_msg: >-
      calico_dual_ippool_enabled=true 但 pool CIDR 未填(或格式不对):
      calico_gpu_pool_cidr={{ calico_gpu_pool_cidr | default('') | trim | default('<空>', true) }},
      calico_cpu_pool_cidr={{ calico_cpu_pool_cidr | default('') | trim | default('<空>', true) }}。
      两者默认是空串且模板不校验, 空着会渲染出 cidr: "" 的非法 IPPool ——
      apply 未必报错, 但 Pod 永远拿不到 IP。请在 inventory/group_vars/all/env.yaml 填,
      并确认: ①两池互不重叠 ②两池都不与 service_subnet 重叠
      ③pod_subnet 是能覆盖两池的超网(不连续网段的超网算法与验算脚本见
      docs/部署说明.md 十三.1 "pod_subnet 超网怎么算")。
    success_msg: >-
      双池 CIDR 已填: gpu={{ calico_gpu_pool_cidr }}, cpu={{ calico_cpu_pool_cidr }}
      (重叠/覆盖关系本 assert 不校验, 需自行验算)
  when: calico_dual_ippool_enabled | default(false) | bool
  run_once: true
  delegate_to: localhost

# ============================================================================
#  预检: 必须存在与 calico_version 对应的 manifest 模板
#
#  为什么需要这个: calico_version 只决定【镜像 tag】(defaults.yaml 的 calico_images.*),
#  而 CRD 与 ClusterRole 规则来自那份 7800+ 行的 vendored 上游 manifest。改
#  calico_version 完全不会动那 7800 行, 于是很容易出现"新版镜像 + 旧版 manifest"
#  (或反过来)的错配, 而且【不报错】, 只在运行时表现为:
#      felix: cannot list resource "clusternetworkpolicies" ... forbidden
#      -> readiness 503 -> calico-node 起不来
#  历史上踩过两次: 3.27->3.31 漏了 9 个 CRD + 2 条 ClusterRole 规则; 之后现网
#  env.yaml 写 3.32.2 而模板是 3.31.3 生成的, 当时按"补一条 RBAC"治标, 根因是错配。
#
#  ⚠ 2026-09-11 改为【按版本存放】: templates/calico/<版本>.yaml.j2
#  原先是单一的 templates/calico.yaml.j2 + "模板版本必须等于 calico_version" 的双向
#  严格相等校验。那样一份入库模板只能服务一个版本, 而 calico_version 在各站点自己的
#  env.yaml(gitignore)里 —— 后果是【全部站点必须同时换版本】:
#    · push 新模板的那一刻, 落后的站点立刻撞 assert 装不了 CNI;
#    · 想让老集群停在旧版也不行 —— 双向相等, 写旧版号照样被拦, 没有退路。
#  改成按版本存放后, 各站点按自己的节奏升级, push 不再是同步点。校验也从"版本相等"
#  变成"该版本的模板存不存在", 缺了就明确告诉你去跑生成脚本。
#
#  加新版本: scripts/gen-calico-template.sh <目标版本> 先看 diff(它会单独列出 CRD
#  增减与各 ClusterRole 的 rules 增减), 确认无异常后 --apply 生成新文件。
#  旧版本文件保持不动, 老集群不受影响。
# ============================================================================
- name: 预检 —— 该 calico 版本的 manifest 模板是否存在
  stat:
    path: "{{ role_path }}/templates/calico/{{ calico_version }}.yaml.j2"
  register: _calico_tmpl_stat
  run_once: true
  delegate_to: localhost
  become: false

- name: 列出仓库里已有哪些版本的模板(供上面缺失时提示)
  shell: |
    set -o pipefail
    ls -1 "{{ role_path }}/templates/calico/" 2>/dev/null \
      | sed -n 's/\.yaml\.j2$//p' | sort -V | tr '\n' ' '
  args:
    executable: /bin/bash
  register: _calico_tmpl_avail
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: localhost
  become: false
  when: not (_calico_tmpl_stat.stat.exists | default(false))

- name: 预检 —— 缺少该版本模板时明确报错
  assert:
    that:
      - _calico_tmpl_stat.stat.exists | default(false)
    fail_msg: >-
      找不到 calico_version={{ calico_version }} 对应的 manifest 模板:
      roles/cni/templates/calico/{{ calico_version }}.yaml.j2
      仓库里现有: {{ _calico_tmpl_avail.stdout | default('') | trim | default('(一个都没有)', true) }}
      calico_version 只换镜像 tag, 不会带来该版本对应的 CRD 与 ClusterRole 规则 ——
      所以【必须】先为该版本生成模板, 否则就是"新镜像 + 旧 manifest"的静默错配
      (运行时 felix 反复 "cannot list resource ... forbidden" -> readiness 503)。
      生成方法:
        1) scripts/gen-calico-template.sh {{ calico_version }}          # 先看 CRD/RBAC diff
           离线: scripts/gen-calico-template.sh {{ calico_version }} --from /path/to/calico.yaml
        2) scripts/gen-calico-template.sh {{ calico_version }} --apply  # 确认后写入
      然后确认离线物料: ls offline/artifacts/cni/calico/v{{ calico_version }}/
    success_msg: >-
      calico 模板已就位: templates/calico/{{ calico_version }}.yaml.j2
  run_once: true
  delegate_to: localhost

# 文件名已经带版本, 这里再读一次文件内的标记做交叉校验 —— 防的是"文件名与内容不一致"
# (手工复制改名、生成脚本被中断等)。文件名对但内容是别的版本, 同样会造成上面那种错配。
- name: 读取模板内的版本标记(与文件名交叉校验)
  shell: |
    set -o pipefail
    grep -m1 '^# CALICO_TEMPLATE_VERSION=' "{{ role_path }}/templates/calico/{{ calico_version }}.yaml.j2" \
      | sed 's/^# CALICO_TEMPLATE_VERSION=//' | tr -d '[:space:]'
  args:
    executable: /bin/bash
  register: _calico_tmpl_ver
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: localhost
  become: false

- name: 预检 —— 模板内版本标记与文件名一致
  assert:
    that:
      - (_calico_tmpl_ver.stdout | default('') | trim) == (calico_version | string | trim)
    fail_msg: >-
      模板文件名与内容不一致: calico/{{ calico_version }}.yaml.j2 里的标记是
      "{{ _calico_tmpl_ver.stdout | default('<读不到标记>') | trim }}"。
      通常是手工复制改名、或生成脚本中途失败。重新生成即可:
        scripts/gen-calico-template.sh {{ calico_version }} --apply
      (读不到标记说明是旧版脚本生成的无版本行模板, 同样重跑一次)
    success_msg: >-
      calico 版本一致: 模板与镜像同为 v{{ calico_version }}
  run_once: true
  delegate_to: localhost

- name: 渲染 calico manifest
  template:
    src: "calico/{{ calico_version }}.yaml.j2"
    dest: "{{ kube_config_dir }}/calico.yaml"
    owner: root
    group: root
    mode: "0600"

- name: apply calico
  shell: |
    kubectl apply -f "{{ kube_config_dir }}/calico.yaml"
  args:
    executable: /bin/bash
  register: calico_apply
  changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"

# ==================== 双池 IPPool: 必须与主 manifest 分开 apply ====================
# 两个 IPPool 是【使用】ippools CRD 的自定义资源(CR), 而该 CRD 定义在主 manifest 里。
# 放同一个文件 apply 会撞 apiserver 的异步注册竞态: CRD 本身创建成功了, 但注册进
# discovery 缓存需要时间, kubectl 按文件顺序推进到末尾时还查不到这个 kind, 报
#   resource mapping not found for name: "gpu-pool" ... no matches for kind "IPPool"
#   in version "crd.projectcalico.org/v1"; ensure CRDs are installed first
# 全新集群首次开双池【必踩】(重跑一次就好 —— 但不该让人重跑)。单池模式主 manifest 里
# 没有任何 CR, 所以这个缺陷此前一直没暴露, 是现场测试环境首次开双池才打出来的。
- name: 渲染双池 IPPool manifest(仅双池模式)
  template:
    src: calico-ippools.yaml.j2
    dest: "{{ kube_config_dir }}/calico-ippools.yaml"
    owner: root
    group: root
    mode: "0600"
  when: calico_dual_ippool_enabled | default(false) | bool

# 用 kubectl wait 而非 sleep: established 条件是 apiserver 明确置位的, 比定时更可靠。
# 90s 是宽裕值 —— 正常几秒内就绪; 真到 90s 还不 established 说明 apiserver 有别的问题,
# 这时明确失败比继续 apply 出一堆 no matches 更好排查。
- name: 等 ippools CRD 注册就绪(仅双池模式)
  shell: |
    kubectl wait --for condition=established --timeout=90s \
      crd/ippools.crd.projectcalico.org
  args:
    executable: /bin/bash
  changed_when: false
  when: calico_dual_ippool_enabled | default(false) | bool

- name: apply 双池 IPPool(仅双池模式)
  shell: |
    kubectl apply -f "{{ kube_config_dir }}/calico-ippools.yaml"
  args:
    executable: /bin/bash
  register: calico_ippool_apply
  changed_when: "'created' in calico_ippool_apply.stdout or 'configured' in calico_ippool_apply.stdout"
  when: calico_dual_ippool_enabled | default(false) | bool

- name: 双池结果(仅双池模式)
  debug:
    msg:
      - "gpu-pool = {{ calico_gpu_pool_cidr }} (blockSize /{{ calico_gpu_pool_blockSize | default(28) }}, nodeSelector hardware == \"gpu\")"
      - "cpu-pool = {{ calico_cpu_pool_cidr }} (blockSize /{{ calico_cpu_pool_blockSize | default(26) }}, nodeSelector hardware == \"cpu\")"
      - "验收: kubectl get ippools.crd.projectcalico.org -o custom-columns=NAME:.metadata.name,CIDR:.spec.cidr,BLOCK:.spec.blockSize,SEL:.spec.nodeSelector"
      - "关键: kubectl get ipamblocks.crd.projectcalico.org -o custom-columns=NAME:.metadata.name,CIDR:.spec.cidr,AFFINITY:.spec.affinity  (看地址块实际从哪个池切)"
      - "⚠ 无 hardware 标签的节点两个池都匹配不上, 拿不到地址块 —— 存量节点需手工 kubectl label"
  when: calico_dual_ippool_enabled | default(false) | bool
