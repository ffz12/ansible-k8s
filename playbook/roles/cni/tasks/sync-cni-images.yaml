# 离线: 按所选 CNI 把镜像 load 并推到自建 Harbor(仅 is_offline 时由 main.yaml 调用)
# 目标仓库固定为自建 Harbor({{ registry }}), 与 calico_images 离线分支一致。

# ---------- Calico ----------
- name: "[Sync CNI] 登录 Harbor"
  shell: |
    echo "{{ harbor_admin_password }}" | docker login "{{ harbor_dns }}" -u "{{ harbor_admin_username }}" --password-stdin
  args:
    executable: /bin/bash
  register: cni_login
  failed_when: "'Login Succeeded' not in cni_login.stdout"

- name: "[Sync CNI] 复制 calico 镜像到本地"
  copy:
    src: "{{ src_calico_images_dir }}"
    dest: "{{ calico_images_dir }}"
  when: kube_network_plugin == 'calico'

- name: "[Sync CNI] 同步 calico 镜像并建 multi-arch manifest"
  shell: |
    set -e
    COMP="{{ item }}"
    VERSION="v{{ calico_version }}"
    REGISTRY="{{ registry }}"
    docker load -i "{{ calico_images_dir }}/images/amd64/${COMP}.tar"
    docker load -i "{{ calico_images_dir }}/images/arm64/${COMP}.tar"
    docker tag "calico/${COMP}:${VERSION}-amd64" "${REGISTRY}/calico-${COMP}:${VERSION}-amd64"
    docker tag "calico/${COMP}:${VERSION}-arm64" "${REGISTRY}/calico-${COMP}:${VERSION}-arm64"
    docker push "${REGISTRY}/calico-${COMP}:${VERSION}-amd64"
    docker push "${REGISTRY}/calico-${COMP}:${VERSION}-arm64"
    if docker manifest inspect --insecure "${REGISTRY}/calico-${COMP}:${VERSION}" >/dev/null 2>&1; then
      docker manifest rm "${REGISTRY}/calico-${COMP}:${VERSION}" >/dev/null 2>&1 || true
    fi
    docker manifest create --insecure "${REGISTRY}/calico-${COMP}:${VERSION}" \
      "${REGISTRY}/calico-${COMP}:${VERSION}-amd64" \
      "${REGISTRY}/calico-${COMP}:${VERSION}-arm64"
    docker manifest annotate "${REGISTRY}/calico-${COMP}:${VERSION}" \
      "${REGISTRY}/calico-${COMP}:${VERSION}-amd64" --os linux --arch amd64
    docker manifest annotate "${REGISTRY}/calico-${COMP}:${VERSION}" \
      "${REGISTRY}/calico-${COMP}:${VERSION}-arm64" --os linux --arch arm64
    docker manifest push --insecure "${REGISTRY}/calico-${COMP}:${VERSION}"
    docker rmi "${REGISTRY}/calico-${COMP}:${VERSION}-amd64" "${REGISTRY}/calico-${COMP}:${VERSION}-arm64" || true
  loop: "{{ calico_components }}"
  args:
    executable: /bin/bash
  when: kube_network_plugin == 'calico'

# ---------- Flannel ----------
- name: "[Sync CNI] 复制 flannel 镜像到本地"
  copy:
    src: "{{ src_flannel_images_dir }}"
    dest: "{{ flannel_images_dir }}"
  when: kube_network_plugin == 'flannel'

- name: "[Sync CNI] 同步 flannel 镜像并建 multi-arch manifest"
  shell: |
    set -e
    REGISTRY="{{ registry }}"
    sync_one() {
      local SRC="$1" DST="$2"    # SRC 不含 -arch 后缀, DST 目标(不含 tag)
      docker tag "${SRC}-amd64" "${DST}-amd64"
      docker tag "${SRC}-arm64" "${DST}-arm64"
      docker push "${DST}-amd64"; docker push "${DST}-arm64"
      docker manifest rm "${DST}" >/dev/null 2>&1 || true
      docker manifest create --insecure "${DST}" "${DST}-amd64" "${DST}-arm64"
      docker manifest annotate "${DST}" "${DST}-amd64" --os linux --arch amd64
      docker manifest annotate "${DST}" "${DST}-arm64" --os linux --arch arm64
      docker manifest push --insecure "${DST}"
      docker rmi "${DST}-amd64" "${DST}-arm64" || true
    }
    docker load -i "{{ flannel_images_dir }}/images/amd64/flannel.tar"
    docker load -i "{{ flannel_images_dir }}/images/arm64/flannel.tar"
    docker load -i "{{ flannel_images_dir }}/images/amd64/flannel-cni-plugin.tar"
    docker load -i "{{ flannel_images_dir }}/images/arm64/flannel-cni-plugin.tar"
    sync_one "flannel/flannel:v{{ flannel_version }}"            "${REGISTRY}/flannel:v{{ flannel_version }}"
    sync_one "flannel/flannel-cni-plugin:v1.6.2-flannel1"        "${REGISTRY}/flannel-cni-plugin:v1.6.2-flannel1"
  args:
    executable: /bin/bash
  when: kube_network_plugin == 'flannel'

