# roles/etcd/etcd-install/tasks/install-binary.yml
---
- name: Check if etcd binary exists
  stat:
    path: "{{ etcd_bin_dir | default('/opt/etcd/bin') }}/etcd"
  register: etcd_installed

- name: Get real CPU architecture using 'uname -m'
  command: uname -m
  register: _real_arch
  changed_when: false
  when: not etcd_installed.stat.exists

- name: Set etcd_arch to amd64 for x86_64 hosts
  set_fact:
    etcd_arch: "amd64"
  when:
    - not etcd_installed.stat.exists
    - _real_arch.stdout == "x86_64"

- name: Set etcd_arch to arm64 for ARM64 hosts
  set_fact:
    etcd_arch: "arm64"
  when:
    - not etcd_installed.stat.exists
    - _real_arch.stdout in ["aarch64", "arm64"]

- name: Fail on unsupported architecture
  fail:
    msg: "Unsupported real architecture '{{ _real_arch.stdout }}'. Supported: x86_64, aarch64."
  when:
    - not etcd_installed.stat.exists
    - _real_arch.stdout not in ["x86_64", "aarch64", "arm64"]

# 离线: 版本以【实际下到的物料】为准, 不依赖手写表。
# 下载脚本用 `kubeadm config images list` 校准 etcd 版本(k8s 1.34.3 -> 3.6.5), 按 v<版本>/ 建目录;
# 手维护 k8s_compat 表迟早与 kubeadm 实际给的值不一致(如表里 3.6.4 而实际下的是 3.6.5),
# 故这里直接扫 offline/artifacts/etcd/ 取实际存在的版本, 一处都不用手写。
- name: (离线)发现实际下载到的 etcd 版本目录
  find:
    paths: "{{ playbook_dir }}/../offline/artifacts/etcd"
    patterns: "v*"
    file_type: directory
  delegate_to: localhost
  become: no
  register: _etcd_dirs
  when:
    - not etcd_installed.stat.exists
    - is_offline | default(false) | bool

- name: (离线)按物料目录确定 etcd 版本(多个版本取最新; 与 env.yaml 手写值解耦)
  set_fact:
    etcd_version: "{{ (_etcd_dirs.files | map(attribute='path') | map('basename') | map('regex_replace', '^v', '') | list | sort(reverse=true))[0] }}"
  when:
    - not etcd_installed.stat.exists
    - is_offline | default(false) | bool
    - _etcd_dirs.files | default([]) | length > 0

- name: (离线)物料目录为空则明确报错(而非拼出一个不存在的路径)
  fail:
    msg: >-
      offline/artifacts/etcd/ 下没有任何 v* 版本目录 —— 离线物料未下载。
      请先在有网机器上跑: bash scripts/offline/download-k8s-offline.sh
  when:
    - not etcd_installed.stat.exists
    - is_offline | default(false) | bool
    - _etcd_dirs.files | default([]) | length == 0

- name: Set etcd source and file paths
  set_fact:
    etcd_tar: "etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz"
    etcd_dir: "etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}"
    etcd_src_path: "{{ playbook_dir }}/../offline/artifacts/etcd/v{{ etcd_version }}/{{ etcd_arch }}/etcd-v{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz"
  when: not etcd_installed.stat.exists

- name: 显示本次使用的 etcd 版本(离线=物料实际版本, 在线=k8s_compat 派生值)
  debug:
    msg: "etcd {{ etcd_version }} ({{ '离线物料' if (is_offline | default(false) | bool) else '在线下载' }}, arch={{ etcd_arch }})"
  when: not etcd_installed.stat.exists

- name: Deploy etcd binaries
  block:
    - name: Copy etcd tarball from local files/ to remote /tmp (离线)
      copy:
        src: "{{ etcd_src_path }}"
        dest: "/tmp/{{ etcd_tar }}"
        mode: '0755'
      when: is_offline | default(false) | bool

    - name: Download etcd tarball to remote /tmp (在线, 多源+重试)
      include_tasks: "{{ playbook_dir }}/tasks/download-with-fallback.yml"
      vars:
        dl_urls: "{{ etcd_bin_mirrors | map('regex_replace', '$', '/v' ~ etcd_version ~ '/' ~ etcd_tar) | list }}"
        dl_dest: "/tmp/{{ etcd_tar }}"
        dl_mode: "0755"
      when: not (is_offline | default(false) | bool)

    - name: Extract etcd tarball on remote host
      unarchive:
        src: "/tmp/{{ etcd_tar }}"
        dest: /tmp/
        remote_src: yes

    - name: Install etcd and etcdctl binaries
      copy:
        src: "/tmp/{{ etcd_dir }}/{{ item }}"
        dest: "{{ etcd_bin_dir }}/{{ item }}"
        remote_src: yes
        mode: '0755'
        owner: root
        group: root
      loop:
        - etcd
        - etcdctl

    - name: Clean up temporary files on remote host
      file:
        path: "/tmp/{{ item }}"
        state: absent
      loop:
        - "{{ etcd_tar }}"
        - "{{ etcd_dir }}"
  when: not etcd_installed.stat.exists
