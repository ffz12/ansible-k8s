---
- name: 创建 etcd 组
  group:
    name: "{{ etcd_group }}"
    state: present
    system: yes

- name: 创建 etcd 用户
  user:
    name: "{{ etcd_user }}"
    state: present
    system: yes
    group: "{{ etcd_group }}"
    shell: /sbin/nologin
    create_home: no

- name: Ensure directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: '0755'
  loop:
    - "{{ etcd_install_dir }}"
    - "{{ etcd_bin_dir }}"
    - "{{ etcd_conf_dir }}"
    - "{{ etcd_cert_dir }}"
- name: Ensure directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: '0700'
  loop:
    - "{{ etcd_data_dir }}"
- name: Deploy etcd systemd service unit
  template:
    src: etcd.service.j2 
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: "0644"
