# roles/nodelocaldns/tasks/main.yml
# NodeLocal DNSCache 部署(在第一个 master 上, 调用方 k8s-cni 风格保证 run_once 语义)。
# 忠实复刻现网 kk 版: 单绑 nodelocaldns_ip, 转发到现网 CoreDNS svc({{ nodelocaldns_coredns_svc }})。
#
# ── 关于 kube-proxy 模式(iptables / ipvs)──
# 官方 nodelocaldns 有两种形态, 只有【双绑】版跟 kube-proxy 模式强相关:
#   · 双绑版: 同时绑 link-local 与 kube-dns ClusterIP, 用来拦截原本发往 ClusterIP 的
#     DNS 流量 -> 与 service 转发规则冲突, 需 iptables NOTRACK 绕开 conntrack;
#     ipvs 模式下 ClusterIP 被绑在 kube-ipvs0 上, 双绑会抢地址 -> 确实不兼容。
#   · 本模板是【单绑】版: 只绑 {{ nodelocaldns_ip }}(link-local), 不碰 ClusterIP。
#     Pod 靠 kubelet 的 clusterDNS 直接指到这个地址, 流量不经过 kube-proxy 的 service
#     转发, 因此不依赖 NOTRACK; 上游 forward 到 coredns ClusterIP 那一跳走正常 service
#     路径, ipvs 能正常处理。故 iptables / ipvs 两种模式都适用。
# 前提改为: 各节点 kubelet 的 clusterDNS 必须 == nodelocaldns_ip, 否则装了也不生效。

- name: "[NodeLocalDNS] 校验 kube-proxy 模式取值合法"
  assert:
    that:
      - kube_proxy_mode | default('iptables') in ['iptables', 'ipvs']
    fail_msg: >-
      kube_proxy_mode 必须是 iptables 或 ipvs, 当前={{ kube_proxy_mode | default('iptables') }}

# dns_domain 进 Corefile 的 <dns_domain>:53 区块, 必须与集群实际域名一致 ——
# 不一致会导致 Pod 解析 svc.cluster.local 全部失败。它【建完集群不可改】(进了 apiserver
# 证书 SAN 与 kubelet clusterDomain), 故意不在 defaults.yaml 兜底: 这里猜一个默认值,
# 会在"站点自定义过 dns_domain 但 env.yaml 缺了这项"时静默生成错的 Corefile。
- name: "[NodeLocalDNS] 预检 —— dns_domain 必须显式配置"
  assert:
    that:
      - (dns_domain | default('') | trim | length) > 0
    fail_msg: >-
      dns_domain 未配置(或为空)。它会写进 nodelocaldns 的 Corefile(<dns_domain>:53 区块),
      必须与集群实际 DNS 域名一致 —— 不一致会让 Pod 解析集群内服务全部失败。
      【故意不在 defaults.yaml 兜底】(建完集群改不了, 猜错还会静默生成错的 Corefile),
      请在 inventory/group_vars/all/env.yaml 显式写: dns_domain: cluster.local
      不确定现网用的是什么, 查: kubectl -n kube-system get cm kubeadm-config -o yaml | grep dnsDomain

- name: "[NodeLocalDNS] 本次部署模式"
  debug:
    msg: >-
      kube-proxy={{ kube_proxy_mode | default('iptables') }};
      本模板为单绑({{ nodelocaldns_ip }})形态, 不拦截 ClusterIP, 两种模式均适用。
      ⚠ 需确保各节点 kubelet 的 clusterDNS = {{ nodelocaldns_ip }}(否则 Pod 不会走本地缓存)。

# --check 时整块跳过: 这一步是破坏性的(docker load/tag/push 到 Harbor), 且对"预览渲染出的
# manifest"这个目的没有帮助。跳过它也就不必处理它内部那些 shell 在 check 下被跳过的问题。
- name: "[NodeLocalDNS] 离线同步 node-cache 镜像到 Harbor"
  include_tasks: sync-nodelocaldns-image.yaml
  when:
    - is_offline | default(false) | bool
    - not (ansible_check_mode | bool)

- name: "[--check] 离线镜像同步已跳过"
  debug:
    msg: >-
      --check 模式: 跳过「node-cache 镜像 load/push 到 Harbor」(破坏性操作)。
      实跑时会同步 {{ registry }}/k8s-dns-node-cache:{{ nodelocaldns_version }}。
  when:
    - is_offline | default(false) | bool
    - ansible_check_mode | bool

# 上游 CoreDNS 的 Service 名两种都可能:
#   kubeadm 原生 = kube-dns(即便后端跑的是 CoreDNS, Service 仍沿用旧名)
#   KubeKey     = coredns
# 本仓库用 kubeadm 建集群 -> 实际是 kube-dns; 但 nodelocaldns_coredns_svc 默认值是 coredns
# (为对齐现网 kk 集群)。写死任一个都会在另一种集群上失败, 故按【实际存在的】自动探测,
# 顺序: 先试配置值, 再试另一个。env.yaml 显式指定时以指定值为准(它排在第一位)。
- name: "[NodeLocalDNS] 探测上游 CoreDNS Service 名(kube-dns / coredns)"
  shell: |
    for n in {{ nodelocaldns_coredns_svc }} kube-dns coredns; do
      ip=$(kubectl -n kube-system get svc "$n" -o jsonpath='{.spec.clusterIP}' 2>/dev/null)
      if [ -n "$ip" ]; then echo "$n $ip"; exit 0; fi
    done
    exit 0
  args:
    executable: /bin/bash
  register: _coredns_svc
  changed_when: false
  # 只读(kubectl get svc)。不设则 --check 下本任务被跳过, _coredns_svc 里没有 .stdout,
  # 紧接着的 assert 直接报 undefined —— 在渲染出 manifest 之前就挂了, 预览无从谈起。
  check_mode: false

- name: "[NodeLocalDNS] 校验查到了 CoreDNS Service"
  assert:
    that:
      - (_coredns_svc.stdout | trim | length) > 0
    fail_msg: >-
      kube-system 下既没有 '{{ nodelocaldns_coredns_svc }}' 也没有 kube-dns / coredns Service ——
      CoreDNS 可能还没部署好。先确认: kubectl -n kube-system get svc | grep -E 'dns|coredns'
      查到别的名字就在 env.yaml 设 nodelocaldns_coredns_svc。

- name: "[NodeLocalDNS] 记录 CoreDNS svc 名与 ClusterIP(Corefile forward 目标)"
  set_fact:
    coredns_svc_name: "{{ (_coredns_svc.stdout | trim).split()[0] }}"
    coredns_svc_ip: "{{ (_coredns_svc.stdout | trim).split()[1] }}"

- name: "[NodeLocalDNS] 上游 CoreDNS"
  debug:
    msg: "上游 CoreDNS Service = kube-system/{{ coredns_svc_name }} ({{ coredns_svc_ip }})"

- name: "[NodeLocalDNS] 渲染 nodelocaldns manifest"
  template:
    src: nodelocaldns.yaml.j2
    dest: "{{ kube_config_dir }}/nodelocaldns.yaml"
    owner: root
    group: root
    mode: "0600"

# --check 预览说明。不需要 end_host: 下面 apply / rollout 是 shell, check 模式下自动跳过,
# 且它们的 changed_when 在任务被跳过时不求值, 不会像上面 assert 那样连环报错。
- name: "[--check] 预览到此为止(apply / rollout 会被跳过)"
  debug:
    msg:
      - "上游 CoreDNS: kube-system/{{ coredns_svc_name }} ({{ coredns_svc_ip }})"
      - "渲染目标: {{ kube_config_dir }}/nodelocaldns.yaml (--diff 可看内容差异)"
      - "⚠ check 模式下 template 不落盘, 所以现在磁盘上【没有】新文件;"
      - "  kubectl diff -f {{ kube_config_dir }}/nodelocaldns.yaml 读到的是上次实跑留下的旧文件(或报文件不存在)。"
      - "  要用 kubectl diff 比对新渲染结果, 走 --step 单步跑到 apply 之前(见本文件顶部注释)。"
      - "实跑会 kubectl apply 这份 manifest, 并等 DaemonSet 全节点就绪。"
  when: ansible_check_mode | bool

- name: "[NodeLocalDNS] apply nodelocaldns"
  shell: |
    kubectl apply -f "{{ kube_config_dir }}/nodelocaldns.yaml"
  args:
    executable: /bin/bash
  register: _nld_apply
  changed_when: "'created' in _nld_apply.stdout or 'configured' in _nld_apply.stdout"

- name: "[NodeLocalDNS] 等 DaemonSet 全节点就绪"
  shell: kubectl -n kube-system rollout status ds/nodelocaldns --timeout=180s
  args:
    executable: /bin/bash
  register: _nld_rollout
  changed_when: false
