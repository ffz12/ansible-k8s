---
# 重置单个 k8s 节点(kubeadm reset + 清理),由 k8s-reset.yaml 对全体节点调用
- name: "[Reset] kubeadm reset"
  command: "kubeadm reset -f --cri-socket {{ kube_criSocket }}"
  register: _reset
  failed_when: false
  changed_when: "'reset' in _reset.stdout | default('')"

- name: "[Reset] 停止并禁用 kubelet"
  systemd:
    name: kubelet
    state: stopped
    enabled: no
  failed_when: false

- name: "[Reset] 清理残留目录/配置"
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes
    - /var/lib/kubelet
    - /etc/cni
    - /opt/cni
    - /var/lib/cni
    - /run/flannel
    - /var/log/pods
    - /var/log/containers
    - /var/log/kubernetes
    - "{{ ansible_env.HOME }}/.kube"
    - /etc/crictl.yaml
    # systemd 单元(kube-common 部署的)
    - /etc/systemd/system/kubelet.service
    - "{{ kubelet_service_dir }}"

- name: "[Reset] 清理 calico 运行时目录(best-effort, 可能有 BPF pinned 文件)"
  shell: "rm -rf /run/calico /var/run/calico 2>/dev/null || true"
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: "[Reset] 删除 k8s 二进制"
  file:
    path: "{{ kube_bin_dir }}/{{ item }}"
    state: absent
  loop:
    - kubeadm
    - kubectl
    - kubelet
    - crictl
    - k          # kubectl 别名
    - helm       # cilium 用(装过才有)

- name: "[Reset] 兜底删除 kube* 二进制(glob, /usr/bin 与 /usr/local/bin)"
  shell: "rm -f /usr/bin/kube* /usr/local/bin/kube* 2>/dev/null || true"
  args:
    executable: /bin/bash
  changed_when: false

- name: "[Reset] systemd daemon-reload"
  systemd:
    daemon_reload: yes

- name: "[Reset] 清理 CNI 虚拟网卡(best-effort)"
  shell: |
    for i in cni0 flannel.1 vxlan.calico tunl0 kube-ipvs0 cilium_host cilium_net cilium_vxlan; do
      ip link delete "$i" 2>/dev/null || true
    done
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: "[Reset] 清理 iptables / ipvs / nftables 规则(best-effort)"
  shell: |
    iptables -F 2>/dev/null || true
    iptables -t nat -F 2>/dev/null || true
    iptables -t mangle -F 2>/dev/null || true
    ipvsadm --clear 2>/dev/null || true
    nft flush ruleset 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

# 重建空的 CNI 配置目录 + 重启 containerd:
# reset 删了 /etc/cni 整个目录会让 containerd 的 fsnotify 监听失效(盯着已删除的旧 inode),
# 之后重装 CNI 写入新目录时 containerd 收不到事件 -> 一直 'cni plugin not initialized'。
# 重建目录 + 重启 containerd 让它以干净状态重新建立 CNI 监听。
- name: "[Reset] 重建空 CNI 配置目录(稳定 inode 供 containerd 监听)"
  file:
    path: /etc/cni/net.d
    state: directory
    mode: "0755"

- name: "[Reset] 重启 containerd(重建干净 CNI 监听,避免重装后 CNI 不识别)"
  systemd:
    name: containerd
    state: restarted
  failed_when: false
