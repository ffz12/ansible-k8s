# roles/kubernetes/kube-common/tasks/install-binary.yml

- name: 确定 CPU 架构（amd64 或 arm64）
  set_fact:
    kube_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

- name: 创建 kubelet 工作目录
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ kube_bin_dir }}"
    - "{{ kube_config_dir }}"
    - "{{ kube_config_dir }}/pki"
    - "{{ kube_config_dir }}/pki/etcd"
    - "{{ kube_config_dir }}/pki/manifests"
    - "{{ kubelet_service_dir }}"
    - "{{ kubelet_config_dir }}"

- name: 拷贝 Kubernetes 二进制(离线,来自多版本目录 v{{ k8s_version }})
  copy:
    src: "{{ k8s_bin_src }}/{{ kube_arch }}/{{ item }}"
    dest: "{{ kube_bin_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - kubeadm
    - kubectl
    - kubelet
  when: is_offline | default(false) | bool

- name: 下载 Kubernetes 二进制(在线, 多源+重试)
  include_tasks: "{{ playbook_dir }}/tasks/download-with-fallback.yml"
  vars:
    dl_urls: "{{ k8s_bin_mirrors | map('regex_replace', '$', '/v' ~ k8s_version ~ '/bin/linux/' ~ kube_arch ~ '/' ~ item) | list }}"
    dl_dest: "{{ kube_bin_dir }}/{{ item }}"
    dl_mode: "0755"
  loop:
    - kubeadm
    - kubectl
    - kubelet
  when: not (is_offline | default(false) | bool)

# ---- crictl (CRI 调试工具; kubeadm 预检需要, 缺了会 WARNING) ----
- name: 安装 crictl (离线, 二进制放在 k8s bin 目录)
  copy:
    src: "{{ k8s_bin_src }}/{{ kube_arch }}/crictl"
    dest: "{{ kube_bin_dir }}/crictl"
    mode: "0755"
  when: is_offline | default(false) | bool
  ignore_errors: true      # crictl 可选,缺了不阻断

- name: 下载并安装 crictl (在线, 多源+重试)
  block:
    - name: 下载 crictl tar
      include_tasks: "{{ playbook_dir }}/tasks/download-with-fallback.yml"
      vars:
        dl_urls: "{{ crictl_bin_mirrors | map('regex_replace', '$', '/v' ~ crictl_version ~ '/crictl-v' ~ crictl_version ~ '-linux-' ~ kube_arch ~ '.tar.gz') | list }}"
        dl_dest: "/tmp/crictl-v{{ crictl_version }}-linux-{{ kube_arch }}.tar.gz"
        dl_mode: "0644"
    - name: 解压 crictl 到 bin
      unarchive:
        src: "/tmp/crictl-v{{ crictl_version }}-linux-{{ kube_arch }}.tar.gz"
        dest: "{{ kube_bin_dir }}"
        remote_src: yes
  when: not (is_offline | default(false) | bool)

# ---- CNI 标准插件包 (containernetworking/plugins) ----
# 提供 bandwidth / portmap / tuning / firewall 等。calico-cni 镜像只带自己那几个
# (calico, calico-ipam, flannel, host-local, install, loopback, portmap, tuning),
# 【不含 bandwidth】; 而 calico 3.28+ 官方 conflist 默认引用 bandwidth ——
# 缺了它所有 Pod 都建不了 sandbox:
#   plugin type="bandwidth" failed (add): failed to find plugin "bandwidth" in path [/opt/cni/bin]
# 默认 calico_enable_bandwidth=false(conflist 不引用), 故这几步默认跳过, 与现网生产一致;
# 开了限速才装 —— 目录是节点本地的, 所以放在 kube-common(全节点), 不能只在 master 装。
- name: 创建 CNI 插件目录
  file:
    path: "{{ cni_plugins_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: calico_enable_bandwidth | default(false) | bool

- name: 检查 bandwidth 插件是否已就位(有则跳过, 幂等)
  stat:
    path: "{{ cni_plugins_bin_dir }}/bandwidth"
  register: _cni_bw
  when: calico_enable_bandwidth | default(false) | bool

- name: 安装 CNI 插件包 (离线)
  unarchive:
    src: "{{ cni_plugins_bin_src }}/cni-plugins-linux-{{ kube_arch }}-v{{ cni_plugins_version }}.tgz"
    dest: "{{ cni_plugins_bin_dir }}"
    owner: root
    group: root
  when:
    - calico_enable_bandwidth | default(false) | bool
    - is_offline | default(false) | bool
    - not (_cni_bw.stat.exists | default(false))

- name: 安装 CNI 插件包 (在线, 多源+重试)
  block:
    - name: 下载 cni-plugins tar
      include_tasks: "{{ playbook_dir }}/tasks/download-with-fallback.yml"
      vars:
        dl_urls: "{{ cni_plugins_mirrors | map('regex_replace', '$', '/v' ~ cni_plugins_version ~ '/cni-plugins-linux-' ~ kube_arch ~ '-v' ~ cni_plugins_version ~ '.tgz') | list }}"
        dl_dest: "/tmp/cni-plugins-linux-{{ kube_arch }}-v{{ cni_plugins_version }}.tgz"
        dl_mode: "0644"
    - name: 解压 cni-plugins 到 {{ cni_plugins_bin_dir }}
      unarchive:
        src: "/tmp/cni-plugins-linux-{{ kube_arch }}-v{{ cni_plugins_version }}.tgz"
        dest: "{{ cni_plugins_bin_dir }}"
        remote_src: yes
        owner: root
        group: root
  when:
    - calico_enable_bandwidth | default(false) | bool
    - not (is_offline | default(false) | bool)
    - not (_cni_bw.stat.exists | default(false))

- name: 配置 crictl 运行时端点 (/etc/crictl.yaml)
  copy:
    dest: /etc/crictl.yaml
    mode: "0644"
    content: |
      runtime-endpoint: {{ kube_criSocket }}
      image-endpoint: {{ kube_criSocket }}
      timeout: 10
      debug: false
