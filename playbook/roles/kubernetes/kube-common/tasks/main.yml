# roles/kubernetes/kube-common/tasks/main.yml

# ⚠ 本预检原在 kube-init-master 里, 但那个 role 现在只跑首台 master —— 留在那里就只能
#   覆盖首台。而 sandbox_image 不一致对【每个】节点都致命(kubeadm join 同样拉不到 pause),
#   worker 更是从来没被检查过。故移到 kube-common: 全 master + 全 worker 都会跑。
# 预检: containerd 的 sandbox_image 必须与当前变量渲染值一致
# 防止「改了 k8s_version / is_offline 却没重跑 containerd-setup」→ config.toml 里 pause
# 地址过期(旧版本号 or 离线 harbor 地址),kubeadm init 拉不到 pause 卡死在 wait-control-plane
# ⚠ pause 镜像的【键名按 containerd 大版本不同】, 读的时候必须两个都认:
#     containerd 1.x (config version = 2, 模板 config-v2.toml.j2):
#       [plugins."io.containerd.grpc.v1.cri"]
#         sandbox_image = "..."
#     containerd 2.x (config version = 3, 模板 config.toml.j2):
#       [plugins.'io.containerd.cri.v1.images'.pinned_images]
#         sandbox = "..."          ← 键名是 sandbox, 没有 _image 后缀
#   老写法 `awk -F'"' '/sandbox_image/'` 在 2.x 上永远匹配不到 → 读出空串 →
#   assert 拿 "" 和期望值比 → 报"不一致", 并建议去重跑 containerd-setup。
#   但节点配置其实完全正确, 重跑 containerd-setup 也修不好(它渲染出来的还是 sandbox=),
#   于是卡死在这一步。containerd_config_version 由 containerd_version 派生(见
#   group_vars/all/defaults.yaml), 用 containerd 2.x 的站点都会踩。
#
# ⚠ 正则要求键名后紧跟 =, 否则会误匹配 2.x 配置里的 sandboxer = 'podsandbox'。
#   单双引号都认: 模板写的是双引号, 但 containerd config dump 输出的是单引号,
#   手工改过的文件也可能是单引号。
#
# 优先读 containerd config dump(权威: 它是 containerd 实际生效的值, 且包含
# v3 模板里 imports = ['/etc/containerd/conf.d/*.toml'] 引入的覆盖),
# dump 不可用(服务没起/命令缺失)再回落到直接读文件。
- name: 读取节点上 containerd 的 pause 镜像(sandbox_image / sandbox)
  shell: |
    set -o pipefail
    pat="s/^[[:space:]]*sandbox(_image)?[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\2/p"
    val=$(containerd config dump 2>/dev/null | sed -nE "$pat" | head -1)
    if [ -z "$val" ]; then
      val=$(sed -nE "$pat" /etc/containerd/config.toml 2>/dev/null | head -1)
      echo "SOURCE=file" >&2
    else
      echo "SOURCE=dump" >&2
    fi
    printf '%s' "$val"
  args:
    executable: /bin/bash
  register: node_sandbox_image
  changed_when: false
  failed_when: false
  when: "'containerd' in kube_criSocket"

# 读不到值和读到了但不等, 是两种不同的故障, 建议的处置也不同 —— 分开报, 别都归到
# "没重跑 containerd-setup"(那条建议在读取失败时会把人带偏, 见上面的注释)。
- name: 预检 —— 能读到 containerd 的 pause 镜像配置
  assert:
    that:
      - (node_sandbox_image.stdout | default('') | trim) | length > 0
    fail_msg: >-
      节点 {{ inventory_hostname }} 读不到 containerd 的 pause 镜像配置
      (sandbox_image / sandbox 都没匹配到)。
      本机 containerd_version={{ containerd_version | default('未定义') }},
      派生 containerd_config_version={{ containerd_config_version | default('未定义') }}。
      先确认 /etc/containerd/config.toml 存在且含 pause 镜像项:
        grep -nE "sandbox(_image)?[[:space:]]*=" /etc/containerd/config.toml
        containerd config dump | grep -E "sandbox(_image)?[[:space:]]*="
      文件缺失或为空 → 跑 containerd-setup 生成:
        ansible-playbook -i inventory/hosts playbook/containerd-setup.yaml -l {{ inventory_hostname }}
    success_msg: >-
      读到 pause 镜像: {{ node_sandbox_image.stdout | default('') | trim }}
  when: "'containerd' in kube_criSocket"

- name: 预检 —— containerd pause 镜像与当前配置一致
  assert:
    that:
      - (node_sandbox_image.stdout | default('') | trim) == sandbox_image
    fail_msg: >-
      节点 {{ inventory_hostname }} 的 containerd pause 镜像 =
      "{{ node_sandbox_image.stdout | default('') | trim }}",
      与当前配置期望值 "{{ sandbox_image }}" 不一致
      —— 通常是改了 k8s_version 或 is_offline 后没重跑 containerd-setup。
      请先执行: ansible-playbook -i inventory/hosts playbook/containerd-setup.yaml -l {{ inventory_hostname }}
      再重试 k8s 初始化。
    success_msg: "containerd pause 镜像校验通过: {{ sandbox_image }}"
  when: "'containerd' in kube_criSocket"

# controlPlaneEndpoint 用域名时(cp_endpoint_domain 非空)才做事; 默认空则整块跳过。
# 位置要在【部署 kubelet 配置 / 启用 kubelet 之前】: kubelet.conf 的 server 指向 endpoint,
# 名字解析不了 kubelet 起不来。放在 kube-common 而非 os-init: 后者不常跑; 也不是
# k8s-init-master(它 hosts 只有首台 master, 覆盖不到 worker 与其余 master)。
# kube-common 在 k8s-install / k8s-add-master / k8s-add-node 三处都跑, 范围正好是
# "所有会有 kubelet.conf 的节点", 且首 master 走的 k8s-install 第一个 role 就是它。
- name: 写 controlPlaneEndpoint 域名解析到 /etc/hosts
  include_tasks: "{{ playbook_dir }}/tasks/ensure-cp-endpoint-hosts.yml"
  when: (cp_endpoint_domain | default('') | trim | length) > 0
  tags: [config, k8s, cp_endpoint]

- name: 安装 Kubernetes 二进制
  import_tasks: install-binary.yml
  tags: [install, k8s]

- name: 部署 kubelet 配置
  import_tasks: deploy-config.yml
  tags: [config, k8s]

- name: 启用 kubelet 服务
  import_tasks: enable-kubelet.yml
  tags: [service, k8s]
- name: 包含 etcd 证书同步任务
  include_tasks: sync-etcd-cert.yml
  when: "'k8s_master' in group_names"

