---
# Step 1: 检查当前节点是否已加入集群
- name: "[Add Master] 检查是否已加入集群"
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

# 已加入(含首 master)则本机早停, 避免重跑把 join 那套刷一遍
- name: "[Add Master] 已加入则跳过本机后续"
  meta: end_host
  when: kubelet_conf.stat.exists

# ================================
# 仅当未加入时才执行以下操作
# ================================

# Step 2: 确保目标节点有证书目录（必须在 copy 前创建！）
- name: "[Add Master] 创建证书目录"
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /etc/kubernetes/pki
    - /etc/kubernetes/pki/etcd
  become: yes
  when: not kubelet_conf.stat.exists

- name: "[Add Master] 从 first master 同步证书到当前节点"
  synchronize:
    src: "{{ item }}"
    dest: "{{ item }}"
    perms: yes
    owner: yes
    group: yes
    rsync_opts:
      - "--chmod=600"
  delegate_to: "{{ groups['k8s_master'][0] }}"
  loop:
    - /etc/kubernetes/pki/ca.crt
    - /etc/kubernetes/pki/ca.key
    - /etc/kubernetes/pki/sa.key
    - /etc/kubernetes/pki/sa.pub
    - /etc/kubernetes/pki/front-proxy-ca.crt
    - /etc/kubernetes/pki/front-proxy-ca.key
  when: not kubelet_conf.stat.exists

# Step 5: 获取 join 命令（从 first master），并设为全局变量
- name: "[Add Master] 从 first master 获取 join 命令"
  shell: kubeadm token create --print-join-command
  register: _join_cmd_result
  delegate_to: "{{ groups['k8s_master'][0] }}"
  when: not kubelet_conf.stat.exists
- name:  输出k8s 命令
  debug:
    var: _join_cmd_result.stdout
  when: not kubelet_conf.stat.exists

# Step 6: 执行 join
- name: "[Add Master] 执行 kubeadm join --control-plane"
  command: >
    {{ _join_cmd_result.stdout }}
    --control-plane
    --cri-socket {{ kube_criSocket }}
    --ignore-preflight-errors=SystemVerification
  become: yes
  when: not kubelet_conf.stat.exists

# Step 7: 配置 kubectl
- name: "[Add Master] 创建 .kube 目录"
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0755"
  when: not kubelet_conf.stat.exists

- name: "[Add Master] 复制 admin.conf"
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: yes
    owner: root
    group: root
    mode: "0600"
  become: yes
  when: not kubelet_conf.stat.exists
- name: "[Add Master] 设置 kubectl 别名 k(软链接,幂等)"
  file:
    src: "{{ kube_bin_dir }}/kubectl"
    dest: "{{ kube_bin_dir }}/k"
    state: link
    force: yes
  become: yes

- name: "移除污点(允许 master 调度; 幂等,污点不存在也不报错)"
  shell: |
    for t in node-role.kubernetes.io/control-plane node-role.kubernetes.io/master node.kubernetes.io/unschedulable node.kubernetes.io/not-ready; do
      kubectl taint node {{ inventory_hostname }} ${t}- 2>/dev/null || true
    done
  args:
    executable: /bin/bash
  changed_when: false
  when: inventory_hostname != groups['k8s_master'][0]