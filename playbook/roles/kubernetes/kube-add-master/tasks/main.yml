---
# Step 1: 检查当前节点是否已加入集群
- name: "[Add Master] 检查是否已加入集群"
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

# 已加入(含首 master)则本机早停, 避免重跑把 join 那套刷一遍
- name: "[Add Master] 已加入则跳过本机后续"
  meta: end_host
  when: kubelet_conf.stat.exists

# ================================
# 仅当未加入时才执行以下操作
# ================================

# Step 2: 确保目标节点有证书目录（必须在 copy 前创建！）
- name: "[Add Master] 创建证书目录"
  file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /etc/kubernetes/pki
    - /etc/kubernetes/pki/etcd
  become: yes
  when: not kubelet_conf.stat.exists

- name: "[Add Master] 从 first master 同步证书到当前节点"
  synchronize:
    src: "{{ item }}"
    dest: "{{ item }}"
    perms: yes
    owner: yes
    group: yes
    rsync_opts:
      - "--chmod=600"
  delegate_to: "{{ groups['k8s_master'][0] }}"
  loop:
    - /etc/kubernetes/pki/ca.crt
    - /etc/kubernetes/pki/ca.key
    - /etc/kubernetes/pki/sa.key
    - /etc/kubernetes/pki/sa.pub
    - /etc/kubernetes/pki/front-proxy-ca.crt
    - /etc/kubernetes/pki/front-proxy-ca.key
  when: not kubelet_conf.stat.exists

# Step 5: 获取 join 命令（从 first master），并设为全局变量
- name: "[Add Master] 从 first master 获取 join 命令"
  shell: kubeadm token create --print-join-command
  register: _join_cmd_result
  delegate_to: "{{ groups['k8s_master'][0] }}"
  when: not kubelet_conf.stat.exists
- name:  输出k8s 命令
  debug:
    var: _join_cmd_result.stdout
  when: not kubelet_conf.stat.exists

# kk 集群的 controlPlaneEndpoint 是域名(如 lb.kubesphere.local), join 命令里写死该域名;
# 新加的 master 无此 /etc/hosts 解析且无 kk 本地 LB, 直接 join 会在 preflight 解析失败。
- name: "[Add Master] 解析 controlPlaneEndpoint 主机名"
  set_fact:
    _cp_endpoint_host: "{{ _join_cmd_result.stdout | regex_search('join\\s+([^:\\s]+):', '\\1') | first }}"
  when: not kubelet_conf.stat.exists

- name: "[Add Master] 为 controlPlaneEndpoint 写 /etc/hosts 解析({{ _cp_endpoint_host | default('') }} -> {{ kube_cp_endpoint_ip }})"
  lineinfile:
    path: /etc/hosts
    regexp: '\s{{ _cp_endpoint_host | regex_escape }}(\s|$)'
    line: "{{ kube_cp_endpoint_ip }} {{ _cp_endpoint_host }}"
    state: present
  become: yes
  when:
    - not kubelet_conf.stat.exists
    - _cp_endpoint_host is defined and (_cp_endpoint_host | length > 0)
    - not (_cp_endpoint_host | regex_search('^[0-9]{1,3}(\.[0-9]{1,3}){3}$'))

# Step 6: 执行 join
- name: "[Add Master] 执行 kubeadm join --control-plane"
  command: >
    {{ _join_cmd_result.stdout }}
    --control-plane
    --cri-socket {{ kube_criSocket }}
    --ignore-preflight-errors=SystemVerification
  become: yes
  when: not kubelet_conf.stat.exists

# Step 7: 配置 kubectl
- name: "[Add Master] 创建 .kube 目录"
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: "0755"
  when: not kubelet_conf.stat.exists

- name: "[Add Master] 复制 admin.conf"
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ ansible_env.HOME }}/.kube/config"
    remote_src: yes
    owner: root
    group: root
    mode: "0600"
  become: yes
  when: not kubelet_conf.stat.exists
- name: "[Add Master] 设置 kubectl 别名 k(软链接,幂等)"
  file:
    src: "{{ kube_bin_dir }}/kubectl"
    dest: "{{ kube_bin_dir }}/k"
    state: link
    force: yes
  become: yes

# hardware 标签(Calico 双 IPPool 选池)的【对齐】在 playbook 的 pre_tasks 里做,
# 走共享任务 playbook/tasks/ensure-hardware-label.yml。原因见 kube-add-node/tasks/main.yml
# 里的同段说明: 本文件的 `when: not kubelet_conf.stat.exists` 与 playbook 的
# `meta: end_host`(已加入则整台跳过)两层叠加, 会让 join 失败过的机器永远补不上标签且不报错。
#
# ⚠ 但 pre_tasks 那次【对刚 join 的这台无效】—— 它跑在 kubeadm join 之【前】, 那时本机
#   还不在集群里, kubectl 查不到该 Node, 对齐任务被跳过; 等 join 完 play 就结束了。
#   于是新节点要等【下一次】跑 playbook 才拿到标签。2026-09-14 现网实测中招:
#     k8s-install.yaml 装出来的 cpu201/cpu202  hardware=<none>
#     (它的 pre_tasks 连 ensure-hardware-label 都没 include, 见该文件里的说明;
#      cpu200 有标签是因为 kube-init-master/tasks/init-first-master.yml 单独打了首 master)
#   双池 + NO_DEFAULT_POOLS=true 时无标签 = 两个池都不匹配 = 拿不到任何地址,
#   该节点上新建 Pod 卡 ContainerCreating。
# 故此处在 join 【之后】补一次。判定表达式与 ensure-hardware-label.yml / init-first-master.yml
# 保持一致(都用 default(..., true), 见下)。--overwrite 幂等。
- name: "[Add Master] join 后补 hardware 标签(Calico 双池选池; 仅双池模式)"
  command: >
    kubectl --kubeconfig {{ kube_config_dir }}/admin.conf
    label node {{ inventory_hostname }}
    hardware={{ calico_pool | default('gpu' if (accelerator_type | default('none')) in ['nvidia','dcu','npu'] else 'cpu', true) }}
    --overwrite
  become: yes
  changed_when: false
  when:
    - calico_dual_ippool_enabled | default(false) | bool
    - not kubelet_conf.stat.exists

- name: "移除污点(允许 master 调度; 幂等,污点不存在也不报错)"
  shell: |
    for t in node-role.kubernetes.io/control-plane node-role.kubernetes.io/master node.kubernetes.io/unschedulable node.kubernetes.io/not-ready; do
      kubectl taint node {{ inventory_hostname }} ${t}- 2>/dev/null || true
    done
  args:
    executable: /bin/bash
  changed_when: false
  when: inventory_hostname != groups['k8s_master'][0]