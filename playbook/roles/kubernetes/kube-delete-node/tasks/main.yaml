---
- name: "[Delete Node] 检查节点是否在集群中"
  shell: "kubectl get nodes {{ inventory_hostname }} --no-headers"
  register: _node_check
  delegate_to: "{{ groups['k8s_master'][0] }}"
  failed_when: false
  changed_when: false

- block:
    - name: "[Delete Node] 驱逐节点上的 Pod (Drain)"
      shell: >
        kubectl drain {{ inventory_hostname }} 
        --ignore-daemonsets 
        --delete-emptydir-data 
        --force 
        --grace-period=30
      delegate_to: "{{ groups['k8s_master'][0] }}"
      register: _drain_result
      ignore_errors: yes

    - name: "[Delete Node] 执行 kubeadm reset"
      command: kubeadm reset -f --cri-socket {{ kube_criSocket }}
      become: yes
      register: _reset_result

    - name: "[Delete Node] 从 Master 节点删除 Node 对象"
      shell: "kubectl delete node {{ inventory_hostname }}"
      delegate_to: "{{ groups['k8s_master'][0] }}"
      ignore_errors: yes

    - name: "[Delete Node] 清理残留的 CNI 配置文件"
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /etc/cni/net.d
        - /var/lib/kubelet
        - /etc/kubernetes
        - /var/lib/etcd

    - name: "[Delete Node] 移除 kubectl 别名 'k'"
      file:
        path: "{{ kube_bin_dir }}/k"
        state: absent

  when: _node_check.rc == 0