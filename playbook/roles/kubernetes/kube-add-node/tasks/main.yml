- name: "[Add Node] 检查是否已加入集群"
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

# 已加入则本机早停, 避免重跑刷屏
- name: "[Add Node] 已加入则跳过本机后续"
  meta: end_host
  when: kubelet_conf.stat.exists

- name: "[Add Node] 从 first master 获取 join 命令"
  shell: kubeadm token create --print-join-command
  register: _join_cmd_result
  delegate_to: "{{ groups['k8s_master'][0] }}"
  when: not kubelet_conf.stat.exists

- name: "[Add Node] 执行 kubeadm join (Worker)"
  command: "{{ _join_cmd_result.stdout }} --cri-socket {{ kube_criSocket }} --ignore-preflight-errors=SystemVerification"
  become: yes
  when: not kubelet_conf.stat.exists
- name: 设置 kubectl 别名 k(软链接,幂等)
  file:
    src: "{{ kube_bin_dir }}/kubectl"
    dest: "{{ kube_bin_dir }}/k"
    state: link
    force: yes
  become: yes