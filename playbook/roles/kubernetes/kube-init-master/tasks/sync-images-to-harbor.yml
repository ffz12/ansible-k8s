---
# 自动向 kubeadm 查询本 k8s 版本的权威配套镜像版本(免手维护 k8s_compat)
- name: "[Sync Images] 查询 kubeadm 本版本配套镜像清单"
  command: "kubeadm config images list --kubernetes-version v{{ k8s_version }}"
  register: kubeadm_img_list
  changed_when: false

- name: "[Sync Images] 用 kubeadm 权威值覆盖 coredns/pause 版本"
  set_fact:
    coredns_version: "{{ (kubeadm_img_list.stdout_lines | select('search', 'coredns') | list | first).split(':')[-1] | regex_replace('^v', '') }}"
    pause_image_version: "{{ (kubeadm_img_list.stdout_lines | select('search', '/pause:') | list | first).split(':')[-1] }}"
  when: kubeadm_img_list.stdout is search('coredns')

- name: "[Sync Images] 确认解析到的版本"
  debug:
    msg: "coredns=v{{ coredns_version }}  pause={{ pause_image_version }}  (kubeadm 权威值)"

# etcd 是外置二进制集群, 由 etcd-deploy.yaml 先于控制面单独部署(那时机器上还没有 kubeadm
# 可查), 所以它的版本没法像 coredns/pause 那样在这里"自动填充"——只能在这里(kubeadm 已在)
# 拿 kubeadm 推荐的 etcd tag 当"权威裁判", 与已部署的 etcd_version 比对, 漂移就告警。
# 外置 etcd 版本是有意的运维选择(可比 kubeadm 建议的补丁号新), 默认只 warn 不拦;
# 想强制一致, env.yaml 设 etcd_version_strict: true 变硬 assert。
- name: "[Sync Images] 取 kubeadm 推荐的 etcd 版本(剥 -N 构建后缀)"
  set_fact:
    kubeadm_etcd_version: "{{ (kubeadm_img_list.stdout_lines | select('search', '/etcd') | list | first).split(':')[-1] | regex_replace('^v', '') | regex_replace('-[0-9]+$', '') }}"
  when: kubeadm_img_list.stdout is search('/etcd')

- name: "[Sync Images] etcd 版本一致性: 与 kubeadm 推荐比对"
  debug:
    msg: >-
      {{ '✓ etcd_version=' ~ etcd_version ~ ' 与 kubeadm 推荐一致'
         if (etcd_version == kubeadm_etcd_version)
         else '⚠ etcd 版本漂移: 已部署 etcd_version=' ~ etcd_version
              ~ ', 但本 k8s 版本 kubeadm 推荐 etcd=' ~ kubeadm_etcd_version
              ~ '。外置 etcd 独立运维可接受; 若非有意, 请对齐 env.yaml 的 etcd_version 后重装 etcd。' }}
  when: kubeadm_etcd_version is defined

- name: "[Sync Images] etcd 版本严格模式(可选): 漂移即失败"
  assert:
    that:
      - etcd_version == kubeadm_etcd_version
    fail_msg: >-
      etcd_version={{ etcd_version }} 与本 k8s 版本 kubeadm 推荐 etcd={{ kubeadm_etcd_version }} 不一致
      (etcd_version_strict=true)。对齐 env.yaml 的 etcd_version 或关闭严格模式。
  when:
    - etcd_version_strict | default(false) | bool
    - kubeadm_etcd_version is defined

- name: "[Sync Images] 确保 Harbor 项目存在"
  uri:
    url: "https://{{ harbor_dns }}/api/v2.0/projects"
    method: POST
    user: "{{ harbor_admin_username }}"
    password: "{{ harbor_admin_password }}"
    force_basic_auth: yes
    validate_certs: no  # 相当于 curl -k
    body_format: json
    body:
      project_name: "{{ item }}"
      public: true
    status_code: [201, 409]  # 201=创建成功, 409=已存在
  loop:
    - library
    - unisound
  run_once: true
  when: "'aliyuncs.com' not in harbor_dns"

- name: "[Sync Images] 登录 Harbor"
  shell: |
    echo "{{ harbor_admin_password }}" | docker login "{{ harbor_dns }}" -u "{{ harbor_admin_username }}" --password-stdin
  args:
    executable: /bin/bash
  register: login_result
  failed_when: "'Login Succeeded' not in login_result.stdout"

- name: "[Copy Images] 复制 Kubernetes 镜像到本地目录"
  copy:
    src: "{{ src_k8s_images_dir }}"
    dest: "{{ k8s_images_dir }}"
- name: "[Sync Images] 同步 pause 镜像并创建 multi-arch manifest"
  shell: |
    set -e
    IMAGE_NAME="{{ item }}"
    TAG="{{ pause_image_version }}"
    if docker manifest inspect --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then echo "skip ${IMAGE_NAME}:${TAG} (已在 harbor)"; exit 0; fi

    # 加载 amd64 和 arm64 镜像
    docker load -i "{{ k8s_images_dir }}/images/amd64/${IMAGE_NAME}.tar.gz"
    docker load -i "{{ k8s_images_dir }}/images/arm64/${IMAGE_NAME}.tar.gz"

    # 打标签（注意：源镜像名需匹配实际加载后的名称）
    docker tag "registry.k8s.io/${IMAGE_NAME}-amd64:${TAG}" "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64"
    docker tag "registry.k8s.io/${IMAGE_NAME}-arm64:${TAG}" "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    # 推送单架构镜像
    docker push "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64"
    docker push "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    # 创建 multi-arch manifest
    if docker manifest inspect --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then
      docker manifest rm "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1 || true
    fi

    docker manifest create --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    docker manifest annotate  "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" --os linux --arch amd64

    docker manifest annotate  "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64" --os linux --arch arm64

    docker manifest push --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}"

    # 清理本地临时镜像
    docker rmi "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64" || true
  loop: 
  - pause
  args:
    executable: /bin/bash
 
- name: "[Sync Images] 同步 coredns 镜像并创建 multi-arch manifest"
  shell: |
    set -e
    IMAGE_NAME="{{ item }}"
    TAG="v{{ coredns_version }}"
    if docker manifest inspect --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then echo "skip ${IMAGE_NAME}:${TAG} (已在 harbor)"; exit 0; fi

    # 加载 amd64 和 arm64 镜像
    docker load -i "{{ k8s_images_dir }}/images/amd64/${IMAGE_NAME}.tar.gz"
    docker load -i "{{ k8s_images_dir }}/images/arm64/${IMAGE_NAME}.tar.gz"

    # 打标签（注意：源镜像名需匹配实际加载后的名称）
    docker tag "registry.k8s.io/${IMAGE_NAME}-amd64:${TAG}" "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64"
    docker tag "registry.k8s.io/${IMAGE_NAME}-arm64:${TAG}" "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    # 推送单架构镜像
    docker push "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64"
    docker push "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    # 创建 multi-arch manifest
    if docker manifest inspect --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then
      docker manifest rm "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1 || true
    fi

    docker manifest create --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    docker manifest annotate  "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" --os linux --arch amd64

    docker manifest annotate  "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64" --os linux --arch arm64

    docker manifest push --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}"

    # 清理本地临时镜像
    docker rmi "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64" || true
  loop:
  - coredns
  args:
    executable: /bin/bash


- name: "[Sync Images] 同步 Kubernetes 镜像并创建 multi-arch manifest"
  shell: |
    set -e
    IMAGE_NAME="{{ item }}"
    TAG="v{{ k8s_version }}"
    if docker manifest inspect --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then echo "skip ${IMAGE_NAME}:${TAG} (已在 harbor)"; exit 0; fi

    # 加载 amd64 和 arm64 镜像
    docker load -i "{{ k8s_images_dir }}/images/amd64/${IMAGE_NAME}.tar.gz"
    docker load -i "{{ k8s_images_dir }}/images/arm64/${IMAGE_NAME}.tar.gz"

    # 打标签（注意：源镜像名需匹配实际加载后的名称）
    docker tag "registry.k8s.io/${IMAGE_NAME}-amd64:${TAG}" "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64"
    docker tag "registry.k8s.io/${IMAGE_NAME}-arm64:${TAG}" "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    # 推送单架构镜像
    docker push "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64"
    docker push "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    # 创建 multi-arch manifest
    if docker manifest inspect --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then
      docker manifest rm "{{ registry }}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1 || true
    fi

    docker manifest create --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64"

    docker manifest annotate  "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" --os linux --arch amd64

    docker manifest annotate  "{{ registry }}/${IMAGE_NAME}:${TAG}" \
      "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64" --os linux --arch arm64

    docker manifest push --insecure "{{ registry }}/${IMAGE_NAME}:${TAG}"

    # 清理本地临时镜像
    docker rmi "{{ registry }}/${IMAGE_NAME}:${TAG}-amd64" "{{ registry }}/${IMAGE_NAME}:${TAG}-arm64" || true
  loop: "{{ k8s_components }}"
  args:
    executable: /bin/bash
# 注: calico/flannel/cilium 等 CNI 镜像同步已移至 roles/cni/tasks/sync-cni-images.yaml

