- name: "[Init] 仅在第一个 k8s_master 节点执行"
  block:
    - name: 渲染 kubeadm 配置文件
      template:
        src: kubeadm-config.yaml.j2
        dest: "{{ kube_config_dir }}/kubeadm-config.yaml"
        mode: "0600"

    - name: 执行 kubeadm init
      command: >
        kubeadm init
        --config={{ kube_config_dir }}/kubeadm-config.yaml
        --upload-certs
        --ignore-preflight-errors=SystemVerification
      args:
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init_output

    - name: 为 root 用户配置 kubectl
      block:
        - name: 创建 .kube 目录
          file:
            path: "{{ ansible_env.HOME }}/.kube"
            state: directory
            mode: "0755"

        - name: 复制 admin.conf
          copy:
            src: /etc/kubernetes/admin.conf
            dest: "{{ ansible_env.HOME }}/.kube/config"
            remote_src: yes
            owner: root
            group: root
            mode: "0600"

        - name: 设置 kubectl 别名 k(软链接)
          file:
            src: "{{ kube_bin_dir }}/kubectl"
            dest: "{{ kube_bin_dir }}/k"
            state: link
            force: yes

    - name: 移除污点(允许 master 调度; 幂等,污点不存在也不报错)
      shell: |
        for t in node-role.kubernetes.io/control-plane node-role.kubernetes.io/master node.kubernetes.io/unschedulable node.kubernetes.io/not-ready; do
          kubectl taint node "{{ inventory_hostname }}" ${t}- 2>/dev/null || true
        done
      args:
        executable: /bin/bash
      changed_when: false

    # === CNI: 可插拔(calico/flannel/cilium),见 roles/cni ===
    - name: 部署 CNI 网络插件
      include_role:
        name: cni

    # === NodeLocal DNSCache(可选, enable_nodelocaldns=true 时随装机一起部署)===
    # 必须在 CNI 之后: 它是 DaemonSet, 没网络起不来。
    # kubelet 的 clusterDNS 已在 kubeadm-config 里指向 nodelocaldns_ip —— 这样是安全的:
    # nodelocaldns 与 coredns 都是 hostNetwork + dnsPolicy: Default, 走宿主机 DNS 启动,
    # 不依赖集群内解析; 需要集群 DNS 的业务 Pod 起来时它早已就绪。(kk 也是这个做法)
    - name: 部署 NodeLocal DNSCache
      include_role:
        name: nodelocaldns
      when: enable_nodelocaldns | default(false) | bool
