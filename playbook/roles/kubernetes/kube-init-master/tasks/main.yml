# 最终 master 列表 = [k8s_master](加 master 直接进该组 + --limit)
- name: 计算最终 master 成员列表
  set_fact:
    final_master_list: "{{ groups.k8s_master | default([]) }}"
  run_once: true
  delegate_to: localhost

# 预检: 多 master 无 LB 时入口是单点。
# ⚠ 原 fail_msg 说"kubeadm 无法 join 额外 master", 在 10c1ccd 之后已不成立 —— controlPlaneEndpoint
#   现在无条件写(无 VIP 时取「首 master:apiserver_port」), join 能过。拦的理由从"建不出来"
#   变成"建出来不是真 HA", 故给显式放行开关而非拦死。
- name: 预检 —— 多 master 未配 LB(入口为单点)
  assert:
    that:
      - (final_master_list | length) < 2
        or (has_lbvip | bool)
        or (allow_multi_master_without_lb | default(false) | bool)
    fail_msg: >-
      检测到 {{ final_master_list | length }} 个 master 但未设置 lbvip。
      集群能建起来、额外 master 也能 join(controlPlaneEndpoint 无条件写, 无 VIP 时取
      「首 master:{{ apiserver_port }}」), 但【入口是单点】: 首 master 挂了其余 master 就联系不上,
      不是真 HA。
      要真 HA: env.yaml 配 lbvip 并跑 LB(playbook/lb-haproxy-install.yaml);
      无 VIP 能力但想先建起来: lbvip 填首 master 的 IP, 并把 apiserver_lb_port 一并设为
      {{ apiserver_port }}(否则入口端口跳到 {{ apiserver_lb_port }}, 那里没人听), 以后 VIP 顶上来即真 HA;
      明知单点仍要继续: -e allow_multi_master_without_lb=true。
    success_msg: >-
      master/LB 预检通过 (master={{ final_master_list | length }},
      lbvip={{ lbvip | default('未设置', true) }},
      入口={{ apiserver_entry_host }}:{{ apiserver_entry_port }})
  run_once: true
  delegate_to: localhost

# 预检: 三个【建集群后不可改】的变量必须在 env.yaml 显式写, 故意不给 defaults 兜底 ——
# 猜错网段/DNS 域名要重建集群或重签证书, 明确报错比静默取默认值安全。
# (早先生成的精简版 env.yaml 缺这几项, 原先会拖到渲染 kubeadm-config 时才报笼统的
#  undefined; 这里提前拦住并点名缺哪几个。)
- name: 预检 —— pod_subnet / service_subnet / dns_domain 必须显式配置
  assert:
    that:
      - (pod_subnet | default('') | trim | length) > 0
      - (service_subnet | default('') | trim | length) > 0
      - (dns_domain | default('') | trim | length) > 0
    fail_msg: >-
      以下变量未配置(或为空):
      {{ ((['pod_subnet']     if (pod_subnet     | default('') | trim | length) == 0 else [])
        + (['service_subnet'] if (service_subnet | default('') | trim | length) == 0 else [])
        + (['dns_domain']     if (dns_domain     | default('') | trim | length) == 0 else []))
         | join(', ') }}。
      这三项【建完集群不可再改】(pod/service 网段要改等于重建集群, dns_domain 会进 apiserver
      证书 SAN 与 kubelet clusterDomain, 改了得重签证书), 因此【故意不在 defaults.yaml 兜底】,
      必须在 inventory/group_vars/all/env.yaml 显式写清。
      参考值见 tmp/env.yaml.example:
        pod_subnet: 10.244.0.0/12      # 与 service_subnet 及现网/LB 网段都不能重叠
        service_subnet: 10.96.0.0/12
        dns_domain: cluster.local      # 几乎不用改
      (老环境的 env.yaml 若是早先生成的精简版, 按 tmp/env.yaml.example 逐项比对补全)
    success_msg: >-
      网段/DNS 预检通过 (pod={{ pod_subnet }}, service={{ service_subnet }}, dns={{ dns_domain }})
  run_once: true
  delegate_to: localhost

# 按标签执行阶段

- name: 同步 k8s 核心镜像到 Harbor(仅离线)
  include_tasks: sync-images-to-harbor.yml
  when:
    - inventory_hostname == groups['k8s_master'][0]
    - is_offline | default(false) | bool



- name: 初始化第一个 Master
  include_tasks: init-first-master.yml
  when: inventory_hostname == groups['k8s_master'][0]
