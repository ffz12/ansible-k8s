- name: cri-dockerd包初始化x86版本
  block:
  - name: cir-dockerd包拷贝
    copy: src={{ offline_binaries }}/docker/{{ cri_dockerd_x86 }} dest=/tmp mode=0755
  - name: 解压 
    shell: |
      tar xf /tmp/{{ cri_dockerd_x86 }} -C /tmp
      mv /tmp/cri-dockerd/* /usr/bin/ 
  when: 'ansible_architecture in ["x86_64"]'

- name:  cri-dockerd包初始化aarch64
  block:
  - name: cri-dockerd包拷贝
    copy: src={{ offline_binaries }}/docker/{{ cri_dockerd_aarch64 }} dest=/tmp mode=0755
  - name: 解压
    shell: |
      tar xf /tmp/{{ cri_dockerd_aarch64 }} -C /tmp
      mv /tmp/cri-dockerd/* /usr/bin/
  when: 'ansible_architecture in ["aarch64"]'

- name: 拷贝cir-docker.socket
  copy: src={{ item }} dest=/usr/lib/systemd/system/
  loop: "{{ cri_dockerd_services }}"
- name: 拷贝cir-docker.service
  template: src=cri-docker.service.j2 dest=/usr/lib/systemd/system/cri-docker.service backup=yes
  notify: restart cri-docker 
- name: 启动cri-dcokerd
  service: name=cri-docker state=started enabled=true  daemon_reload=yes
- name: 检查cri-docker服务运行
  shell: "systemctl is-active cri-docker.service"
  register: cri_docker_status
  changed_when: false
  failed_when: false
- name: debug
  debug:
    msg: "{{ cri_docker_status.stdout }}"

