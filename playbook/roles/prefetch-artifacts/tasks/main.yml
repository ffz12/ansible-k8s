# =============================================================================
#  prefetch-artifacts —— 在指定联网节点([stager] 组)下齐全部离线物料,
#  汇回控制机 offline/artifacts/, 之后各节点走 is_offline=true 离线装。
#  拉不动/拉得慢的节点不再逐台公网拉。
#
#  依赖(stager 节点): skopeo(按架构精确拉镜像) + curl + tar + gzip。缺则自动尝试装。
# =============================================================================

- name: "[Prefetch] 检查依赖(skopeo/curl/tar/gzip)"
  shell: "command -v {{ item }}"
  register: _prefetch_dep
  changed_when: false
  failed_when: false
  loop:
    - skopeo
    - curl
    - tar
    - gzip

- name: "[Prefetch] 缺依赖则尝试安装(在线节点)"
  package:
    name: "{{ item.item }}"
    state: present
  become: yes
  loop: "{{ _prefetch_dep.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0

- name: "[Prefetch] 创建工作目录 {{ stager_work_dir }}"
  file:
    path: "{{ stager_work_dir }}"
    state: directory
    mode: "0755"
  become: yes

- name: "[Prefetch] 下发下载脚本到 stager"
  copy:
    src: "{{ playbook_dir | dirname }}/offline/{{ item }}"
    dest: "{{ stager_work_dir }}/{{ item }}"
    mode: "0755"
  become: yes
  loop: "{{ prefetch_scripts }}"

- name: "[Prefetch] 在 stager 执行下载(GB 级, 可能较久)"
  command: "bash {{ stager_work_dir }}/{{ item }} {{ prefetch_arch }}"
  become: yes
  loop: "{{ prefetch_scripts }}"
  register: _prefetch_run
  changed_when: true

- name: "[Prefetch] 确保控制机 artifacts 目录存在"
  file:
    path: "{{ offline_artifacts }}"
    state: directory
  delegate_to: localhost
  run_once: true
  become: no

# 从 stager 拉回控制机(mode: pull)。rsync 按大小/时间增量, 已有的完整物料不重传。
# 注: synchronize 与 become 组合有坑, 这里靠 connect_as=root(本项目默认)直接读 root 产物。
- name: "[Prefetch] 回传物料到控制机 offline/artifacts/"
  synchronize:
    src: "{{ stager_work_dir }}/artifacts/"
    dest: "{{ offline_artifacts }}/"
    mode: pull
  become: no

- name: "[Prefetch] 完成提示"
  debug:
    msg: >-
      物料已汇到控制机 {{ offline_artifacts }} 。
      部署时置 is_offline=true 走离线链(镜像 -> 首 master load -> 推 Harbor -> 各节点拉)。
