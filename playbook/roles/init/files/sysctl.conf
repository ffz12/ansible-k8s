#
# /etc/sysctl.conf - Configuration file for setting system variables
# See /etc/sysctl.d/ for additional system variables.
# See sysctl.conf (5) for information.

#kernel.domainname = example.com
# Uncomment the following to stop low-level messages on console
#kernel.printk = 3 4 1 3
###################################################################
# Functions previously found in netbase
# Uncomment the next two lines to enable Spoof protection (reverse-path filter)
# Turn on Source Address Verification in all interfaces to
# prevent some spoofing attacks
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.all.rp_filter = 0
# Uncomment the next line to enable TCP/IP SYN cookies
# See http://lwn.net/Articles/277146/
# Note: This may impact IPv6 TCP sessions too
#net.ipv4.tcp_syncookies=1
# Uncomment the next line to enable packet forwarding for IPv4
net.ipv4.ip_forward = 1
# Uncomment the next line to enable packet forwarding for IPv6
#  Enabling this option disables Stateless Address Autoconfiguration
#  based on Router Advertisements for this host
#net.ipv6.conf.all.forwarding=1
# Additional settings - these settings can improve the network
# security of the host and prevent against some network attacks
# including spoofing attacks and man in the middle attacks through
# redirection. Some network environments, however, require that these
# settings are disabled so review and enable them as needed.
# Do not accept ICMP redirects (prevent MITM attacks)
#net.ipv4.conf.all.accept_redirects = 0
#net.ipv4.conf.default.accept_redirects = 0
# _or_
# Accept ICMP redirects only for gateways listed in our default
# gateway list (enabled by default)
# net.ipv4.conf.all.secure_redirects = 1
# Do not send ICMP redirects (we are not a router)
#net.ipv4.conf.all.send_redirects = 0
# Log Martian Packets
#net.ipv4.conf.all.log_martians = 1
# Magic system request Key
# 0=disable, 1=enable all, >1 bitmask of sysrq functions
# See https://www.kernel.org/doc/html/latest/admin-guide/sysrq.html
# for what other values do
#kernel.sysrq=438
net.bridge.bridge-nf-call-arptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.bridge.bridge-nf-call-iptables = 1
net.ipv4.ip_local_reserved_ports = 30000-32767
# ⚠ 下面三项取值按【交付标准】1.6 Sysctl 表, 比本文件历史值更低:
#     netdev_max_backlog  65535    -> 16384
#     rmem_max            33554432 -> 16777216
#     wmem_max            33554432 -> 16777216
#   RDMA 走内核旁路、不经过 TCP socket buffer, 所以这三项主要影响 TCP 流量
#   (镜像拉取、走 TCP 的存储)。若实测 TCP 吞吐不足需要更大 buffer, 在这里调大
#   并在交付材料里作为偏离项说明。
net.core.netdev_max_backlog = 16384
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.somaxconn = 32768
net.ipv4.tcp_max_syn_backlog = 1048576
net.ipv4.neigh.default.gc_thresh1 = 512
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
net.ipv4.tcp_retries2 = 15
net.ipv4.tcp_max_tw_buckets = 1048576
net.ipv4.tcp_max_orphans = 65535
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 10
net.ipv4.udp_rmem_min = 131072
net.ipv4.udp_wmem_min = 131072
net.ipv4.conf.all.arp_accept = 1
net.ipv4.conf.default.arp_accept = 1
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
vm.max_map_count = 262144
vm.swappiness = 0
vm.overcommit_memory = 0
# inotify: kubelet/containerd 监听大量文件; 按交付标准 1.6 表取 1048576(原 524288)
fs.inotify.max_user_instances = 1048576
fs.inotify.max_user_watches = 1048576
fs.inotify.max_queued_events = 1048576
fs.pipe-max-size = 4194304
fs.aio-max-nr = 262144
kernel.pid_max = 1000001
kernel.watchdog_thresh = 5
net.ipv4.tcp_tw_reuse = 1  
kernel.hung_task_timeout_secs = 30

# ===== k8s / 大规模容器场景补充(原文件缺, 大集群易撞上限) =====
# conntrack 表: kube-proxy(iptables/ipvs)每条 Service 连接占一条; 满了新连接直接被丢,
# 表现为"偶发连不上 Service / 丢包", dmesg 里 nf_conntrack: table full, dropping packet
net.netfilter.nf_conntrack_max = 1048576
# 全局最大文件句柄数(kubelet/containerd/大量 Pod 都吃 fd; 与 LimitNOFILE 是两个层面)
# 按交付标准 1.6 表取 12000500(原 1000000)。注意 fs.file-max 是【整机】上限,
# fs.nr_open 是【单进程】上限, 两者不同层面, 都要够。
fs.file-max = 12000500
fs.nr_open = 1048576

# ===== 以下 4 项原先只在 99-node-tuning.conf drop-in 里, 现合并到本文件 =====
# 为什么合并: /etc/sysctl.d/99-node-tuning.conf 在字母序上排在 99-sysctl.conf
# (= systemd 对 /etc/sysctl.conf 的处理名)【之前】, 所以本文件后加载、一律覆盖
# drop-in 的同名项。原模板注释以为 99- 前缀就能覆盖主配置, 方向搞反了 ——
# 实测 6 项(netdev_max_backlog/rmem_max/wmem_max/file-max/inotify×2)全部被本文件
# 盖掉, 而只在 drop-in 里定义的项才生效。与其靠文件名排序打架, 不如只留一处定义。
# 用户命名空间(容器 rootless / 部分 GPU 场景需要)
user.max_user_namespaces = 63359
# 临时端口范围。起点 32768 恰在 NodePort 段(30000-32767)之上, 与上面
# net.ipv4.ip_local_reserved_ports = 30000-32767 的意图一致, 不冲突。
net.ipv4.ip_local_port_range = 32768 60999
# keyring(容器镜像解密 / 内核密钥环)
kernel.keys.maxkeys = 2000
kernel.keys.maxbytes = 2000000
# 全局最大线程数: podPidsLimit 是【单 Pod】上限, 这个是【整机】上限, 两者要匹配
# (本仓库 kubelet_pod_pids_limit 可到 5w, 整机线程上限太低会先撞墙)
kernel.threads-max = 655360
