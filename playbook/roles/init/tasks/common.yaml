- name: 检查默认时区是否为上海
  shell: timedatectl | grep 'Time zone' | awk '{print $3}'
  register: current_timezone
  changed_when: false
  tags: [timezone]

- name: debug
  debug:
    var: current_timezone.stdout
  tags: [timezone]

- name: 如果时区不是上海则设置为上海
  command: timedatectl set-timezone Asia/Shanghai
  when: current_timezone.stdout != "Asia/Shanghai"
  tags: [timezone]

- name: modprobe br_netfilter
  shell: modprobe br_netfilter
  changed_when: false
  tags: [sysctl]

# 删掉原来单独的 state=touch 任务(每次都报 changed,不幂等);
# 改由 blockinfile 的 create=yes 在文件不存在时自动创建。
- name: 永久加载br_netfilter
  blockinfile:
    path: /etc/modules-load.d/br_netfilter.conf
    create: yes
    owner: root
    group: root
    mode: '0644'
    block: |-
       br_netfilter
    state: present
    backup: yes
    marker: "# Ansible inventory  {mark}"
  tags: [sysctl]
# ipvs 模式(kube_proxy_mode=ipvs)需要这些内核模块。仓库原先只装了 ipvsadm【工具包】,
# 从没加载 ip_vs 内核模块 —— 缺模块时 kube-proxy 会【静默回退到 iptables】, 看着像在跑
# ipvs 其实不是(kubectl -n kube-system logs kube-proxy-xxx 里会有 "can't use ipvs proxier"),
# 且 nodelocaldns / conntrack 相关调优的前提也不成立。
# nf_conntrack: 新内核叫 nf_conntrack, 4.18 之前叫 nf_conntrack_ipv4, 两个都试一下。
# 本机是 iptables 模式时加载这些也无害(只是多几个模块常驻)。
# nftables 模式不需要 ip_vs*, 故只加载 nf_conntrack(conntrack 三种模式都要)。
- name: modprobe 内核模块(nf_conntrack always; ip_vs* 仅非 nftables 模式)
  shell: |
    for m in {{ 'nf_conntrack nf_conntrack_ipv4' if (kube_proxy_mode | default('iptables')) == 'nftables'
                else 'ip_vs ip_vs_rr ip_vs_wrr ip_vs_sh nf_conntrack nf_conntrack_ipv4' }}; do
      modprobe "$m" 2>/dev/null || true
    done
    # 至少 ip_vs 必须在, 否则 ipvs 模式起不来(nftables 模式下这行会是 IPVS_MISSING, 但下面的 assert 会跳过)
    lsmod | grep -q '^ip_vs' && echo IPVS_OK || echo IPVS_MISSING
  args:
    executable: /bin/bash
  register: _ipvs_mod
  changed_when: false
  tags: [sysctl]

- name: 校验 ip_vs 已加载(ipvs 模式的硬前提)
  assert:
    that: "'IPVS_OK' in _ipvs_mod.stdout"
    fail_msg: >-
      本机加载不到 ip_vs 内核模块, 而 kube_proxy_mode={{ kube_proxy_mode | default('iptables') }}。
      内核可能未编译 ip_vs(检查 ls /lib/modules/$(uname -r)/kernel/net/netfilter/ipvs/)。
      要么换内核, 要么在 env.yaml 改 kube_proxy_mode: iptables —— 否则 kube-proxy 会静默
      回退 iptables, 与配置不符且难排查。
  when: kube_proxy_mode | default('iptables') == 'ipvs'
  tags: [sysctl]

# nf_conntrack 三种模式都要(Service 连接跟踪); ip_vs* 只有 ipvs 模式用得上。
# nftables/iptables 模式下写 ip_vs* 只是每次开机白加载四个模块 —— 不影响数据面,
# 但 lsmod 里多四行噪音, 排查时容易误判成"这机器在跑 ipvs"。
# ⚠ 文件名保持 ipvs.conf 不变: 改名会把存量节点上那份旧文件变成孤儿(没人再管它,
#   里面的 ip_vs* 继续开机加载)。靠 blockinfile 的 marker 原地改内容 —— 于是
#   ipvs -> nftables 切换的节点重跑一次本 role, ip_vs* 会被自动删掉, nf_conntrack 留着。
- name: 永久加载内核模块(nf_conntrack always; ip_vs* 仅非 nftables 模式)
  blockinfile:
    path: /etc/modules-load.d/ipvs.conf
    create: yes
    owner: root
    group: root
    mode: '0644'
    block: |-
       {% if (kube_proxy_mode | default('iptables')) != 'nftables' %}
       ip_vs
       ip_vs_rr
       ip_vs_wrr
       ip_vs_sh
       {% endif %}
       nf_conntrack
    state: present
    backup: yes
    marker: "# Ansible ipvs {mark}"
  tags: [sysctl]

- name: 内核参数调优
  copy: src=sysctl.conf dest=/etc/sysctl.conf owner=root group=root mode=0644
  tags: [sysctl]

# ============================================================================
#  为什么不再用 99-node-tuning.conf drop-in(2026-09-09 合并进 files/sysctl.conf)
#
#  原设计: 把交付标准 1.6 的 13 项 sysctl 放独立 drop-in, 靠 99- 前缀"后加载覆盖主配置"。
#  实际相反 —— systemd 把 /etc/sysctl.conf 当作 99-sysctl.conf 处理, 而字母序是:
#      99-node-tuning.conf  <  99-swap.conf  <  99-sysctl.conf
#  drop-in 排在【前面】, 所以 /etc/sysctl.conf 最后加载、一律覆盖 drop-in 的同名项。
#
#  现网实测(35 节点全部一致)佐证: 两个文件都定义的 6 项全部按 sysctl.conf 生效 ——
#      netdev_max_backlog 16384->65535   rmem_max/wmem_max 16M->32M
#      fs.file-max 12000500->1000000     inotify max_user_{watches,instances} 1M->512K
#  而只在 drop-in 里定义的 5 项(user.max_user_namespaces / ip_local_port_range /
#  keys.maxkeys / keys.maxbytes / inotify.max_queued_events)才真正生效。
#  连带后果: node_tuning_keep_higher_net_buffers 这个开关一直是【空转】的 ——
#  设 true 或 false 结果都是 sysctl.conf 的大值。
#
#  与其靠文件名排序打架, 不如【只留一处定义】: 13 项全部合并进 files/sysctl.conf,
#  删掉 drop-in。下面那个 state: absent 是无条件的, 用来清掉存量机器上的旧文件。
# ============================================================================
- name: 移除已废弃的 99-node-tuning.conf drop-in(已合并进 /etc/sysctl.conf)
  file:
    path: /etc/sysctl.d/99-node-tuning.conf
    state: absent
  tags: [sysctl]
# ⚠ 必须用 --system 而非 -p:
#   sysctl -p        只读 /etc/sysctl.conf, 【不读】 /etc/sysctl.d/ 下的 drop-in
#   sysctl --system  按 99- 等前缀顺序加载全部 drop-in + 主配置(与开机时行为一致)
#   本仓库仍有 99-swap.conf 在 sysctl.d 下 —— 用 -p 的话它在本次运行里【不生效】,
#   只有重启后才生效, 容易误判"参数没写进去"。
#   (99-swap.conf 的 vm.swappiness=0 与 sysctl.conf 第 72 行同值, 实际赢的是后者;
#    它是冗余的, 但删除属于行为变更, 留待单独处置。)
- name: 执行sysctl(--system 以便同时加载 /etc/sysctl.d/ 下的 drop-in)
  shell: |
      sysctl --system
  tags: [sysctl]
- name: 调整文件描述符限制
  blockinfile:
    path: /etc/security/limits.conf
    block: |-
       root soft memlock unlimited
       root hard memlock unlimited
       root soft stack unlimited
       root hard stack unlimited
       root soft nofile  1000001
       root hard nofile  1000001
       * soft memlock unlimited
       * hard memlock unlimited
       * soft stack unlimited
       * hard stack unlimited
       * soft nofile 1000001
       * hard nofile 1000001



    state: present
    backup: yes
    marker: "# Ansible inventory  {mark}"
  tags: [limits]

# ============================================================================
#  systemd 全局 TasksMax —— Pod pid 上限的最后一环
#
#  为什么要在这儿改: 本仓库 containerd 配的是 SystemdCgroup = true, Pod 的 cgroup 由
#  systemd 管。kubeadm-config 的 podPidsLimit 填 -1 时 kubelet 【不写】pod cgroup 的
#  pids.max, 于是继承 kubepods.slice -> 落到 /etc/systemd/system.conf 的 DefaultTasksMax
#  (Ubuntu 默认注释掉当文档用: #DefaultTasksMax=15%, 即 kernel.pid_max 的 15%)。
#  2026-09-14 现网在容器内实测 pids.max=3000 就是这么来的 —— kubelet 已经是 -1 了,
#  但 Pod 仍被 systemd 的默认值卡住。此前只能手工:
#      sed -i 's/^DefaultTasksMax=.*/DefaultTasksMax=infinity/' /etc/systemd/system.conf
#      && systemctl daemon-reexec
#  ⚠ 那条手工命令在 Ubuntu 上其实是【静默空转】的: '^DefaultTasksMax=' 匹配不到被注释
#    的那行, 而 && 后面的 daemon-reexec 照样成功、shell 模块又总报 changed, 看着像做成了。
#    cpu200 实测 grep 出来仍是 "#DefaultTasksMax=15%" —— 从未被改过。
#    用 lineinfile + '^[#\s]*DefaultTasksMax=' 才能同时命中注释行与已生效行, 且幂等。
#
#  ⚠ 时机很关键: DefaultTasksMax 只在 systemd 【创建】单元/slice 那一刻被读取, 不会
#    追溯修改已存在的 slice。所以:
#      · 在 init 阶段(k8s 还没装, kubepods.slice 尚不存在)改好 -> 之后 slice 首次创建
#        就直接继承 infinity, 【不需要 daemon-reexec, 也不用重启任何东西】。这是本任务
#        放在 init role 里的理由。
#      · 在【已跑起来】的节点上改 -> 必须 daemon-reexec 让 PID 1 重读, 且已存在的
#        kubepods.slice 与在跑的 Pod 拿不到新值, 只有新建的 Pod 才会用上; 存量 Pod
#        要生效只能重启节点。故本任务【不自动 daemon-reexec】—— 那是重新执行 PID 1,
#        影响整台机器所有单元, 不该在一个"顺手改配置"的任务里悄悄做。改到了就打印提示,
#        由人决定时机。
#
#  ⚠ infinity 等于放弃这层保护, fork 炸弹可打满整机 pid(kernel.pid_max=1000001)。
#    要一个确定的上限, 用 kubelet_pod_pids_limit(默认 50000, 由 kubelet 直接写进 pod
#    cgroup, 与本项无关)比依赖 podPidsLimit=-1 + 本项更可控。
#    不想放开本项的站点: env.yaml 里 init_set_default_tasks_max: false。
# ============================================================================
- name: 放开 systemd 全局 TasksMax(Pod pid 上限的最后一环; init_set_default_tasks_max 可关)
  when: init_set_default_tasks_max | default(true) | bool
  tags: [limits]
  block:
    - name: 设置 DefaultTasksMax(同时命中注释行, 幂等)
      lineinfile:
        path: /etc/systemd/system.conf
        # 同时匹配 "#DefaultTasksMax=15%" 与 "DefaultTasksMax=xxx", 故用 [#\s]*
        regexp: '^[#\s]*DefaultTasksMax='
        line: "DefaultTasksMax={{ init_default_tasks_max | default('infinity') }}"
        backup: yes
      register: init_tasks_max

    - name: 提示 —— 本次改动何时生效
      debug:
        msg: >-
          已把 /etc/systemd/system.conf 的 DefaultTasksMax 设为
          {{ init_default_tasks_max | default('infinity') }}。
          该值只在 systemd 【创建】单元/slice 时读取:
          若本机还没装 k8s(init 阶段的正常情况), 之后 kubepods.slice 首次创建即继承新值,
          无需任何额外动作;
          若本机【已在跑 k8s】, 则需 `systemctl daemon-reexec` 让 PID 1 重读, 且已存在的
          kubepods.slice 与在跑的 Pod 拿不到新值(只有新建 Pod 会用上), 存量 Pod 要生效
          只能重启节点。核对实际生效值: `systemctl show --property DefaultTasksMax`。
      when: init_tasks_max is changed

- name: 关闭当前已启用的 swap
  shell: "swapoff -a"
  ignore_errors: true
  changed_when: false
  tags: [swap]

# ⚠ 原来用 lineinfile regexp: 'swap' state: absent 直接【删行】, 那个裸 'swap'
#   会连 /data/swaparea、/var/log/swapstats 这类路径里带 swap 字样的正常挂载行
#   一起删掉(把数据盘挂载点删了)。改成锚定「第 3 列 fstype == swap」且只【注释】
#   不删除, 便于回滚。
- name: 注释掉 fstab 中真正的 swap 条目(锚定第 3 列, 保留原行)
  replace:
    path: /etc/fstab
    regexp: '^(?!\s*#)(\s*\S+\s+\S+\s+swap\s+.*)$'
    replace: '# [init] swap disabled: \1'
    backup: yes
  tags: [swap]

# sysctl -w 只在当前内核生效, 重启就丢; 落盘到 sysctl.d 才持久。
- name: 持久化 vm.swappiness=0
  copy:
    dest: /etc/sysctl.d/99-swap.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # 由 Ansible init 写入: 尽量不使用 swap(真正关闭靠 swapoff + fstab)
      vm.swappiness = 0
  register: init_swappiness_conf
  tags: [swap]

- name: 应用 swappiness
  command: sysctl -p /etc/sysctl.d/99-swap.conf
  when: init_swappiness_conf is changed
  changed_when: true
  tags: [swap]

# ⚠ 本任务【不加 ignore_errors】—— 下面两个 chrony 任务都带 ignore_errors, 配置写歪了
#   不会报错; 而 allow 漏配的症状(客户端全 ^? 不可达)要到部署后才发现。故在这里硬拦,
#   别让它变成静默失败。
- name: 预检 —— [chronyserver] 组的机器必须配 chrony_allow_networks
  assert:
    that:
      - (chrony_allow_networks | default([]) | length) > 0
    fail_msg: |
      ❌ 本机 {{ inventory_hostname }} 在 inventory 的 [chronyserver] 组里(要当内网 NTP server),
         但 chrony_allow_networks 没配 —— chrony 默认【拒绝所有】NTP 请求, 这样装出来的
         server 谁都同步不上, 且 server 自己 chronyc tracking 一切正常, 很难发现。

      在 inventory/group_vars/all/env.yaml 填要放行的客户端网段:
        chrony_allow_networks:
          - 10.14.64.0/24
          - 10.101.16.0/24

      不想自建 NTP server 了: 把 inventory 的 [chronyserver] 组【整组留空】即可,
      本特性完全不生效, 全集群沿用原来指向 chrony_ip 的纯客户端行为。
    success_msg: "本机将作为内网 NTP server, 放行网段: {{ chrony_allow_networks | join(', ') }}"
  # ⚠ 判据与 chrony.conf.j2 里的 is_chrony_server 必须一致 —— [chronyserver] 常被写成
  #   裸 IP, 而同一台在 [cluster] 里是 `名字 ansible_host=IP`。只比 inventory_hostname
  #   时这台永远匹配不上, 于是本 assert 被静默跳过(chrony_allow_networks 漏没漏都不报),
  #   同时模板也把它渲染成"指向自己的客户端"。两处一起错, 症状是客户端集体 ^? 不可达。
  when: >
    inventory_hostname in (groups['chronyserver'] | default([]))
    or (ansible_host | default('')) in (groups['chronyserver'] | default([]))
  tags: [chrony]

- name: 统一配置时间同步 chrony.conf 配置文件
  template:
    src: chrony.conf.j2
    dest: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
    owner: root
    group: root
    mode: '0644'
  ignore_errors: yes
  tags: [chrony]

- name: 统一启动并设置 chronyd 服务开机自启
  service:
    # 修复: Debian/Ubuntu 上服务名是 chrony,不是 chronyd;原来固定 chronyd 在 Debian 上被 ignore_errors 掩盖,导致时间同步服务实际没启动
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    state: restarted
    enabled: yes
  ignore_errors: yes
  tags: [chrony]

# ============================================================================
#  以下三步是【验证】, 2026-09-09 补。
#
#  为什么必须验证: 上面写配置 + 重启服务两步都带 ignore_errors, 而且做完就结束 ——
#  从来不检查 chrony 到底有没有【锁上时间源】。于是一台机器可以带着
#  "chrony 进程正在运行、但一个源都没选中" 的状态走完整个 init, 而 init 全程报成功。
#
#  这不是假设: 2026-09-09 在 gn-10-14-64-1 / cn-10-14-73-{1,2,3,20} 上实测,
#  五台全是 Reference ID 00000000 / Stratum 0 / Ref time 1970(= 一次都没同步过),
#  其中一台的钟快了 8 小时 05 分, 而交付标准要求集群内最大时间差 <15 秒。
#  时钟错 8 小时会连带坑 etcd lease、证书有效期(TLS 报 certificate is not yet valid)、
#  kubelet、日志时序, 且症状通常和"时间"看不出关系, 排查代价极高。
#
#  ⚠ 判据必须是 Reference ID / NTPSynchronized, 【不能只看 date】——
#    钟面值恰好正确 ≠ 已同步。没有源在维持它, 随时会漂; 本次就有一台
#    "看着正常"的机器在两次采样之间倒退了 8 小时。
#  ⚠ 同理, 光 grep 配置文件里的 server 行也不够: 那只证明【文件】写对了,
#    证明不了【进程】在用它(进程可能还挂着重启前的旧配置)。
#
#  本角色沿用 ignore_errors 的宽松风格, 所以这里只【响亮告警】不中断
#  (os-init 侧同名检查是硬失败, 由 osinit_fail_on_unsynced 控制)。
#  要在 init 里也硬失败: -e init_fail_on_unsynced=true
# ============================================================================

- name: 触发一次强制对时并等待 chrony 选定时间源(最多 {{ init_chrony_sync_wait | default(60) }} 秒)
  shell: |
    set -o pipefail
    chronyc makestep >/dev/null 2>&1 || true
    refid=$(chronyc tracking 2>/dev/null | awk -F': *' '/Reference ID/{print $2}' | awk '{print $1}')
    sync=$(timedatectl show -p NTPSynchronized --value 2>/dev/null)
    echo "REFID=${refid:-none}"
    echo "SYNCED=${sync:-unknown}"
    # 锁上源的判据: Reference ID 既非空也非全零。全零表示一个源都没选中。
    if [ -n "$refid" ] && [ "$refid" != "00000000" ]; then echo "LOCKED=yes"; else echo "LOCKED=no"; fi
  args:
    executable: /bin/bash
  register: init_chrony_state
  until: "'LOCKED=yes' in init_chrony_state.stdout"
  retries: "{{ ((init_chrony_sync_wait | default(60) | int) / 5) | round(0, 'ceil') | int }}"
  delay: 5
  changed_when: false
  failed_when: false
  tags: [chrony]

- name: 时间同步状态
  debug:
    msg: >-
      {{ inventory_hostname }}: {{ init_chrony_state.stdout_lines | default(['(未采集到)']) }}
      本机时间(UTC)={{ ansible_date_time.iso8601 | default('n/a') }}
  tags: [chrony]

# 未锁上源时响亮打一条 —— 别让它变成静默跳过。全集群跑完没人会回头看某台的
# chronyc tracking, 而下次发现时通常已经是"TLS 报证书未生效""etcd 选举异常"
# 这类间接症状, 再从那里倒查回时间要绕很大一圈。
- name: ⚠ chrony 未锁定任何时间源(时间不可信)
  debug:
    msg: |
      ⚠⚠⚠ {{ inventory_hostname }} 的 chrony 没有锁定任何时间源, 系统时间不可信。⚠⚠⚠

      实测: {{ init_chrony_state.stdout_lines | default(['(未采集到)']) | join(' | ') }}
      当前源配置: {{ '集群内自建 NTP server ' ~ (groups['chronyserver'] | default([]) | join(','))
                     if (groups['chronyserver'] | default([]) | length) > 0
                     else 'chrony_ip = ' ~ (chrony_ip | default('未定义')) }}

      交付标准要求集群内最大时间差 <15 秒, 当前状态不满足。排查:
        chronyc sources -v     # 状态符 ^* = 已选中; 全是 ^? = 都不可达或被拒
        chronyc tracking       # Reference ID 全零 = 一个源都没选中
      常见原因:
        1) 源在本机房不可达(封闭机房指了公网源) —— 内网有 NTP 就改 chrony_ip,
           或把某台能出网的机器放进 inventory 的 [chronyserver] 组自建
        2) 防火墙未放行 udp/123
        3) 自建了 server 但 chrony_allow_networks 没覆盖本机所在网段 ——
           症状正是 server 自己 tracking 正常、这台客户端全 ^?
           (上面那个 assert 只检查列表非空, 不检查是否覆盖所有客户端网段)
        4) systemd-timesyncd 与 chrony 抢 udp/123 —— 停掉并 mask 它
      核对跨节点实际差值:
        ansible all -m shell -a 'date -u +%FT%T'
  when: "'LOCKED=yes' not in (init_chrony_state.stdout | default(''))"
  tags: [chrony]

- name: chrony 未锁定时间源则中止(需显式开启)
  fail:
    msg: >-
      {{ inventory_hostname }} 的 chrony 未锁定任何时间源, 且已设
      init_fail_on_unsynced=true。详情见上一条。
  when:
    - init_fail_on_unsynced | default(false) | bool
    - "'LOCKED=yes' not in (init_chrony_state.stdout | default(''))"
  tags: [chrony]
