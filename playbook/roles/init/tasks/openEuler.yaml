# playbook/roles/init/tasks/openEuler.yaml

# ==================== 1. openEuler 基础环境配置 (通用) ====================
- name: openEuler类型环境配置
  block:
    - name: 设置 hostname
      tags: [hostname]
      hostname:
        name: "{{ inventory_hostname }}"

# ==================== 2. 软件源策略分流与软件包安装 ====================

- name: 【离线模式】openEuler 双架构离线 RPM 本地 yum 源安装
  tags: [packages]
  # 走本地 yum 源(而非 localinstall *.rpm 整目录全装): tar 里已带 repodata(download_openeuler_packages.sh 生成),
  # 只装显式列表 euler_offline_pkgs; haproxy/keepalived 也在同一 tar 里但不在列表 -> 非 LB 节点只存不装,
  # LB 节点由 haproxy-ha 从这个本地源按名安装。改列表需同步 download_openeuler_packages.sh 的 OFFLINE_PKGS(不含 LB 那两个)。
  block:
    - name: 检查并屏蔽官方默认软件源 (防止联网超时卡死)
      file:
        path: /etc/yum.repos.d/openEuler.repo
        state: absent
      # 相比 mv，直接 absent 更安全且支持多次重复运行（幂等）

    - name: 创建离线包存放目录
      file:
        path: /opt/openEuler-pkgs
        state: directory
        mode: '0755'

    - name: 动态同步对应架构的 RPM 离线安装包
      unarchive:
        src: "{{ offline_artifacts }}/ios-offline/openEuler{{ ansible_distribution_version.split('.')[0] }}_{{ 'arm64' if ansible_architecture == 'aarch64' else 'x86_64' }}.tar.gz"
        dest: /opt/openEuler-pkgs/
        mode: '0644'
        owner: root
        group: root

    - name: 检测离线包是否带 repodata(带则走本地 yum 源, 否则回退 localinstall)
      stat:
        path: /opt/openEuler-pkgs/repodata/repomd.xml
      register: euler_repodata

    - name: 屏蔽其余联网默认源(防离线联网超时卡死)
      shell: |
        shopt -s nullglob
        for f in /etc/yum.repos.d/*.repo; do
          [ "$f" = /etc/yum.repos.d/local-offline.repo ] && continue
          mv -f "$f" "$f.disabled"
        done
      args:
        executable: /bin/bash
      when: euler_repodata.stat.exists

    - name: 写入本地离线 yum 源
      copy:
        dest: /etc/yum.repos.d/local-offline.repo
        content: |
          [local-offline]
          name=Local Offline Repo
          baseurl=file:///opt/openEuler-pkgs
          enabled=1
          gpgcheck=0
        owner: root
        group: root
        mode: '0644'
      when: euler_repodata.stat.exists

    - name: 从本地源安装基础软件包(显式列表, 不含 haproxy/keepalived)
      shell: yum install -y --disablerepo="*" --enablerepo="local-offline" {{ euler_offline_pkgs | join(' ') }}
      when: euler_repodata.stat.exists

    - name: (回退) 无 repodata 时整目录本地安装
      shell: yum localinstall /opt/openEuler-pkgs/*.rpm -y
      when: not euler_repodata.stat.exists

  vars:
    # 与 download_openeuler_packages.sh 的 OFFLINE_PKGS 保持一致(去掉 haproxy/keepalived —— 那两个只 LB 节点装)
    euler_offline_pkgs:
      - openssl-libs
      - pcre
      - zlib
      - socat
      - chrony
      - ipvsadm
      - conntrack-tools
      - nfs-utils
      - unzip
      - wget
      - net-tools
      - lrzsz
      - vim
      - tar
      - rsync
      - tmux
      - htop
      - bash-completion
      - curl
      - gcc
      - gcc-c++
      - make
      - cmake
      - git
      - ipset
      - ebtables
      - libseccomp
      - bzip2
      - sysstat
      - iotop
      - lsof
      - psmisc
      - nmap-ncat
      - telnet
      - jq
      - device-mapper-persistent-data
      - lvm2
      - python3
  when: is_offline | bool

- name: 【在线模式】联网批量安装必要基础软件包
  tags: [packages]
  yum:
    name:
      - createrepo
      - wget
      - net-tools
      - lrzsz
      - gcc
      - gcc-c++
      - make
      - cmake
      - libxml2-devel
      - openssl-devel
      - curl
      - curl-devel
      - unzip
      - sudo
      - libaio-devel
      - vim
      - ncurses-devel
      - autoconf
      - automake
      - zlib-devel
      - openssh-server
      - socat
      - ipvsadm
      - conntrack
      - ebtables
      - g++
      - ipset
      - git
      - elfutils-libelf-devel
      - htop
      - tar
      - tmux
      - rsync
      - authconfig
      - nss-pam-ldapd
      - pam_ldap
      - openldap-clients
      - oddjob
      - oddjob-mkhomedir
      - chrony
      - python3
    state: present
    update_cache: yes
  when: not is_offline | bool
