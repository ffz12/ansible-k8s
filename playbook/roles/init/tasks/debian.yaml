---
# playbook/roles/init/tasks/debian.yaml

# ==================== DNS(可选,默认关) ====================
# 默认 init_config_dns=false: 不碰 DNS,保持系统装机/DHCP/netplan 原有配置。
# 需要 ansible 统一接管时: 在 env.yaml 置 init_config_dns: true,并填 dns / domains。
# 用 resolved.conf.d drop-in(不整覆盖主文件),幂等,可重复跑。
- name: 配置 DNS(systemd-resolved)
  tags: [dns]
  when:
    - init_config_dns | bool
    - dns is defined
  block:
    - name: 确保 resolved.conf.d 目录存在
      file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: '0755'

    - name: 写入 DNS drop-in(不覆盖 resolved.conf 主文件)
      template:
        src: debian-resolved.conf.j2
        dest: /etc/systemd/resolved.conf.d/99-init-dns.conf
        backup: yes
      register: init_resolved_dropin

    - name: 让 /etc/resolv.conf 指向 systemd-resolved(幂等, 已是软链则不动)
      file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: yes
      register: init_resolv_link

    - name: 重启 systemd-resolved 使 DNS 生效
      systemd:
        name: systemd-resolved
        state: restarted
        enabled: yes
      when: init_resolved_dropin is changed or init_resolv_link is changed

# 关掉本项(init_config_dns=false)时, 把以前写进去的 drop-in 清掉 —— 否则机器上会留着
# 一份再没人维护的 DNS 配置: 改回 false 只是"不再接管", 文件却还在生效, 且 env.yaml
# 里的 dns 列表已经空转、看配置完全看不出机器上到底用的什么解析器。
#
# 这个残留很难自己发现: systemd-resolved 会把 drop-in 的 DNS 汇总进
# /run/systemd/resolve/resolv.conf, 而 /etc/resolv.conf 是指向它的软链 —— 手工编辑
# /etc/resolv.conf 删不掉(随时被重写), 必须删源头的 drop-in。超过 3 个 DNS 时
# systemd-resolved 还会自己插一行注释:
#   # Too many DNS servers configured, the following entries may be ignored.
# 看到这行就说明有多处在往里塞 DNS(drop-in + netplan/DHCP 叠加)。
#
# ⚠ 只删本角色自己写的那个文件名, 不动 resolved.conf 主文件、不动 /etc/resolv.conf
#   软链(Ubuntu 上那是标准形态), 也不碰 netplan 里的 nameservers —— 那是装机配的,
#   由 os-check 只读体检出报告后人工处置(本角色不碰网络配置)。
# 与 os-init/tasks/hostname.yaml 里"移除历史写入的集群 hosts 解析块"同一套思路。
- name: 移除历史写入的 DNS drop-in(init_config_dns=false 时)
  tags: [dns]
  when: not (init_config_dns | bool)
  block:
    - name: 检查是否存在历史 DNS drop-in
      stat:
        path: /etc/systemd/resolved.conf.d/99-init-dns.conf
      register: init_dns_dropin_stat

    - name: 删除历史 DNS drop-in
      file:
        path: /etc/systemd/resolved.conf.d/99-init-dns.conf
        state: absent
      when: init_dns_dropin_stat.stat.exists
      register: init_dns_dropin_removed

    - name: 重启 systemd-resolved 使删除生效
      systemd:
        name: systemd-resolved
        state: restarted
      when: init_dns_dropin_removed is changed

    - name: 提示已清理历史 DNS drop-in
      debug:
        msg: >-
          已删除 {{ inventory_hostname }} 上历史写入的 /etc/systemd/resolved.conf.d/99-init-dns.conf
          并重启 systemd-resolved。本机 DNS 回归装机/DHCP/netplan 的原有配置,
          核对实际生效: resolvectl status | grep -A5 'DNS Servers'
      when: init_dns_dropin_removed is changed

# ==================== 1. 软件源策略分流 ====================

- name: 【离线模式】配置本地双架构离线 APT 源
  tags: [repo]
  block:
    - name: 清理历史离线目录并重新创建
      file:
        path: /opt/ubuntu-offline-pkgs
        state: "{{ item }}"
        # ⚠ 必须显式给 0755 —— apt 用非特权用户 _apt 去读本地 file:// 源, 目录缺执行位
        #   它就进不去(root 忽略目录权限位, 所以只有 _apt 报错), 见下面 unarchive 那段说明。
        mode: '0755'
      loop: [absent, directory]

    # ⚠ 【不要】在这里加 mode: —— unarchive 的 mode 会一并作用到解出来的【目录】上。
    #   曾写成 mode: '0644', 于是目录也变 0644、没有执行位:
    #     N: Download is performed unsandboxed as root as file
    #        '/opt/ubuntu-offline-pkgs/./InRelease' couldn't be accessed by user '_apt'.
    #        - pkgAcquire::Run (13: Permission denied)
    #   而 ansible 的 apt 模块只会转述成一句没有信息量的
    #     "Failed to update apt cache: unknown reason"
    #   —— 真因得去目标机手工跑 apt-get update 才看得到。2026-09-15 现网踩过。
    #   不指定 mode 时 tar 保留归档里的原始权限(目录 0755 / 文件 0644), 正是想要的结果。
    - name: 动态拷贝对应版本和架构的 DEB 离线包到目标机
      unarchive:
        src: "{{ offline_artifacts }}/ios-offline/ubuntu{{ ansible_distribution_version.split('.')[0] }}_{{ 'arm64' if ansible_architecture == 'aarch64' else 'x86_64' }}.tar.gz"
        dest: /opt/ubuntu-offline-pkgs/
        owner: root
        group: root

    # 兜底: 归档里若本来就有权限异常的目录(打包机 umask 怪异等), 上面 unarchive 保留原样
    # 也照样进不去。这里统一把目录补成 0755、文件保持 0644, 与 apt 对本地源的要求对齐。
    # 幂等: 权限已正确时不产生 changed。
    - name: 校正离线源目录权限(apt 的 _apt 用户需要目录可进入)
      command: >-
        find /opt/ubuntu-offline-pkgs -type d -not -perm 755 -exec chmod 755 {} +
      register: _offline_perm_fix
      changed_when: false          # find -exec 无输出, 无法据此判断; 权限本身幂等

    - name: 【Ubuntu 22.04 离线】覆写传统 sources.list(留时间戳备份)
      copy:
        dest: /etc/apt/sources.list
        content: "deb [trusted=yes] file:///opt/ubuntu-offline-pkgs ./\n"
        backup: yes
      when: ansible_distribution_version == "22.04"

    # 24.04 的官方源在 sources.list.d/ubuntu.sources(deb822 格式)。
    # ⚠ 原先这里是 `echo "" > ubuntu.sources` 直接清空 —— 原内容不可恢复, 装完想回在线源
    #   只能靠仓库自带的标准源文件重建, 站点定制过的内网 mirror 就丢了。
    #   改为【改名保留】: mv 成 ubuntu.sources.disabled-<时间戳>, apt 不再读它(只认 *.sources),
    #   要恢复直接改回名字即可。幂等: 文件已被移走(不存在)时跳过, 不会用空文件覆盖已有备份。
    - name: 【Ubuntu 24.04 离线】检查官方源文件是否还在
      stat:
        path: /etc/apt/sources.list.d/ubuntu.sources
      register: _ubuntu_sources
      when: ansible_distribution_version == "24.04"

    - name: 【Ubuntu 24.04 离线】改名屏蔽官方源(保留原内容, 可改回)
      command: >-
        mv /etc/apt/sources.list.d/ubuntu.sources
           /etc/apt/sources.list.d/ubuntu.sources.disabled-{{ ansible_date_time.iso8601_basic_short }}
      when:
        - ansible_distribution_version == "24.04"
        - _ubuntu_sources.stat.exists | default(false)

    - name: 【Ubuntu 24.04 离线】写入离线源(留时间戳备份)
      copy:
        dest: /etc/apt/sources.list
        content: "deb [trusted=yes] file:///opt/ubuntu-offline-pkgs ./\n"
        backup: yes
      when: ansible_distribution_version == "24.04"
  when: is_offline | bool

- name: 【在线模式】配置官方/国内镜像软件源
  tags: [repo]
  block:
    - name: 【Ubuntu 22.04 在线】拷贝常规 sources.list
      copy:
        src: u-22.04-sources.list
        dest: /etc/apt/sources.list
        backup: yes
      when: ansible_distribution_version == "22.04" and ansible_architecture == "x86_64"

    - name: 【Ubuntu 24.04 在线】拷贝新版标准源
      copy:
        src: u-24.04-sources.list
        dest: /etc/apt/sources.list.d/ubuntu.sources
        backup: yes
      when: ansible_distribution_version == "24.04" and ansible_architecture == "x86_64"
  when: not is_offline | bool


# ==================== 2. 环境健壮性优化与防卡死 (通用) ====================

- name: 强行重写 70debconf 配置，彻底废除底层蓝底灰框交互弹窗
  tags: [apt]
  copy:
    dest: /etc/apt/apt.conf.d/70debconf
    content: |
      // Pre-configure packages before they are installed.
      // Modified by Ansible to prevent interactive dialogs.
      DPkg::Pre-Install-Pkgs { "/usr/sbin/dpkg-preconfigure --apt || true"; };
      Debconf::Frontend "Noninteractive";
    owner: root
    group: root
    mode: '0644'

- name: 在系统全局环境变量中注入双重静默保险
  tags: [apt]
  lineinfile:
    path: /etc/profile
    line: 'export DEBIAN_FRONTEND=noninteractive'
    state: present

- name: 移除 99needrestart 防止升级组件后卡在服务重启确认界面
  tags: [apt]
  file:
    path: /etc/apt/apt.conf.d/99needrestart
    state: absent

- name: 彻底关闭系统自带的无感后台自动更新（防止抢占锁死 apt）
  tags: [apt]
  copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { dest: '/etc/apt/apt.conf.d/20auto-upgrades', content: "APT::Periodic::Update-Package-Lists \"0\";\nAPT::Periodic::Download-Upgradeable-Packages \"0\";\nAPT::Periodic::AutocleanInterval \"0\";\nAPT::Periodic::Unattended-Upgrade \"0\";\n" }
    - { dest: '/etc/apt/apt.conf.d/10periodic', content: "APT::Periodic::Update-Package-Lists \"0\";\nAPT::Periodic::Download-Upgradeable-Packages \"0\";\n" }

- name: 停止并禁用无人值守更新服务
  tags: [apt]
  systemd:
    name: unattended-upgrades
    state: stopped
    enabled: no
  ignore_errors: yes

# 光停 unattended-upgrades 不够: apt-daily.timer / apt-daily-upgrade.timer 仍会
# 定时拉起 apt-daily(.service) 去 update/download, 抢 dpkg 锁、偶尔偷偷升级内核。
# mask 掉定时器和对应 service 才是真正关死后台自动更新。
- name: 停止并 mask apt 自动更新相关 systemd 单元
  tags: [apt]
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
    masked: yes
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - apt-daily.service
    - apt-daily-upgrade.service
  failed_when: false

- name: 禁用 cloud-init 网络配置管理 (防止其覆盖手动/静态网络设置)
  tags: [cloudinit]
  block:
    - name: 确保 cloud-init 配置目录存在
      file:
        path: /etc/cloud/cloud.cfg.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 写入 99-disable-network-config.cfg
      copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: |
          # 由 Ansible 写入: 禁用 cloud-init 网络配置管理,防止重启后覆盖静态网络
          network: {config: disabled}
        owner: root
        group: root
        mode: '0644'

    # 上面只关了 cloud-init 的【网络配置】那一块。彻底停用 cloud-init 本体
    # (写 .disabled 标记 + mask 四个 unit)只在机器确实装了 cloud-init 时做,
    # 没装就不必凭空 mask 一堆不存在的 unit。
    - name: 检查 cloud-init 是否安装
      stat:
        path: /usr/bin/cloud-init
      register: init_cloudinit_bin

    - name: 彻底停用 cloud-init 本体(装了才做)
      when: init_cloudinit_bin.stat.exists
      block:
        - name: 写入 cloud-init 禁用标记文件
          copy:
            dest: /etc/cloud/cloud-init.disabled
            content: "由 Ansible init 写入: 彻底关闭 cloud-init\n"
            owner: root
            group: root
            mode: '0644'

        - name: 停止并 mask cloud-init 全部 systemd 单元
          systemd:
            name: "{{ item }}"
            state: stopped
            enabled: no
            masked: yes
          loop:
            - cloud-init.service
            - cloud-init-local.service
            - cloud-config.service
            - cloud-final.service
          failed_when: false

- name: 精准锁定当前正在使用的内核版本防止误升级
  tags: [kernel]
  shell: |
    # 提取当前内核的核心版本号（例如：6.8.0-117）
    CURRENT_VERSION=$(uname -r | cut -d'-' -f1,2)
    
    # 精准查找已安装、且属于当前版本号的底层核心组件进行 hold
    TARGET_PKGS=$(dpkg --get-selections | awk '$2 == "install" {print $1}' | grep -E "^linux-(headers|image|modules|modules-extra)-${CURRENT_VERSION}")
    
    if [ -n "$TARGET_PKGS" ]; then
      apt-mark hold $TARGET_PKGS
    else
      echo "未找到匹配当前内核版本的组件包"
    fi
  register: kernel_hold_result
  ignore_errors: yes

- name: 查看hold内核状态
  tags: [kernel]
  shell: apt-mark showhold
  register: hold_status
  changed_when: false

- name: debug 内核锁定状态
  tags: [kernel]
  debug:
    msg: "{{ hold_status.stdout_lines }}"

- name: 优化基础环境参数 (Pager, Vim, Locale, Firewall)
  tags: [baseenv]
  block:
    - name: 禁用防火墙 ufw
      tags: [firewall]
      service:
        name: ufw
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: 判断 ufw 是否安装并输出状态
      shell: |
        systemctl status ufw | awk -F: '/Active:/{print $2}'
      register: ufw_status
      changed_when: false

    - name: 输出 ufw 状态
      debug:
        var: ufw_status.stdout

    - name: 取消 systemctl status 查看时的分页显示
      lineinfile:
        path: /etc/profile
        line: 'export SYSTEMD_PAGER=""'
        state: present

    - name: 设置 vim 环境
      copy:
        src: .vimrc
        dest: /root
        backup: yes
      ignore_errors: yes

    - name: 设置时间格式
      lineinfile:
        path: /etc/default/locale
        line: 'LC_TIME=en_DK.UTF-8'
        state: present

    - name: 设置系统默认编辑器为 vim
      shell: |
        if update-alternatives --list editor | grep -q 'vim.basic'; then
          update-alternatives --set editor /usr/bin/vim.basic
        else
          grep -q "export EDITOR=" /etc/profile || echo 'export EDITOR="/usr/bin/vim"' >> /etc/profile
          grep -q "alias vi=" /etc/profile || echo 'alias vi="vim"' >> /etc/profile
        fi
      ignore_errors: yes


# ==================== 3. 故障修复与基础依赖包安装 ====================

- name: 【仅在线环境】执行 APT 残留修复与多余包清理
  tags: [packages]
  block:
    - name: 强制尝试修复损坏的依赖
      command: apt-get install -f -y
    - name: 尝试配置所有未完成的包
      command: dpkg --configure -a
      ignore_errors: yes
    - name: 清理多余包和缓存
      apt:
        autoremove: yes
        autoclean: yes
  when: not is_offline | bool

- name: 更新缓存并批量安装必要软件包 (动态合并线上/线下包清单)
  tags: [packages]
  apt:
    name: "{{ debian_online_pkgs if not is_offline | bool else debian_offline_pkgs }}"
    state: present
    update_cache: yes
    allow_unauthenticated: "{{ 'yes' if is_offline | bool else 'no' }}"
  vars:
    # 纯在线环境安装的包清单
    debian_online_pkgs:
      - socat
      - ipset
      - conntrack
      - ipvsadm
      - ebtables
      - libseccomp2
      - netcat-openbsd
      - ca-certificates
      - nfs-common
      - nfs-kernel-server
      - bash-completion
      - apt-transport-https
      - software-properties-common
      - bzip2
      - unzip
      - chrony
      - rsync          # kube-add-master 的证书分发用 synchronize(底层 rsync), 缺了加 master 会失败
      - vim
      - libssl3
      - zlib1g
      - "{{ 'libpcre2-8-0' if ansible_distribution_version.split('.')[0] | int >= 24 else 'libpcre3' }}"
    # 纯离线环境安装的包清单（补充了 nfs 相关组件及底层安全库）
    debian_offline_pkgs:
      - socat
      - conntrack
      - ipset
      - ipvsadm
      - ebtables
      - libseccomp2
      - netcat-openbsd
      - nfs-common
      - nfs-kernel-server
      - ca-certificates
      - bzip2
      - unzip
      - chrony
      - rsync          # kube-add-master 的证书分发用 synchronize(底层 rsync), 缺了加 master 会失败
      - vim
      - libssl3
      - zlib1g
      - "{{ 'libpcre2-8-0' if ansible_distribution_version.split('.')[0] | int >= 24 else 'libpcre3' }}"

