is_offline: false

# 是否由 ansible 接管 DNS(写 systemd-resolved)。默认 false: 保持系统原有
# DNS(装机/DHCP/netplan 给的)不动。需要统一接管时在 env.yaml 置 true,
# 并填 dns(列表)/ domains(字符串)。见 tasks/debian.yaml 的「配置 DNS」段。
#
# 这是个【双向开关】: true 写 drop-in, false 则把以前写过的 drop-in
# (/etc/systemd/resolved.conf.d/99-init-dns.conf)删掉并重启 systemd-resolved。
# 早先 false 只表示"不接管"、不清理 —— 用 true 写过再改回 false 的机器上会留一份
# 再没人维护的 DNS 配置, 而 env.yaml 里的 dns 列表此时已空转, 看配置完全看不出
# 机器实际在用什么解析器。且 /etc/resolv.conf 是指向 systemd-resolved 的软链,
# 手工编辑它删不掉(随时被重写), 必须删源头 drop-in。
init_config_dns: false

# 是否把 /etc/systemd/system.conf 的 DefaultTasksMax 放开(默认 true = 放开成 infinity)。
#
# 为什么默认打开: 本仓库 containerd 是 SystemdCgroup = true, Pod 的 cgroup 由 systemd 管。
# kubeadm-config 的 podPidsLimit 填 -1 时 kubelet 不写 pod cgroup 的 pids.max, 于是继承
# kubepods.slice -> 落到本项。Ubuntu 默认是注释掉的 #DefaultTasksMax=15%(kernel.pid_max
# 的 15%), 2026-09-14 现网在容器内实测 pids.max=3000 就是被它卡住的。此前靠手工 sed +
# daemon-reexec 兜, 且那条 sed 匹配不到注释行、其实一直空转。详见 tasks/common.yaml 里
# 「systemd 全局 TasksMax」那段。
#
# ⚠ infinity 等于放弃这层保护(fork 炸弹可打满整机 pid, kernel.pid_max=1000001)。
#   不想放开的站点置 false; 想给个确定上限的把 init_default_tasks_max 设成具体数字,
#   或者干脆别用 podPidsLimit=-1 —— 用 kubelet_pod_pids_limit(默认 50000)由 kubelet
#   直接写进 pod cgroup, 与本项无关, 更可控。
init_set_default_tasks_max: true
# 放开成什么值。infinity = 不限; 也可填具体数字(如 500000)或百分比(如 "80%")。
init_default_tasks_max: infinity

