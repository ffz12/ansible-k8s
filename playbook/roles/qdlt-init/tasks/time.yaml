---
# ============================================================================
#  time.yaml —— 时间配置
#  交付标准: 全集群系统时间统一对齐, 最大时间差 <15 秒, 统一使用 UTC 时区
#  ⚠ 本文件会覆盖 init 角色 common.yaml 里的 Asia/Shanghai 设置
# ============================================================================

- name: 查询当前时区
  command: timedatectl show -p Timezone --value
  register: qdlt_tz_now
  changed_when: false

- name: 设置时区为 {{ qdlt_timezone }}
  command: "timedatectl set-timezone {{ qdlt_timezone }}"
  when: qdlt_tz_now.stdout | trim != qdlt_timezone

- name: 关闭 systemd-timesyncd(与 chrony 抢占 NTP 端口)
  systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: no
    masked: yes
  failed_when: false

- name: 写入 chrony 配置
  template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: restart chrony

- name: 启用并启动 chrony
  systemd:
    name: chrony
    state: started
    enabled: yes
    daemon_reload: yes

- name: 立即触发一次强制对时(makestep)
  command: chronyc makestep
  register: qdlt_makestep
  changed_when: false
  failed_when: false

- name: 等待 chrony 完成源选择并同步(最多 {{ qdlt_sync_wait }} 秒)
  shell: |
    set -o pipefail
    timedatectl show -p NTPSynchronized --value 2>/dev/null
  args:
    executable: /bin/bash
  register: qdlt_sync_state
  until: qdlt_sync_state.stdout | trim == 'yes'
  retries: "{{ (qdlt_sync_wait | int / 5) | round(0, 'ceil') | int }}"
  delay: 5
  changed_when: false
  failed_when: false

- name: 采集时间同步详情
  shell: |
    set -o pipefail
    echo "NTPSync: $(timedatectl show -p NTPSynchronized --value 2>/dev/null)"
    echo "本机时间(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
    chronyc tracking 2>/dev/null | grep -E 'Reference ID|System time|Last offset|Stratum' || true
    echo "--- 源状态 ---"
    chronyc sources 2>/dev/null || echo "chronyc sources 执行失败"
  args:
    executable: /bin/bash
  register: qdlt_time_detail
  changed_when: false
  failed_when: false

- name: 时间同步状态
  debug:
    msg: "{{ qdlt_time_detail.stdout_lines }}"

- name: 时间未同步则明确告警(交付标准要求集群时间差 <{{ qdlt_time_max_offset }} 秒)
  fail:
    msg: |
      ❌ chrony 服务在跑, 但 {{ qdlt_sync_wait }} 秒内一次都没同步上 (NTPSynchronized=no)。
      当前系统时间不可信, 不符合交付标准「集群时间统一对齐, 最大差 {{ qdlt_time_max_offset }} 秒」。

      排查:
        chronyc sources -v     # 全是 ^? 说明一个源都没通
        chronyc tracking       # Reference ID = 00000000 说明未锁定任何源
      常见原因:
        1) 当前 NTP 源 {{ qdlt_ntp_servers | join(', ') }} 在本机房不可达
           → 改用机房内网 NTP: 在 group_vars/all/env.yaml 设 qdlt_ntp_servers
        2) 防火墙未放行 udp 123
      跳过本检查(不建议): -e qdlt_fail_on_unsynced=false
  when:
    - qdlt_fail_on_unsynced | bool
    - (qdlt_sync_state.stdout | default('') | trim) != 'yes'

# 上面那个 fail 被关掉(qdlt_fail_on_unsynced=false)时, 别让它变成【静默跳过】——
# 否则 GRUB/账号/CPU 全配完了, 回头没人记得这台机器的时间源是瓢的。
# 这里响亮打一条, 并且明确它是【遗留项】, 交付时要处置。
# 注: qdlt-check 侧对本项仍然判 FAIL(ntp_sync != yes), 报告里会带出来, 不会漏。
- name: ⚠ 时间未同步(已按 qdlt_fail_on_unsynced=false 放行, 但记为遗留项)
  debug:
    msg: |
      ⚠⚠⚠ 时间同步【未通过】, 但已配置为不中断, 后续步骤继续执行。⚠⚠⚠

      现象: chrony 在跑, 但 {{ qdlt_sync_wait }} 秒内一次都没锁定任何源 (NTPSynchronized=no)。
      当前 NTP 源: {{ qdlt_ntp_servers | join(', ') }}

      这【不等于】节点之间时间不一致 —— 交付标准要的是「集群最大时间差
      <{{ qdlt_time_max_offset }} 秒」, 各节点原有时间可能本来就是齐的。
      核对一下再决定要不要着急:
        ansible qdlt -m shell -a 'date -u +%FT%T'

      但它确实【不符合交付标准】里对时的要求, 必须作为遗留项处置:
        1) 机房有内网 NTP → group_vars/all/env.yaml 设 qdlt_ntp_servers 后重跑 --tags time
           (本项目可用 maascpu-011 / MAAS 节点一般自带 chrony 并对下服务, 先确认)
        2) 走公网 → 放行 udp 123 到 {{ qdlt_ntp_servers | join(', ') }}
        3) 确认无源可用 → 在交付材料里作为偏离项列出, 并说明各节点时间差实测值
  when:
    - not (qdlt_fail_on_unsynced | bool)
    - (qdlt_sync_state.stdout | default('') | trim) != 'yes'
