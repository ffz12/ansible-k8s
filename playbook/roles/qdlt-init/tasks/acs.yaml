---
# ============================================================================
#  acs.yaml —— 关闭所有 PCIe 设备的 ACSCtl
#
#  交付标准要求「确认所有 PCIe 设备的 ACSCtl 均已关闭」。
#  ACS 开启会把 GPU 之间的 P2P DMA 流量强制绕经 Root Complex,
#  NCCL / GPUDirect 带宽显著下降。
#
#  ⚠ 首选在 BIOS 里关(有些机型有 ACS Enable 开关), BIOS 关掉最干净。
#    BIOS 里没有该选项时才用本任务在系统侧兜底 —— 与交付标准对 CPU 供电模式的
#    「若无法从 bios 配置, 则通过在系统内配置服务来实现」同一思路。
#  ⚠ setpci 直接写 PCI 配置空间, 且重启后被固件重置, 所以配套装了
#    qdlt-acs-disable.service 每次开机重跑。
#  ⚠ 关 ACS 会降低 PCIe 设备间隔离性, 与 VFIO 直通/IOMMU 分组隔离冲突。
#    交付标准同时要求关闭 vt-d/IOMMU, 两者方向一致(都为 P2P 性能), 故不矛盾。
#    但这批机器若要跑虚拟化直通, 就别开: -e qdlt_do_acs=false
#  ⚠ 默认 qdlt_do_acs=true —— 交付标准明确要求"所有 PCIe 设备 ACSCtl 均已关闭",
#    不做这一步 qdlt-check 的 PCIe 项会判 FAIL。它是本角色唯一直接写 PCI 配置空间
#    的步骤, 单独跳过用 --skip-tags acs。
#    注: CPU 管理节点上没有 GPU, 关 ACS 的实际性能收益接近于零, 纯为合规。
# ============================================================================

- name: 确保 pciutils 已安装(setpci / lspci)
  apt:
    name: pciutils
    state: present
  register: qdlt_acs_pciutils
  until: qdlt_acs_pciutils is succeeded
  retries: 2

- name: 下发 ACS 关闭脚本
  copy:
    src: qdlt-acs-disable.sh
    dest: "{{ qdlt_acs_script_path }}"
    owner: root
    group: root
    mode: '0755'

- name: 采集当前 ACSCtl 状态
  command: "{{ qdlt_acs_script_path }} status"
  register: qdlt_acs_before
  changed_when: false
  failed_when: false

- name: 当前 ACSCtl 状态
  debug:
    msg: "关闭前: {{ qdlt_acs_before.stdout | default('未取到') }}"

- name: 列出将被修改的设备(dryrun, 不写入)
  command: "{{ qdlt_acs_script_path }} dryrun"
  register: qdlt_acs_dryrun
  changed_when: false

- name: 将被修改的设备
  debug:
    msg: "{{ qdlt_acs_dryrun.stdout_lines | default([]) }}"

- name: 关闭所有 PCIe 设备的 ACSCtl
  command: "{{ qdlt_acs_script_path }} apply"
  register: qdlt_acs_apply
  # 脚本返回 3 = 有设备被固件锁定写不进去, 不视为任务失败(会在下面报告出来)
  failed_when: qdlt_acs_apply.rc not in [0, 3]
  changed_when: "'已关闭 0 个设备' not in (qdlt_acs_apply.stdout | default(''))"

- name: 关闭结果
  debug:
    msg: "{{ qdlt_acs_apply.stdout_lines | default([]) }}"

- name: 安装开机自动关闭 ACS 的服务(重启后固件会重新置位)
  template:
    src: qdlt-acs-disable.service.j2
    dest: /etc/systemd/system/qdlt-acs-disable.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd

- name: 启用 qdlt-acs-disable.service
  systemd:
    name: qdlt-acs-disable.service
    enabled: yes
    daemon_reload: yes
    state: started

- name: 回验 ACSCtl 已全部关闭
  command: "{{ qdlt_acs_script_path }} status"
  register: qdlt_acs_after
  changed_when: false
  failed_when: false

- name: ACSCtl 最终状态
  debug:
    msg: >-
      {{ qdlt_acs_after.stdout | default('未取到') }}
      {{ '✅ 全部关闭' if qdlt_acs_after.rc == 0
         else '⚠ 仍有设备 ACSCtl 未关闭 —— 通常是固件锁定了该寄存器, 需要在 BIOS 里关 ACS。'
              ~ '备份在 /var/lib/qdlt/acs-backup.txt, 可用 ' ~ qdlt_acs_script_path ~ ' restore 回滚。' }}

- name: 校验 ACSCtl 全部关闭(可选严格模式)
  assert:
    that: qdlt_acs_after.rc == 0
    fail_msg: >-
      仍有 PCIe 设备的 ACSCtl 未关闭: {{ qdlt_acs_after.stdout }}。
      这类寄存器多被固件锁定, 只能在 BIOS 里关闭 ACS。
      不想让此项中断流程: -e qdlt_acs_strict=false
  when: qdlt_acs_strict | bool
