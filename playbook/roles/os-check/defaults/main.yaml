---
# ============================================================================
#  os-check —— 通用主机「只读体检」(默认判据按青岛联通交付标准, env.yaml 可覆盖)
#
#  本角色【绝不修改任何配置】, 只采集与判定, 产出:
#    - 每台节点的逐项 PASS/FAIL/WARN 明细
#    - 控制机本地汇总报告 {{ oscheck_report_dir }}/os-check-<日期>.{md,csv}
#
#  覆盖交付标准中「不能自动改」的项:
#    OS/内核版本、系统盘 RAID1+ext4、数据盘裸盘、bond mode4 hash 3+4、
#    RDMA hca_id 命名、ACSCtl、GPU 驱动/VBIOS、OFED 版本、PCIe 链路、
#    带内带外 IP 末段一致、共享存储挂载、设备一致性
# ============================================================================

# 控制机上报告的落地目录
oscheck_report_dir: "{{ playbook_dir }}/../reports"

# ---------------- 交付标准的期望值(按项目实际调整) ----------------
oscheck_expect_os_pattern: '^22\.04\.[3-5]$'          # Ubuntu 22.04.3 ~ 22.04.5
oscheck_expect_kernel_pattern: '^5\.15\.0-(1[89][0-9]|[2-9][0-9]{2})'  # 5.15.0-181 ~ 999
oscheck_expect_timezone: UTC
oscheck_expect_user: wwxq
oscheck_expect_gpu_driver: "590.48.01"
oscheck_expect_vbios_min: "97.10.64.00.0C"            # B300 VBIOS 版本下限
oscheck_expect_bond_mode: "802.3ad"
oscheck_expect_bond_hash: "layer3+4"
oscheck_expect_time_skew: 15                          # 秒
# OFED: 含 CX8/BF3 用 DOCA_OFED 3.2.2 LTS; 纯 CX7 及以下用 5.8-7.0.6.1 或 24.10-4.1.4.0
oscheck_expect_ofed_any:
  - "3.2.2"
  - "5.8-7.0.6.1"
  - "24.10-4.1.4.0"
# 共享存储挂载点(交付标准: 高性能 /gpfs, 大容量 /hgpfs, 其他 /gpfs02 起)
oscheck_expect_mounts: []
# 例: [ /gpfs, /hgpfs ]

# 节点角色 gpu / cpu。inventory 里显式写了 node_role 就用那个(group_vars 优先),
# 没写则按是否在 [gpu] 组内自动判定。与 os-init/defaults 保持同一套逻辑。
node_role: "{{ 'gpu' if inventory_hostname in (groups['gpu'] | default([])) else 'cpu' }}"

# GPU 相关项是否检查(CPU 管理节点自动跳过)
oscheck_check_gpu: "{{ node_role | default('cpu') == 'gpu' }}"

# ⚠ 本角色独立于 os-init 运行(os-check.yaml 只加载 os-check),
#   所以 os-init 里的 mgmt_ip 拿不到, 必须在这里也定义一份,
#   否则「带内/带外 IP 末段一致」永远显示 带内=? 并恒判 WARN。
mgmt_ip: "{{ ansible_host | default(ansible_default_ipv4.address | default('')) }}"

# ---------------- 适用性判定(不适用的项判 SKIP 而不是 FAIL/WARN) ----------------
# 交付标准的 PCIe/RDMA/裸盘/bond 等要求是按 GPU 算力节点的硬件形态写的。
# 管理节点(以及任何硬件上做不到该项的机器)套用这些期望值只会产生噪音, 故自动 SKIP。
#
# PCIe Gen5: CPU 平台不支持 PCIe 5.0 时(如 Ice Lake / Xeon 8380 只有 4.0),
#            「Gen5 x16 链路数」永远为 0, 判 FAIL 无意义。
oscheck_check_pcie_gen5: "{{ node_role | default('cpu') == 'gpu' }}"
# 数据盘裸盘: 只对待交付的裸机有意义; 管理节点的盘正在用(装了 OS/挂了 NFS/存了数据)。
oscheck_check_bare_disk: "{{ node_role | default('cpu') == 'gpu' }}"
# bond: 交付标准要求带内走 bond mode4; 未做 bond 的管理节点先判 WARN 不判 FAIL。
oscheck_check_bond: true
# OFED/DOCA 版本期望值是按计算网卡(CX7/CX8)写的。
# 机器上 RDMA 设备数少于此值时视为「非计算节点」, OFED 与 hca_id 命名两项判 SKIP。
oscheck_rdma_compute_min_devs: 8
