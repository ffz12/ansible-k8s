# 收敛到共享任务(2026-09-09), 原因见 ensure-harbor-hosts.yml 头部注释:
# 三处各写一遍 + marker 与 trust-harbor-ca 不同 -> 机器上留两份块 -> 改 IP 时旧块不更新。
#
# ⚠ 故意放在下面那个 block 【外面】: 那个 block 带 ignore_errors: true, 会连带把
#   include 进去的任务一起吞掉 —— 共享任务里的 assert(校验 harbor_instances 有没有
#   漏写 ip)就白设了。放在 block 前面既避开继承, 又保证解析先于 docker login 写好。
- name: 添加harbor域名解析
  include_tasks: "{{ playbook_dir }}/tasks/ensure-harbor-hosts.yml"

- name: 修改daemon.json
  block:
  - name: 拷贝daemon.json
    template: src=daemon.json.j2 dest=/etc/docker/daemon.json
  - name: 启动docker
    shell: |
      systemctl enable docker --now
      systemctl reload docker
  ignore_errors: true

# 登录 harbor: 账号密码读 env.yaml 的 harbor_admin_username / harbor_admin_password
# (原来写死 -uadmin -pHarbor12345, 改了 harbor 密码就登不上, 且密码出现在进程列表里)。
# 密码走 stdin 不进命令行; no_log 防止 -v 时打印出来。失败不中断(与原 ignore_errors 一致), 下面单独报。
- name: 登录harbor
  command: docker login {{ item.dns }} -u {{ harbor_admin_username | default('admin') }} --password-stdin
  args:
    stdin: "{{ harbor_admin_password | default('Harbor12345') }}"
  loop: "{{ harbor_instances }}"
  register: _harbor_login
  changed_when: false
  failed_when: false
  no_log: true

- name: ⚠ harbor 登录失败(检查 env.yaml 的 harbor_admin_password 是否与 harbor 实际密码一致)
  debug:
    msg: "{{ inventory_hostname }} 登录 {{ item.item.dns }} 失败, rc={{ item.rc }}"
  loop: "{{ _harbor_login.results }}"
  loop_control:
    label: "{{ item.item.dns }}"
  when: item.rc != 0

- name: 检查docker服务运行
  shell: "systemctl is-active docker.service"
  register: docker_status
  changed_when: false
  failed_when: false
- name: debug
  debug:
    msg: "{{ docker_status.stdout }}"

