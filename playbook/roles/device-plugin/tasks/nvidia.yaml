---
# nvidia device plugin: 向 kubelet 上报 nvidia.com/gpu
- name: "[nvidia] 推镜像到 Harbor(仅离线)"
  include_tasks: "{{ playbook_dir }}/tasks/sync-offline-image.yml"
  vars:
    _img_name: nvidia
    _img_src: "{{ device_plugin_src_dir }}"
    _img_tar: "{{ nvidia_device_plugin_tar }}"
    _img_dst: "{{ nvidia_device_plugin_image }}"
    _img_tmp: "{{ device_plugin_dir }}"
  when: is_offline | default(false) | bool

# 在线模式不跑 sync-image.yaml, _dp_archs 没被设置, 按 device_plugin_online_archs 兜底
- name: "[nvidia] 确定渲染哪些架构"
  set_fact:
    _dp_archs: "{{ _img_archs | default(device_plugin_online_archs) }}"

- name: "[nvidia] 渲染 manifest"
  template:
    src: nvidia-device-plugin.yml.j2
    dest: "{{ device_plugin_manifest_dir }}/nvidia-device-plugin.yml"
    mode: "0644"
  register: _nvidia_manifest

- name: "[nvidia] apply"
  command: kubectl apply -f {{ device_plugin_manifest_dir }}/nvidia-device-plugin.yml
  register: _nvidia_apply
  changed_when: "'configured' in _nvidia_apply.stdout or 'created' in _nvidia_apply.stdout"
  when: not ansible_check_mode

# 多架构时按架构各一个 DaemonSet(名字带 -<arch> 后缀), 逐个等
- name: "[nvidia] 等 DaemonSet ready"
  command: >-
    kubectl -n {{ device_plugin_namespace }} rollout status
    ds/nvidia-device-plugin-daemonset{{ '' if _dp_archs | length == 1 else '-' ~ item }}
    --timeout={{ device_plugin_wait_timeout }}s
  loop: "{{ _dp_archs }}"
  changed_when: false
  when: not ansible_check_mode

# 没有带 nvidia=true 标签的节点时 DaemonSet 期望副本数是 0, rollout 也会"成功" —— 这里把实际
# 情况打出来, 免得以为装好了却没有任何 Pod 在跑(标签由 k8s-node-labels.yaml 按 accelerator_type 打)。
- name: "[nvidia] 查看 Pod 与 GPU 资源上报情况"
  shell: |
    echo "--- DaemonSet ---"
    kubectl -n {{ device_plugin_namespace }} get ds -o wide 2>&1 | grep -E 'NAME|nvidia-device-plugin'
    echo "--- 带 {{ nvidia_device_plugin_node_label }}=true 的节点与其 nvidia.com/gpu 容量 ---"
    kubectl get nodes -l {{ nvidia_device_plugin_node_label }}=true \
      -o custom-columns='NODE:.metadata.name,GPU:.status.capacity.nvidia\.com/gpu' 2>&1
  args:
    executable: /bin/bash
  register: _nvidia_status
  changed_when: false
  when: not ansible_check_mode

- name: "[nvidia] 结果"
  debug:
    msg: "{{ _nvidia_status.stdout_lines }}"
  when: not ansible_check_mode
