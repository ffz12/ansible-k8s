---
# 把一个离线 tar 里的镜像推进 Harbor。调用方传:
#   _dp_tar   离线 tar 文件名(在 device_plugin_src_dir 下)
#   _dp_image 目标镜像全名({{ registry }}/xxx:tag)
#   _dp_name  日志里显示的插件名
# 单架构(amd64), 不建 multi-arch manifest —— GPU/RDMA 节点都是 x86。
# 在线模式跳过本文件: manifest 里直接用公网镜像地址。

- name: "[{{ _dp_name }}] 检查离线 tar 是否存在"
  stat:
    path: "{{ device_plugin_src_dir }}/{{ _dp_tar }}"
  delegate_to: localhost
  become: false
  register: _dp_tar_stat

- name: "[{{ _dp_name }}] tar 缺失则报错"
  fail:
    msg: >-
      找不到 {{ device_plugin_src_dir }}/{{ _dp_tar }}。
      先在联网机上跑 bash scripts/offline/download-device-plugin-offline.sh,
      或把 tar 手工放进该目录(该目录不进 git)。
  when: not _dp_tar_stat.stat.exists

- name: "[{{ _dp_name }}] 创建暂存目录"
  file:
    path: "{{ device_plugin_dir }}"
    state: directory
    mode: "0755"

- name: "[{{ _dp_name }}] 拷贝 tar 到目标机"
  copy:
    src: "{{ device_plugin_src_dir }}/{{ _dp_tar }}"
    dest: "{{ device_plugin_dir }}/{{ _dp_tar }}"
    mode: "0644"

- name: "[{{ _dp_name }}] 登录 Harbor"
  command: docker login {{ harbor_dns }} -u {{ harbor_admin_username | default('admin') }} --password-stdin
  args:
    stdin: "{{ harbor_admin_password | default('Harbor12345') }}"
  changed_when: false
  no_log: true

# 源镜像名不写死: tar 是 docker save 还是 containerd/nerdctl save、用的什么前缀都可能不同
# (现网那份 rdma tar 的镜像名就带着旧项目名 kubesphereio), 所以解析 docker load 的输出再 retag。
- name: "[{{ _dp_name }}] load 并推到 Harbor"
  shell: |
    set -e
    DST="{{ _dp_image }}"
    # 先删本机 manifest 缓存: 否则 inspect 读的是本地 ~/.docker/manifests, Harbor 清空后仍会误判"已在"
    docker manifest rm "${DST}" >/dev/null 2>&1 || true
    if docker manifest inspect --insecure "${DST}" >/dev/null 2>&1; then
      echo "skip ${DST} (已在 harbor)"; exit 0
    fi
    out="$(docker load -i {{ device_plugin_dir }}/{{ _dp_tar }})"
    echo "$out"
    SRC="$(echo "$out" | sed -n 's/^Loaded image: //p' | head -1)"
    [ -n "$SRC" ] || { echo "解析不出 load 进来的镜像名:"; echo "$out"; exit 1; }
    docker tag "$SRC" "${DST}"
    for _i in 1 2 3; do docker push "${DST}" && break; [ "$_i" = 3 ] && exit 1; echo "push 失败, 10 秒后重试($_i/3)"; sleep 10; done
    [ "$SRC" = "${DST}" ] || docker rmi "$SRC" || true
  args:
    executable: /bin/bash
  register: _dp_push
  changed_when: "'skip ' not in _dp_push.stdout"
