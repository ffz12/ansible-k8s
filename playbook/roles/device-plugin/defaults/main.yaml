---
# ---- 装哪些插件 ----
# 不设时由 tasks/main.yaml 按 accelerator_type 自动推导 + device_plugin_rdma 开关。
# 手动指定: -e device_plugins=nvidia,rdma
#device_plugins: nvidia,rdma

# rdma 不在 accelerator_type 里(网卡能力), 所以单独一个开关。默认 true —— 本项目的 GPU 机都带
# Mellanox 网卡。没有 RDMA 网卡的站点在 env.yaml 置 false, 否则 DaemonSet 起来但资源上报为 0。
device_plugin_rdma: true

# ---- 公共 ----
device_plugin_namespace: kube-system
# 离线 tar 存放目录, 按架构分子目录: <这里>/amd64/xxx.tar.gz、<这里>/arm64/xxx.tar.gz
# (不进 git; 由 scripts/offline/download-device-plugin-offline.sh 生成或手工放)
device_plugin_src_dir: "{{ offline_artifacts }}/device-plugin/images"
# 在线模式下没有离线物料可探测, 按这个列表渲染 manifest(多架构集群填 [amd64, arm64])
device_plugin_online_archs: [amd64]
device_plugin_dir: /opt/device-plugin           # 目标机上的暂存目录
device_plugin_manifest_dir: /etc/kubernetes      # 渲染出的 manifest 落盘位置
device_plugin_wait_timeout: 180                  # 等 DaemonSet ready 的秒数

# ---- nvidia ----
nvidia_device_plugin_version: "v0.17.1"
nvidia_device_plugin_tar: k8s-device-plugin.tar.gz
nvidia_device_plugin_image: "{{ registry }}/k8s-device-plugin:{{ nvidia_device_plugin_version }}"
nvidia_device_plugin_node_label: nvidia          # k8s-node-labels.yaml 按 accelerator_type 打的标签
# libnvidia-ml.so.1 的宿主机路径各架构不同, 所以 nvidia 按架构各渲一个 DaemonSet
# (一个 DaemonSet 的 hostPath 没法按节点变)。单架构集群只渲一个, 名字不带后缀。
nvidia_libnvidia_ml_paths:
  amd64: {triplet: x86_64-linux-gnu,  host: /lib/x86_64-linux-gnu/libnvidia-ml.so.1}
  arm64: {triplet: aarch64-linux-gnu, host: /lib/aarch64-linux-gnu/libnvidia-ml.so.1}

# ---- rdma ----
rdma_device_plugin_version: "v1.5.3"
rdma_device_plugin_tar: k8s-rdma-shared-dev-plugin.tar.gz
rdma_device_plugin_image: "{{ registry }}/k8s-rdma-shared-dev-plugin:{{ rdma_device_plugin_version }}"
# 由 k8s-node-labels.yaml 按 inventory 的 has_rdma=true 打(RDMA 是网卡能力, 与 accelerator_type 无关)
rdma_device_plugin_node_label: rdma
rdma_resource_name: hca_shared_devices
rdma_hca_max: 1000
rdma_periodic_update_interval: 300
rdma_vendors: ["15b3"]                           # 15b3 = Mellanox
rdma_device_ids: ["101b", "a2dc"]                # 各站点网卡型号不同, 用 lspci -nn 查
