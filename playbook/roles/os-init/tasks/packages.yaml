---
# ============================================================================
#  packages.yaml —— 交付标准要求的软件包(ipmitool 为明确必装项)
#
#  ⚠ 排查工具类的包(msr-tools / cpupower / sysstat)是【现网缺包缺出来的】——
#    2026-08 青岛判"睿频到底能不能跑上去"时, turbostat / rdmsr / cpupower 全都没装,
#    只能 dd 读 /dev/cpu/0/msr 绕过去。这类工具本来就该在初始化阶段装好,
#    不然每次排查都要先解决"没工具"。
# ============================================================================

- name: 安装交付标准要求的软件包
  apt:
    name: "{{ osinit_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  register: osinit_pkg_install
  retries: 2
  delay: 5
  until: osinit_pkg_install is succeeded

- name: 确认 ipmitool 可用
  command: ipmitool -V
  register: osinit_ipmitool_ver
  changed_when: false
  failed_when: osinit_ipmitool_ver.rc != 0

# ---------------- cpupower / turbostat(带内核版本号的包) ----------------
# ⚠ 为什么单独处理, 不直接写进 osinit_packages:
#   cpupower 和 turbostat 的可执行文件在 linux-tools-<确切内核版本> 里,
#   包名随内核变, 没法写成静态清单。
# ⚠ 为什么不用元包 linux-tools-generic:
#   它【跟着新内核走】, 而本角色在 apt-mark hold 内核包(交付标准要求内核固定)。
#   装元包等于给 apt 留一条把内核带升级的路, 与 grub.yaml 的固定意图冲突。
# ⚠ 内核版本【实时 uname -r】取, 不用 ansible_kernel ——
#   ansible.cfg 配了 fact_caching_timeout=86400, 重启换内核后 24h 内 fact 是旧值,
#   会去装【上一个内核】的 tools 包, 装上了也用不了(wrapper 按当前内核找)。
#   同 grub.yaml 的处置, 那次现网就是这么把 GRUB 钉回旧内核的。
- name: cpupower / turbostat 安装
  when: osinit_install_cpupower | bool
  block:
    - name: 实时读取当前运行内核版本(装 linux-tools 要用)
      command: uname -r
      register: osinit_pkg_uname
      changed_when: false
      check_mode: false

    - name: 安装 linux-tools-{{ osinit_pkg_uname.stdout | trim }}(提供 cpupower / turbostat)
      apt:
        name: "linux-tools-{{ osinit_pkg_uname.stdout | trim }}"
        state: present
      register: osinit_tools_install
      # 装不上不中止: 内核被 hold 时对应的 tools 包可能不在源里,
      # 而 msr-tools 已经够用(rdmsr 能读 APERF/MPERF), 这只是趁手工具。
      failed_when: false

    - name: 校验 cpupower 真的可用(wrapper 装了但可执行文件缺失时会报 not found)
      command: cpupower frequency-info
      register: osinit_cpupower_check
      changed_when: false
      failed_when: false

    - name: cpupower 可用性说明
      debug:
        msg: >-
          {{ '✅ cpupower 可用 —— 排查频率/HWP 问题时可直接用 cpupower frequency-info'
             if osinit_cpupower_check.rc == 0
             else '⚠ cpupower 装不上或不可用(linux-tools-' ~ (osinit_pkg_uname.stdout | trim)
                  ~ ' 可能不在 apt 源里)。不影响交付 —— 判睿频用 msr-tools 的 rdmsr 读'
                  ~ ' APERF/MPERF 即可, 见文档「睿频实测」一节。'
                  ~ ' ⚠ 不要改用 linux-tools-generic 兜底: 那个元包会跟着新内核走,'
                  ~ ' 与本角色 apt-mark hold 内核的意图冲突。' }}
