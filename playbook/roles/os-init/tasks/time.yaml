---
# ============================================================================
#  time.yaml —— 时间配置
#  交付标准: 全集群系统时间统一对齐, 最大时间差 <15 秒, 统一使用 UTC 时区
#  ⚠ 本文件会覆盖 init 角色 common.yaml 里的 Asia/Shanghai 设置
# ============================================================================

- name: 查询当前时区
  command: timedatectl show -p Timezone --value
  register: osinit_tz_now
  changed_when: false

- name: 设置时区为 {{ osinit_timezone }}
  command: "timedatectl set-timezone {{ osinit_timezone }}"
  when: osinit_tz_now.stdout | trim != osinit_timezone

- name: 关闭 systemd-timesyncd(与 chrony 抢占 NTP 端口)
  systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: no
    masked: yes
  failed_when: false

- name: 预检 —— [chronyserver] 组的机器必须配 chrony_allow_networks
  assert:
    that:
      - (chrony_allow_networks | default([]) | length) > 0
    fail_msg: |
      ❌ 本机 {{ inventory_hostname }} 在 inventory 的 [chronyserver] 组里(要当内网 NTP server),
         但 chrony_allow_networks 没配 —— chrony 默认【拒绝所有】NTP 请求, 这样装出来的
         server 谁都同步不上, 且 server 自己 chronyc tracking 一切正常, 很难发现。

      在 inventory/group_vars/all/env.yaml 填要放行的客户端网段:
        chrony_allow_networks:
          - 10.14.64.0/24
          - 10.101.16.0/24

      不想自建 NTP server 了: 把 inventory 的 [chronyserver] 组【整组留空】即可,
      本特性完全不生效, 全集群沿用原来指向 osinit_ntp_servers 的纯客户端行为。
    success_msg: "本机将作为内网 NTP server, 放行网段: {{ chrony_allow_networks | join(', ') }}"
  # ⚠ 判据与 chrony.conf.j2 里的 is_chrony_server 必须一致, 原因见那里的注释
  #   ([chronyserver] 写裸 IP 时只比 inventory_hostname 会匹配不上, assert 被静默跳过)
  when: >
    inventory_hostname in (groups['chronyserver'] | default([]))
    or (ansible_host | default('')) in (groups['chronyserver'] | default([]))

# ⚠ 不再维护 os-init 自己的 chrony.conf.j2 —— 两个角色曾各写一份、写同一个目标文件、
#   os-init 排在 init 之后跑, 出现过"改了一边被另一边覆盖、且不报错"的隐蔽故障
#   (旧模板与本次去重的说明见 init/templates/chrony.conf.j2 头部注释)。
#   现在统一指到 init 角色的模板, 用下面四个变量把渲染结果钉成与旧版本 os-init 输出
#   逐字节一致(driftfile 路径、maxupdateskew、客户端兜底源列表、关掉云厂商元数据 NTP
#   那一行), 其余行为不变 —— 已用 jinja2 直接渲染两条路径对比验证过。
- name: 写入 chrony 配置(复用 init 角色的模板, 不再各写一份)
  template:
    src: "{{ role_path }}/../init/templates/chrony.conf.j2"
    dest: "{{ osinit_chrony_conf }}"
    owner: root
    group: root
    mode: '0644'
    backup: yes
  vars:
    chrony_client_sources: "{{ osinit_ntp_servers }}"
    chrony_driftfile: /var/lib/chrony/chrony.drift
    chrony_maxupdateskew: "100.0"
    chrony_cloud_metadata_ntp: false   # os-init 场景不渲染云厂商元数据 NTP, 与旧版本一致
  notify: restart chrony

- name: 启用并启动 chrony({{ osinit_chrony_service }})
  systemd:
    name: "{{ osinit_chrony_service }}"
    state: started
    enabled: yes
    daemon_reload: yes

# ⚠ 这一步【必须】在 makestep 和等同步之前 —— handler 默认要等整个 play 跑完才执行,
#   而下面 makestep / until NTPSynchronized 立刻就要用新配置。不 flush 的话:
#     chrony 进程还挂着【旧配置】(比如旧的、连不上的公网池)
#     → makestep 无源可用 → until 必然超时 → osinit_fail_on_unsynced 让 play 中断
#     → handler 连最后跑的机会都没有 → 配置文件是新的、进程是旧的
#   现象是"配置明明写对了却死活不同步", 而且重跑也不会好(见下一个 task 的说明)。
- name: 应用 chrony 配置(立即重启, 不等 play 结束)
  meta: flush_handlers

# flush_handlers 只在上面 template 报 changed 时才有东西可刷。配置文件已经正确
# (上一轮写过)但进程仍跑着旧配置的机器, template 是 ok 不是 changed, notify 不触发,
# flush 也刷不到东西 —— 于是【重跑多少次都修不好】。这里按 chrony 的实际状态兜底:
# 没锁上任何源就强制重启一次, 与配置文件有没有变化无关。
- name: 探测 chrony 当前是否已锁定时间源
  shell: |
    set -o pipefail
    chronyc tracking 2>/dev/null | awk -F': *' '/Reference ID/{print $2}' | awk '{print $1}'
  args:
    executable: /bin/bash
  register: osinit_chrony_refid
  changed_when: false
  failed_when: false

- name: 未锁定任何源则强制重启 chrony(兜底幂等陷阱)
  systemd:
    name: "{{ osinit_chrony_service }}"
    state: restarted
  when: (osinit_chrony_refid.stdout | default('') | trim) in ['', '00000000']

- name: 立即触发一次强制对时(makestep)
  command: chronyc makestep
  register: osinit_makestep
  changed_when: false
  failed_when: false

- name: 等待 chrony 完成源选择并同步(最多 {{ osinit_sync_wait }} 秒)
  shell: |
    set -o pipefail
    timedatectl show -p NTPSynchronized --value 2>/dev/null
  args:
    executable: /bin/bash
  register: osinit_sync_state
  until: osinit_sync_state.stdout | trim == 'yes'
  retries: "{{ (osinit_sync_wait | int / 5) | round(0, 'ceil') | int }}"
  delay: 5
  changed_when: false
  failed_when: false

- name: 采集时间同步详情
  shell: |
    set -o pipefail
    echo "NTPSync: $(timedatectl show -p NTPSynchronized --value 2>/dev/null)"
    echo "本机时间(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
    chronyc tracking 2>/dev/null | grep -E 'Reference ID|System time|Last offset|Stratum' || true
    echo "--- 源状态 ---"
    chronyc sources 2>/dev/null || echo "chronyc sources 执行失败"
  args:
    executable: /bin/bash
  register: osinit_time_detail
  changed_when: false
  failed_when: false

- name: 时间同步状态
  debug:
    msg: "{{ osinit_time_detail.stdout_lines }}"

- name: 时间未同步则明确告警(交付标准要求集群时间差 <{{ osinit_time_max_offset }} 秒)
  fail:
    msg: |
      ❌ chrony 服务在跑, 但 {{ osinit_sync_wait }} 秒内一次都没同步上 (NTPSynchronized=no)。
      当前系统时间不可信, 不符合交付标准「集群时间统一对齐, 最大差 {{ osinit_time_max_offset }} 秒」。

      排查:
        chronyc sources -v     # 全是 ^? 说明一个源都没通
        chronyc tracking       # Reference ID = 00000000 说明未锁定任何源
      常见原因:
        1) 当前 NTP 源 {{ osinit_ntp_servers | join(', ') }} 在本机房不可达
           → 改用机房内网 NTP: 在 group_vars/all/env.yaml 设 osinit_ntp_servers
        2) 防火墙未放行 udp 123
      跳过本检查(不建议): -e osinit_fail_on_unsynced=false
  when:
    - osinit_fail_on_unsynced | bool
    - (osinit_sync_state.stdout | default('') | trim) != 'yes'

# 上面那个 fail 被关掉(osinit_fail_on_unsynced=false)时, 别让它变成【静默跳过】——
# 否则 GRUB/账号/CPU 全配完了, 回头没人记得这台机器的时间源是瓢的。
# 这里响亮打一条, 并且明确它是【遗留项】, 交付时要处置。
# 注: os-check 侧对本项仍然判 FAIL(ntp_sync != yes), 报告里会带出来, 不会漏。
- name: ⚠ 时间未同步(已按 osinit_fail_on_unsynced=false 放行, 但记为遗留项)
  debug:
    msg: |
      ⚠⚠⚠ 时间同步【未通过】, 但已配置为不中断, 后续步骤继续执行。⚠⚠⚠

      现象: chrony 在跑, 但 {{ osinit_sync_wait }} 秒内一次都没锁定任何源 (NTPSynchronized=no)。
      当前 NTP 源: {{ osinit_ntp_servers | join(', ') }}

      这【不等于】节点之间时间不一致 —— 交付标准要的是「集群最大时间差
      <{{ osinit_time_max_offset }} 秒」, 各节点原有时间可能本来就是齐的。
      核对一下再决定要不要着急:
        ansible cluster -m shell -a 'date -u +%FT%T'

      但它确实【不符合交付标准】里对时的要求, 必须作为遗留项处置:
        1) 机房有内网 NTP → group_vars/all/env.yaml 设 osinit_ntp_servers 后重跑 --tags time
           (本项目可用 maascpu-011 / MAAS 节点一般自带 chrony 并对下服务, 先确认)
        2) 走公网 → 放行 udp 123 到 {{ osinit_ntp_servers | join(', ') }}
        3) 确认无源可用 → 在交付材料里作为偏离项列出, 并说明各节点时间差实测值
  when:
    - not (osinit_fail_on_unsynced | bool)
    - (osinit_sync_state.stdout | default('') | trim) != 'yes'
