---
# ============================================================================
#  swap.yaml —— 永久关闭 swap
#
#  「永久」需要同时做到四件事, 少一件重启后 swap 都会回来:
#    1. swapoff -a                 —— 关掉当前已启用的
#    2. /etc/fstab 去掉 swap 条目  —— 否则 mount -a / 开机自动挂回来
#    3. mask systemd 的 swap unit  —— Ubuntu 22.04 上 swapfile 常由
#                                     swap.target / *.swap unit 拉起,
#                                     光删 fstab 不够(systemd-gpt-auto-generator
#                                     还会从 GPT 分区类型自动生成 .swap unit)
#    4. vm.swappiness 落盘到 sysctl.d —— sysctl -w 只在当前内核生效, 重启丢失
#
#  ⚠ 删 fstab 条目的正则必须锚定到「第 3 列 fstype == swap」。
#    用裸的 regexp: 'swap' 会连 /data/swaparea、/var/log/swapstats 这类
#    路径里带 swap 字样的正常挂载行一起删掉 —— 那是把数据盘挂载点删了。
#  ⚠ 本任务不删除 swap 文件/分区本身(不可逆), 只是不再启用它。
#    想连文件一起删, 置 osinit_swap_remove_file=true。
# ============================================================================

- name: 采集当前 swap 状态
  command: swapon --show=NAME,TYPE,SIZE --noheadings
  register: osinit_swap_before
  changed_when: false
  failed_when: false

- name: 当前 swap
  debug:
    msg: >-
      {{ ('当前无启用的 swap' if (osinit_swap_before.stdout | trim | length == 0)
          else '当前启用的 swap: ' ~ (osinit_swap_before.stdout_lines | join(' / '))) }}

# ---------------- 1. 关掉当前 swap ----------------
- name: 关闭当前所有 swap
  command: swapoff -a
  when: osinit_swap_before.stdout | trim | length > 0
  changed_when: true

# ---------------- 2. fstab ----------------
- name: 备份 fstab(只备份一次, 重跑不覆盖)
  copy:
    src: /etc/fstab
    dest: /etc/fstab.os-init.bak
    remote_src: yes
    force: no
    mode: '0644'

- name: 找出 fstab 里真正的 swap 条目
  # 第 3 列 fstype 为 swap 才算; 跳过注释行。
  # 不用 lineinfile 的裸 'swap' 正则, 见文件头警告。
  command: >-
    awk '$1 !~ /^#/ && $1 != "" && $3 == "swap" { print NR": "$0 }' /etc/fstab
  register: osinit_fstab_swap
  changed_when: false

- name: fstab 中的 swap 条目
  debug:
    msg: >-
      {{ ('fstab 中无 swap 条目' if (osinit_fstab_swap.stdout | trim | length == 0)
          else 'fstab 中将被注释掉的 swap 条目: ' ~ (osinit_fstab_swap.stdout_lines | join(' | '))) }}

- name: 注释掉 fstab 中的 swap 条目(保留原行便于回滚)
  replace:
    path: /etc/fstab
    # 锚定第 3 列 = swap, 且行首不是 #(避免重复注释成 ##)
    regexp: '^(?!\s*#)(\s*\S+\s+\S+\s+swap\s+.*)$'
    replace: '# [os-init] swap disabled: \1'
    backup: yes
  when: osinit_fstab_swap.stdout | trim | length > 0

# ---------------- 3. systemd swap unit ----------------
- name: 列出 systemd 的 .swap unit
  # Ubuntu 22.04 的 swapfile 常由 *.swap unit 拉起; systemd-gpt-auto-generator
  # 还会按 GPT 分区类型自动生成, 这类 unit 不在 fstab 里, 必须 mask。
  shell: >-
    set -o pipefail;
    systemctl list-unit-files --type=swap --no-legend 2>/dev/null
    | awk '{print $1}' | grep -v '^$' || true
  args:
    executable: /bin/bash
  register: osinit_swap_units
  changed_when: false

- name: mask swap.target 与全部 .swap unit
  systemd:
    name: "{{ item }}"
    masked: yes
    enabled: no
  loop: "{{ ['swap.target'] + (osinit_swap_units.stdout_lines | default([])) }}"
  failed_when: false      # 个别自动生成的 unit 不可 mask, 不应中断整个流程
  register: osinit_swap_mask

- name: 已处理的 swap unit
  debug:
    msg: >-
      已 mask: {{ (['swap.target'] + (osinit_swap_units.stdout_lines | default([]))) | join(', ') }}

# ---------------- 4. vm.swappiness 落盘 ----------------
- name: 持久化 vm.swappiness(sysctl -w 重启就丢, 必须落盘)
  copy:
    dest: /etc/sysctl.d/99-os-swap.conf
    mode: '0644'
    content: |
      # Ansible os-init —— 关闭 swap
      # swappiness=0 只是尽量不用 swap; 真正的关闭靠 swapoff + fstab + mask unit。
      vm.swappiness = {{ osinit_swappiness }}
  register: osinit_swappiness_conf

- name: 应用 sysctl
  command: sysctl -p /etc/sysctl.d/99-os-swap.conf
  when: osinit_swappiness_conf is changed
  changed_when: true

# ---------------- 可选: 删除 swap 文件本身 ----------------
- name: 【可选】删除 swap 文件本身(不可逆, 默认关闭)
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ osinit_swap_files }}"
  when: osinit_swap_remove_file | bool

# ---------------- 回验 ----------------
- name: 回验 swap 已关闭
  command: swapon --show=NAME --noheadings
  register: osinit_swap_after
  changed_when: false
  failed_when: false

- name: 校验当前确实没有启用的 swap
  assert:
    that: osinit_swap_after.stdout | trim | length == 0
    fail_msg: >-
      swapoff 后仍检测到启用的 swap: {{ osinit_swap_after.stdout }}。
      可能是某个 systemd unit 又把它拉起来了, 手工查:
      systemctl list-units --type=swap; systemctl status swap.target
    success_msg: >-
      swap 已关闭(当前无启用项), 且 fstab 条目已注释 + swap unit 已 mask,
      重启后不会自动挂回。
