---
# ============================================================================
#  cloudinit.yaml —— 交付标准: 确保关闭 cloud-init 功能
#  init 角色只写了 network:{config:disabled}(仅关网络配置), 这里彻底停用本体。
# ============================================================================

- name: 检查 cloud-init 是否安装
  stat:
    path: /usr/bin/cloud-init
  register: osinit_cloudinit_bin

- name: 彻底禁用 cloud-init
  block:
    - name: 写入 cloud-init 禁用标记文件
      copy:
        dest: /etc/cloud/cloud-init.disabled
        content: "由 Ansible os-init 写入: 按青岛联通交付标准关闭 cloud-init\n"
        owner: root
        group: root
        mode: '0644'

    - name: 保留网络配置禁用(防止重启覆盖静态网络)
      copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: "network: {config: disabled}\n"
        owner: root
        group: root
        mode: '0644'

    - name: 停止并禁用 cloud-init 全部 systemd 单元
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
        masked: yes
      loop:
        - cloud-init.service
        - cloud-init-local.service
        - cloud-config.service
        - cloud-final.service
      failed_when: false

    - name: 确认 cloud-init 已停用
      shell: |
        set -o pipefail
        systemctl is-enabled cloud-init.service 2>/dev/null || echo disabled
      args:
        executable: /bin/bash
      register: osinit_cloudinit_state
      changed_when: false

    - name: 输出 cloud-init 状态
      debug:
        msg: "cloud-init: {{ osinit_cloudinit_state.stdout | trim }} (期望 masked/disabled)"
  when: osinit_cloudinit_bin.stat.exists

- name: cloud-init 未安装则跳过
  debug:
    msg: "本机未安装 cloud-init, 符合交付标准要求"
  when: not osinit_cloudinit_bin.stat.exists
