---
# 4 块 NVMe -> LVM 条带 -> XFS -> /var/lib/container
#
# 对应现场命令：
#   wipefs -a /dev/nvme{0..3}n1
#   pvcreate /dev/nvme{0..3}n1 -y -f
#   vgcreate vg /dev/nvme{0..3}n1
#   lvcreate -n containerfs -L 1.5T -i 4 -I 256 vg -y
#   mkfs.xfs -f /dev/mapper/vg-containerfs
#
# 按现场交付流程首次执行会清除 4 块盘上的签名；确认目标盘可清空后再执行。
# 已存在 vg 时会在清盘前中止，重跑已完成节点不会误清盘。
#
# 注意：Linux NVMe namespace 设备通常是 /dev/nvme0n1，而不是 /dev/nvme0。
- name: Build four-NVMe striped LVM for containerd and kubelet
  hosts: cluster
  become: yes
  vars:
    nvme_devices:
      - /dev/nvme0n1
      - /dev/nvme1n1
      - /dev/nvme2n1
      - /dev/nvme3n1
    nvme_wipe_signatures: true
    vg_name: vg
    lv_name: containerfs
    lv_size: 1.5T
    fstype: xfs
    stripe_count: 4
    stripe_size_kb: 256
    container_base: /var/lib/container
    container_binds:
      - { src: containerd, dest: /var/lib/containerd }
      - { src: kubelet, dest: /var/lib/kubelet }

  tasks:
    - name: 安装 LVM 工具
      package:
        name: lvm2
        state: present

    - name: 检查 NVMe 设备是否存在
      stat:
        path: "{{ item }}"
      loop: "{{ nvme_devices }}"
      register: nvme_device_stats

    - name: 中断 - NVMe 设备不完整
      assert:
        that:
          - item.stat.exists
          - item.stat.isblk | default(false)
        fail_msg: "找不到块设备 {{ item.item }}，请确认设备名称和硬件。"
      loop: "{{ nvme_device_stats.results }}"

    # 防止把带分区、正在挂载、被 dm/raid/crypt 占用的盘直接 wipefs。
    - name: 检查 NVMe 是否存在分区或子设备
      shell: |
        set -o pipefail
        lsblk -nrpo NAME,TYPE,MOUNTPOINT "{{ item }}" | awk 'NR > 1 {print}'
      args:
        executable: /bin/bash
      loop: "{{ nvme_devices }}"
      register: nvme_children
      changed_when: false

    - name: 检查 NVMe holders
      shell: |
        base=$(basename "{{ item }}")
        test ! -d "/sys/block/${base}/holders" || find "/sys/block/${base}/holders" -mindepth 1 -maxdepth 1 -print -quit
      args:
        executable: /bin/bash
      loop: "{{ nvme_devices }}"
      register: nvme_holders
      changed_when: false
      failed_when: false

    - name: 拦截有分区、挂载或底层占用的 NVMe
      assert:
        that:
          - item.0.stdout | trim == ''
          - item.1.stdout | trim == ''
        fail_msg: >-
          {{ item.0.item }} 不是可安全处理的整盘：
          子设备/挂载信息={{ item.0.stdout | trim | default('无') }}，
          holders={{ item.1.stdout | trim | default('无') }}。
          为防止误清盘已中止。
      loop: "{{ nvme_children.results | zip(nvme_holders.results) | list }}"

    # 先检查 VG，再决定是否允许清盘，避免重跑时 wipefs 误伤已部署数据。
    - name: 检查卷组是否已存在
      command: "vgs --noheadings --options vg_name {{ vg_name }}"
      register: vg_check
      changed_when: false
      failed_when: false

    - name: 判断卷组状态
      set_fact:
        vg_exists: "{{ vg_check.rc == 0 and (vg_check.stdout | trim) != '' }}"

    - name: 禁止对已有卷组再次执行清盘
      assert:
        that:
          - not (nvme_wipe_signatures | bool and vg_exists)
        fail_msg: "卷组 {{ vg_name }} 已存在，禁止使用 nvme_wipe_signatures=true 重复清盘。"

    - name: 显示 NVMe 当前签名
      command: "wipefs --noheadings {{ item }}"
      loop: "{{ nvme_devices }}"
      register: nvme_signatures
      changed_when: false
      failed_when: false

    - name: 清除 NVMe 文件系统/LVM/分区表签名（需显式开启）
      command: "wipefs -a {{ item.item }}"
      loop: "{{ nvme_signatures.results }}"
      when:
        - nvme_wipe_signatures | bool
        - item.stdout | trim != ''
      register: wipefs_result

    - name: 创建物理卷 PV
      command: "pvcreate {{ nvme_devices | join(' ') }} -y -f"
      when: not vg_exists

    - name: 创建卷组 vg
      command: "vgcreate {{ vg_name }} {{ nvme_devices | join(' ') }}"
      when: not vg_exists

    - name: 检查逻辑卷是否已存在
      command: "lvs --noheadings --options lv_name {{ vg_name }}"
      register: lv_check
      changed_when: false
      failed_when: false

    - name: 判断逻辑卷状态
      set_fact:
        lv_exists: "{{ lv_check.rc == 0 and (lv_name in (lv_check.stdout_lines | map('trim') | list)) }}"

    - name: 创建 1.5T、4 路、256K 条带逻辑卷
      command: >-
        lvcreate -n {{ lv_name }} -L {{ lv_size }}
        -i {{ stripe_count }} -I {{ stripe_size_kb }} {{ vg_name }} -y
      when: not lv_exists

    - name: 检查文件系统类型
      command: "blkid -s TYPE -o value /dev/{{ vg_name }}/{{ lv_name }}"
      register: lv_fs
      changed_when: false
      failed_when: false

    - name: 在逻辑卷上创建 XFS
      filesystem:
        fstype: "{{ fstype }}"
        dev: "/dev/{{ vg_name }}/{{ lv_name }}"
        force: false
      when: lv_fs.stdout | trim == ''

    - name: 创建主挂载点
      file:
        path: "{{ container_base }}"
        state: directory
        mode: '0711'

    - name: 挂载 containerfs 到 /var/lib/container 并写入 fstab
      mount:
        path: "{{ container_base }}"
        src: "/dev/{{ vg_name }}/{{ lv_name }}"
        fstype: "{{ fstype }}"
        opts: defaults
        state: mounted

    - name: 创建数据目录
      file:
        path: "{{ container_base }}/{{ item }}"
        state: directory
        mode: '0711'
      loop:
        - containerd
        - kubelet

    - name: 创建标准挂载点
      file:
        path: "{{ item.dest }}"
        state: directory
        mode: '0711'
      loop: "{{ container_binds }}"

    - name: bind 挂载 containerd 和 kubelet 并写入 fstab
      mount:
        path: "{{ item.dest }}"
        src: "{{ container_base }}/{{ item.src }}"
        fstype: none
        opts: "bind,x-systemd.requires-mounts-for={{ container_base }}"
        state: mounted
      loop: "{{ container_binds }}"

    - name: 验证主挂载和 bind 挂载
      command: "findmnt {{ item }}"
      loop: "{{ [container_base] + (container_binds | map(attribute='dest') | list) }}"
      register: final_mounts
      changed_when: false

    - name: 输出最终挂载结果
      debug:
        msg:
          - "LVM: /dev/{{ vg_name }}/{{ lv_name }}，大小={{ lv_size }}，条带={{ stripe_count }} 路/{{ stripe_size_kb }}K"
          - "{{ final_mounts.results | map(attribute='stdout') | list }}"
