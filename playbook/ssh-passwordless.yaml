---
# 为集群所有节点的 root 配置 SSH 免密互信 (N×N)
# 前提: inventory 已能连上各节点(首次用密码,本 playbook 跑完即免密)
# 用法: ansible-playbook ssh-passwordless.yml   (首次带 -k 输入密码, 或 inventory 里配 ansible_password)
- name: 配置集群 root SSH 免密互信
  hosts: cluster
  become: yes
  gather_facts: no
  tasks:
    - name: 确保 /root/.ssh 目录存在
      file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: 生成 root SSH 密钥 (不存在才生成)
      command: ssh-keygen -t rsa -b 4096 -f /root/.ssh/id_rsa -N ""
      args:
        creates: /root/.ssh/id_rsa

    - name: 读取每个节点的 root 公钥
      slurp:
        src: /root/.ssh/id_rsa.pub
      register: root_pubkey

    - name: 互相授权 (把所有节点的公钥写入每个节点的 authorized_keys)
      authorized_key:
        user: root
        state: present
        key: "{{ hostvars[item].root_pubkey.content | b64decode }}"
      loop: "{{ ansible_play_hosts }}"

    - name: 配置 root ssh 客户端免交互 (不提示/不校验 host key)
      copy:
        dest: /root/.ssh/config
        owner: root
        group: root
        mode: '0600'
        content: |
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              LogLevel ERROR

    - name: 提示
      debug:
        msg: "root SSH 免密互信已配置。验证: ssh root@<其它节点> hostname (应无需密码)"
