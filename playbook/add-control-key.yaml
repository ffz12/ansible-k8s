---
# 免密公钥下发: 把【某个"源"】的 root 公钥写入目标节点的 authorized_keys(单向 源 -> 目标)。
#   默认源 = 控制机(跑 ansible 这台)      → 控制机免密登各节点(交付前置)
#   -e source_node=<主机> 源 = 该节点       → 该节点(如 MPI launcher)免密登其他机器(一台 -> 多台)
# 与 remove-control-key.yaml(删)成对。始终单向, 不是节点间 N×N 互信。
#
# 用法(从仓库根目录跑):
#   ansible-playbook playbook/add-control-key.yaml                          # 控制机 -> 全 cluster
#   ansible-playbook playbook/add-control-key.yaml -e source_node=gpu-001   # gpu-001 -> 全 cluster(含自己, MPI 用)
#   目标可再缩(推荐 target_hosts, 别用 -l):  -e target_hosts=gpu
#     ⚠ -l 会连带过滤掉第一个 play 的 localhost 源, 导致公钥读不到(报 _source_pubkey 未定义);
#       非用 -l 不可时须带上 localhost:  -l gpu-002,gpu-003,localhost
#   默认源公钥路径可覆盖: -e control_pubkey_file=/root/.ssh/id_rsa.pub
# 前提: 首次目标节点还没免密时带 -k 输密码; 默认源需控制机已有 id_rsa.pub(指定源节点会自动生成)。
# 注: 指定 source_node 时, 会在源节点 ~/.ssh/config 追加 StrictHostKeyChecking no(blockinfile
#     带 marker, 不覆盖已有配置), 使其首次 ssh 目标不再被问 host key。默认源(控制机)不动客户端配置。

- name: 取得"源"的 root 公钥
  hosts: "{{ source_node | default('localhost') }}"
  become: yes
  gather_facts: no
  run_once: true
  vars:
    control_pubkey_file: /root/.ssh/id_rsa.pub
    _src_pubfile: "{{ '/root/.ssh/id_rsa.pub' if source_node is defined else control_pubkey_file }}"
  tasks:
    - name: (指定源节点时)确保源节点 root 有密钥对
      command: ssh-keygen -t rsa -b 4096 -f /root/.ssh/id_rsa -N ""
      args:
        creates: /root/.ssh/id_rsa
      when: source_node is defined

    - name: (指定源节点时)源节点 ~/.ssh/config 关 host key 提示
      blockinfile:
        path: /root/.ssh/config
        create: yes
        owner: root
        group: root
        mode: "0600"
        marker: "# {mark} ANSIBLE add-control-key"
        block: |
          Host *
              StrictHostKeyChecking no
      when: source_node is defined

    - name: (默认源=控制机时)检查公钥是否存在
      stat:
        path: "{{ control_pubkey_file }}"
      register: _ctrl_pub
      when: source_node is not defined

    - name: (默认源=控制机时)公钥缺失且用默认路径 → 自动生成控制机 root 密钥对
      command: ssh-keygen -t rsa -b 4096 -f /root/.ssh/id_rsa -N ""
      args:
        creates: /root/.ssh/id_rsa
      when:
        - source_node is not defined
        - not _ctrl_pub.stat.exists
        - control_pubkey_file == '/root/.ssh/id_rsa.pub'

    - name: (默认源=控制机时)重新确认公钥存在
      stat:
        path: "{{ control_pubkey_file }}"
      register: _ctrl_pub
      when: source_node is not defined

    - name: 控制机公钥仍不存在则报错(多为 -e control_pubkey_file 指了不存在的自定义路径)
      assert:
        that: _ctrl_pub.stat.exists
        fail_msg: "控制机 {{ control_pubkey_file }} 不存在且非默认路径(无法自动生成); 先 ssh-keygen 生成, 或 -e control_pubkey_file= 指定正确路径"
      when: source_node is not defined

    - name: 读取源公钥
      slurp:
        src: "{{ _src_pubfile }}"
      register: _src_pub

    - name: 存为 fact 供下一 play 使用
      set_fact:
        _source_pubkey: "{{ _src_pub.content | b64decode | trim }}"

- name: 把源公钥写入目标节点 authorized_keys
  hosts: "{{ target_hosts | default('cluster') }}"
  become: yes
  gather_facts: no
  vars:
    _src_host: "{{ source_node | default('localhost') }}"
  tasks:
    - name: 写入 root authorized_keys
      authorized_key:
        user: root
        state: present
        key: "{{ hostvars[_src_host]._source_pubkey }}"

    - name: 提示
      debug:
        msg: "已把 [{{ _src_host }}] 的 root 公钥写入本节点; {{ _src_host }} 现可免密登本节点。"
