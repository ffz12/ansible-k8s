# playbook/tasks/ensure-harbor-hosts.yml
# 幂等确保 harbor_instances 里每个域名在本机 /etc/hosts 有解析。
#
# 为什么抽成共享任务: 原本【三处】各写一遍同样的 blockinfile ——
#   ① containerd/containerd-setup/tasks/main.yaml
#   ② docker/docker-daemon/tasks/main.yml
#   ③ docker/docker-gpu/tasks/main.yaml
# 三处都只在装容器运行时的节点上跑。而 playbook/harbor-trust.yaml 的 hosts 是
# 【cluster】(超集): 没装 containerd 也没装 docker 的节点从来没拿到过 harbor 解析,
# 于是 trust-harbor-ca 的 TLS 验证在那些节点上必然失败 —— 且失败原因是"域名解析不了",
# 跟 CA 信任毫无关系, 极易误判成证书问题查半天。
#
# 2026-09-09: ①②③ 三处已全部改为 include 本任务, 本文件是 harbor 解析的【唯一写入方】。
#
# marker 说明: 本任务用 "# Ansible harbor hosts", 而 ①②③ 历史上用的是
# "# Ansible inventory hosts"(命名 marker, 不是 ansible 默认的 BEGIN/END ANSIBLE
# MANAGED BLOCK)。收敛前机器上会同时留着新旧两份, 内容相同所以看不出问题, 但改了
# harbor IP 时【旧块不会被更新】, 而它在 /etc/hosts 里可能排在前面 —— 解析取第一条,
# 于是被旧值带偏。故下面第一步显式清掉旧块。
# 已确认旧 marker 只被上述三处使用、内容只有 harbor 解析(2026-09-09 全仓 grep),
# 所以清它不会误删别的角色写的东西。
#
# 用法: - include_tasks: "{{ playbook_dir }}/tasks/ensure-harbor-hosts.yml"

# 先清旧块再写新块, 顺序要紧: 反过来的话同一次运行里文件中会短暂存在两份。
- name: "[Harbor] 清理历史 marker 写下的 harbor 解析块(收敛为单一来源)"
  blockinfile:
    path: /etc/hosts
    marker: "# Ansible inventory hosts {mark}"
    state: absent
    backup: yes

# 少写 ip 的话渲染出来是一行孤零零的域名, /etc/hosts 会把它整行当无效记录忽略,
# 不报错、但解析照样不通 —— 在这儿拦掉, 比到 TLS 那步再猜好查。
- name: "[Harbor] 校验 harbor_instances 每项都有 ip 和 dns"
  assert:
    that:
      - item.dns | default('') | trim | length > 0
      - item.ip  | default('') | trim | length > 0
    fail_msg: >-
      harbor_instances 里有条目缺 ip 或 dns: {{ item }}。
      正确写法(见 tmp/env.yaml.example):
        harbor_instances:
          - { dns: "harbor.local.clusters", ip: "172.171.0.206" }
  loop: "{{ harbor_instances }}"
  loop_control:
    label: "{{ item.dns | default('<无 dns>') }}"
  run_once: true

- name: "[Harbor] 写入域名解析到 /etc/hosts"
  blockinfile:
    path: /etc/hosts
    marker: "# Ansible harbor hosts {mark}"
    create: no
    backup: yes
    block: |
      {% for item in harbor_instances %}
      {{ item.ip }} {{ item.dns }}
      {% endfor %}
