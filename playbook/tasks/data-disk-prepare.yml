# 额外数据盘: 检查 + 仅对空白盘格式化(mount-nvme.yaml 按 data_disks 逐块 include, loop_var=_disk)
- name: "数据盘 {{ _disk.dev }} —— 设备是否存在"
  stat:
    path: "{{ _disk.dev }}"
  register: _dd_stat

- name: "数据盘 {{ _disk.dev }} —— 不存在则中断"
  fail:
    msg: "找不到数据盘 {{ _disk.dev }}，请确认 data_disks。"
  when: not _dd_stat.stat.exists

- name: "数据盘 {{ _disk.dev }} —— 检测是否已有文件系统"
  command: "blkid -s TYPE -o value {{ _disk.dev }}"
  register: _dd_fs
  changed_when: false
  failed_when: false
  check_mode: false

- name: "数据盘 {{ _disk.dev }} —— {{ _disk.path }} 是否已挂载"
  set_fact:
    _dd_mounted: "{{ ansible_mounts | selectattr('mount', 'equalto', _disk.path) | list | length > 0 }}"

- name: "数据盘 {{ _disk.dev }} —— 格式化(仅空白盘)"
  filesystem:
    fstype: "{{ fstype }}"
    dev: "{{ _disk.dev }}"
    force: no
  when:
    - not _dd_mounted
    - _dd_fs.stdout == ""

- name: "📢 数据盘 {{ _disk.dev }} -> {{ _disk.path }}"
  debug:
    msg: >-
      {{ _disk.dev }} -> {{ _disk.path }}:
      {{ ('已挂载, 不动') if _dd_mounted else
         (('已有文件系统(' ~ _dd_fs.stdout ~ '), 不格式化, 直接挂载, 数据保留') if _dd_fs.stdout != ''
          else ('空白盘, ' ~ ('实跑会 ' if ansible_check_mode else '已 ') ~ 'mkfs.' ~ fstype)) }}
