---
# apt 代理配置 playbook(仅 /etc/apt/apt.conf.d/95proxy)
# 用法: ansible-playbook -i ../inventory/hosts apt-proxy.yaml
# 取消代理: ansible-playbook -i ../inventory/hosts apt-proxy.yaml -e proxy_state=absent

- name: Configure apt proxy
  # hosts 用 init 而不是 all: apt 代理只对【要装包的机器】有意义, 而 [init] 正是
  # "本次要初始化哪些节点"的清单(见 init.yaml 头部说明), 与装包动作天然对齐。
  # ⚠ all 的问题不只是范围大: inventory 里 [harbor] 和 [chronyserver] 写的是裸 IP,
  #   ansible 会把它们当成【独立主机】(与 [cluster] 里同一台机器的 inventory 名互不
  #   相识), all 于是包含这些裸 IP 条目 —— 同一台机器被连两次、写两遍同一个文件,
  #   而裸 IP 那份身份没有 group_vars 里的任何主机变量, 出问题也更难对上号。
  hosts: init
  become: true
  vars:
    # ⚠ 地址【不要写在这里】—— 站点专属值放 inventory/group_vars/all/env.yaml 的
    #   apt_proxy_url(env.yaml 在 .gitignore 里, 不入库)。以前硬编码在这一行,
    #   每个站点都得改它, 于是每次 git pull 都撞:
    #     error: Your local changes to the following files would be overwritten by merge
    #   兜底值见 group_vars/all/defaults.yaml 的 apt_proxy_url。
    #   临时换一个也可以不改文件: -e apt_proxy_url=http://x.x.x.x:3128
    proxy_url: "{{ apt_proxy_url }}"
    proxy_state: present          # present=设置代理; absent=移除代理

  tasks:
    - name: Set apt proxy config
      copy:
        dest: /etc/apt/apt.conf.d/95proxy
        mode: "0644"
        content: |
          Acquire::http::Proxy "{{ proxy_url }}";
          Acquire::https::Proxy "{{ proxy_url }}";
      when: proxy_state == "present"

    - name: Remove apt proxy config
      file:
        path: /etc/apt/apt.conf.d/95proxy
        state: absent
      when: proxy_state == "absent"
