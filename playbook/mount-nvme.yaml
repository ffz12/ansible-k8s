---
- name: Mount data disk; containerd & kubelet via bind
  hosts: cluster
  become: yes
  vars:
    # ===== 换盘只改这里 =====
    device_path: "/dev/nvme2n1"          # 数据盘设备(LVM卷或裸盘); 换盘改这一处
    fstype: "xfs"
    # container_base 来自 group_vars/all.yaml(与 containerd_setup 共用)。
    # containerd 与 kubelet 都走 bind 挂载到标准路径(与 mount-nvme-lvm.yaml 保持一致):
    #   containerd_root 已改为标准路径 /var/lib/containerd(见 defaults.yaml), 不再直接指盘上路径,
    #   否则数据会建在系统盘而不是数据盘上。
    container_binds:
      - { src: "containerd", dest: "/var/lib/containerd" }
      - { src: "kubelet",    dest: "/var/lib/kubelet" }

  tasks:
    # 1. 物理设备检查
    - name: Check if the data device exists
      stat:
        path: "{{ device_path }}"
      register: device_stat

    - name: 📢 [终端显示] 磁盘是否存在
      debug:
        msg: "设备 {{ device_path }} 状态: {{ '✅ 存在' if device_stat.stat.exists else '❌ 不存在' }}"

    - name: 中断执行 (如果磁盘不存在)
      fail:
        msg: "找不到设备 {{ device_path }}，请确认硬件连接。"
      when: not device_stat.stat.exists

    # 2. 检查主挂载状态
    - name: Get current mount information
      setup:
        filter: ansible_mounts

    - name: Set mount flag
      set_fact:
        already_mounted: "{{ ansible_mounts | selectattr('mount', 'equalto', container_base) | list | length > 0 }}"

    - name: 📢 [终端显示] 主挂载点检查
      debug:
        msg: "{{ container_base }} 当前状态: {{ '⚠️ 已挂载' if already_mounted else '🆗 未挂载 (准备执行)' }}"

    # 3. 安全检测: 盘上是否已有文件系统/数据
    - name: 检测盘上是否已有文件系统
      command: "blkid -s TYPE -o value {{ device_path }}"
      register: existing_fs
      changed_when: false
      failed_when: false

    - name: 📢 [终端显示] 盘上文件系统检测
      debug:
        msg: "{{ device_path }} 文件系统: {{ existing_fs.stdout if existing_fs.stdout != '' else '空白(无文件系统)' }}"

    # 仅当"未挂载"且"完全空白"时才格式化; 只要有任何文件系统就绝不格式化(双保险: 再叠加 force:no)
    - name: Create filesystem on the data device (仅空白盘)
      filesystem:
        fstype: "{{ fstype }}"
        dev: "{{ device_path }}"
        force: no
      when:
        - not already_mounted
        - existing_fs.stdout == ""

    - name: ⚠️ [终端显示] 盘上已有数据,跳过格式化
      debug:
        msg: "⚠️ {{ device_path }} 已有文件系统({{ existing_fs.stdout }})，已跳过格式化，将直接挂载，数据保留。"
      when: existing_fs.stdout != ""

    # 4. 获取 UUID
    - name: Get UUID of the device
      command: blkid -s UUID -o value {{ device_path }}
      register: device_uuid
      changed_when: false

    - name: 📢 [终端显示] 获取到的 UUID
      debug:
        msg: "设备 {{ device_path }} 的 UUID 为: {{ device_uuid.stdout }}"

    # 5. 挂载数据盘到主挂载点 (用 UUID,写入 fstab)
    - name: Mount data device to container_base by UUID
      mount:
        path: "{{ container_base }}"
        src: "UUID={{ device_uuid.stdout }}"
        fstype: "{{ fstype }}"
        opts: defaults
        state: mounted

    # 6-7. containerd + kubelet: 统一 bind mount(与 mount-nvme-lvm.yaml 保持一致)
    - name: 创建盘上目录 ({{ container_base }}/containerd, {{ container_base }}/kubelet)
      file:
        path: "{{ container_base }}/{{ item.src }}"
        state: directory
        mode: "0711"
      loop: "{{ container_binds }}"

    - name: 创建标准挂载点 (/var/lib/containerd, /var/lib/kubelet)
      file:
        path: "{{ item.dest }}"
        state: directory
        mode: "0711"
      loop: "{{ container_binds }}"

    # 8. bind 挂载 (带 x-systemd.requires-mounts-for 保证开机时主挂载先就绪)
    - name: Bind mount containerd/kubelet dir to standard path
      mount:
        path: "{{ item.dest }}"
        src: "{{ container_base }}/{{ item.src }}"
        fstype: none
        opts: "bind,x-systemd.requires-mounts-for={{ container_base }}"
        state: mounted
      loop: "{{ container_binds }}"

    # 9. 最终确认
    - name: Final confirmation of mounts
      command: "findmnt {{ item }}"
      register: final_check
      changed_when: false
      failed_when: false
      loop: "{{ [container_base] + (container_binds | map(attribute='dest') | list) }}"

    - name: 📢 [终端显示] 最终挂载确认
      debug:
        msg: "{{ final_check.results | map(attribute='stdout') | list }}"
