# 单独下发「NetworkManager 忽略 CNI 接口」的配置。
# 装机流程里 kube-common 已经做过(所有节点), 这个入口给【集群已建好但没下发过】的场景 ——
# 装了 NetworkManager 的存量集群都该跑一次, 否则哪台 reload 过 NM 哪台的 Pod 网络就断。
#
#   ansible-playbook playbook/nm-unmanage-cni.yaml
#   ansible-playbook playbook/nm-unmanage-cni.yaml --limit cpu-node-8-205
#   ansible-playbook playbook/nm-unmanage-cni.yaml -e target_hosts=k8s_node
#
# 现场症状(没配的后果): 宿主机 ping 本机 Pod IP 报 connect: Invalid argument,
# nmcli device status 里 cali*/tunl0 显示 disconnected, ip -br link 里 cali* 全是 DOWN。
- name: NetworkManager 忽略 CNI 接口
  hosts: "{{ target_hosts | default('k8s_master:k8s_node') }}"
  become: yes
  gather_facts: no
  tasks:
    - name: 下发配置并拉起被 down 掉的接口
      include_tasks: "{{ playbook_dir }}/tasks/nm-unmanage-cni.yml"
