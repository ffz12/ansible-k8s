---
# ============================================================================
#  os-init.yaml —— 通用 CPU/GPU 主机 操作系统环境初始化
#  默认值按青岛联通《交付标准》设定; 站点差异在 inventory/group_vars/all/env.yaml 覆盖。
#
#  作用域: 【只做纯软件配置】
#    ✅ 时区 UTC + chrony 对时 / cloud-init 关闭 / apt 自动更新关闭
#    ✅ 统一登录账号(os-account) / CPU performance + TurboBoost / ipmitool
#    ✅ 主机名规范(CPU-xxx / GPU-SUn-xxx) / GRUB 固定内核 / 日志外送(可选)
#    ❌ 完全不碰网络: netplan、bond、vlan、RDMA hca_id、策略路由、IP、网卡驱动
#       —— 这些由 os-check 只读体检出报告, 人工按报告处置
#
#  执行顺序建议:
#    1) ansible-playbook playbook/os-check.yaml                   # 改之前先存档现状
#    2) ansible-playbook playbook/init.yaml                       # 通用基线(可选)
#    3) ansible-playbook playbook/os-init.yaml                    # 本 playbook
#    4) ansible-playbook playbook/os-check.yaml                   # 改之后复查出交付报告
#
#  用法:
#    # 密码从【控制机环境变量】取, 不落文件、不进 git、不留 shell history
#    export OSACCT_USER_PASSWORD='统一登录密码'
#    ansible-playbook playbook/os-init.yaml
#
#    # 先空跑看会改什么(强烈建议)
#    ansible-playbook playbook/os-init.yaml --check --diff
#
#    # 只跑某一类(tags: pkgs/time/cloudinit/apt/account/rootpw/cpu/swap/acs/hostname/grub/syslog)
#    ansible-playbook playbook/os-init.yaml --tags time,cpu
#
#    # 跳过风险最高的 GRUB 改动
#    ansible-playbook playbook/os-init.yaml --skip-tags grub
#
#    # 只配账号(不碰 root 口令用 --tags account; 连 root 一起用 --tags account,rootpw)
#    ansible-playbook playbook/os-init.yaml --tags account
#
#  ⚠ 别用 sudo ansible-playbook —— sudo 默认清环境变量, 密码会取不到。
#    本 playbook 自带 become: yes, 直接以普通用户跑即可; 非要 sudo 就用 sudo -E。
# ============================================================================

- name: 操作系统环境初始化(纯软件配置 + 统一账号)
  hosts: cluster
  gather_facts: yes
  become: yes
  serial: "{{ osinit_serial | default('100%') }}"   # 需要灰度时: -e osinit_serial=1
  roles:
    - os-init
    - os-account
