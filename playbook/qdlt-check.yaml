---
# ============================================================================
#  qdlt-check.yaml —— 青岛联通交付标准「只读体检」
#
#  ⚠ 全程不修改任何配置, 可随时安全执行(初始化前自查 / 初始化后验收都能跑)。
#
#  用法:
#    ansible-playbook playbook/qdlt-check.yaml
#    ansible-playbook playbook/qdlt-check.yaml -e qdlt_verbose=true   # 打印逐项明细
#    ansible-playbook playbook/qdlt-check.yaml --limit CPU-229
#
#  产物(控制机本地): reports/qdlt-check-<时间戳>.md 和 .csv
# ============================================================================

- name: 青岛联通交付标准 —— 节点只读体检
  hosts: qdlt
  gather_facts: yes
  become: yes
  any_errors_fatal: no          # 单台失败不影响其余节点体检
  roles:
    - qdlt-check

- name: 汇总生成体检报告
  hosts: qdlt
  gather_facts: no
  become: no
  run_once: yes
  roles:
    - qdlt-report
