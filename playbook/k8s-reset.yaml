---
# 重置整个 k8s 集群(所有 master + worker 执行 kubeadm reset + 清理)
# ⚠️ 破坏性操作! 必须显式确认: ansible-playbook playbook/k8s-reset.yaml -e confirm_reset=yes
# 外置 etcd 默认一并销毁(否则重装会撞旧数据); 保留 etcd 加 -e reset_etcd=false

- name: 安全确认
  hosts: localhost
  gather_facts: no
  tasks:
    - name: 必须显式确认才执行
      assert:
        that:
          - confirm_reset | default('') | string == 'yes'
        fail_msg: >-
          这会销毁整个 k8s 集群! 确认请加: -e confirm_reset=yes
          (默认同时销毁外置 etcd; 想保留 etcd 再加 -e reset_etcd=false)
        success_msg: "已确认, 开始重置集群..."

- name: 重置所有 k8s 节点(master + worker)
  hosts: k8s_master:k8s_node
  become: yes
  gather_facts: yes
  roles:
    - kubernetes/kube-reset

# 外置 etcd 默认一并销毁(否则重装会撞旧数据); 保留 etcd 加 -e reset_etcd=false
- name: 销毁外置 etcd 集群(默认执行; -e reset_etcd=false 跳过)
  hosts: etcd
  become: yes
  gather_facts: no
  tasks:
    - name: 销毁 etcd(停用+删服务/二进制/数据/配置)
      include_role:
        name: etcd/etcd-destroy
      when: reset_etcd | default(true) | bool
