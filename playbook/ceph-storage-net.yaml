# 配置 Ceph 存储网 netplan(01-storage.yaml) 与管理网 netplan(81-mgmt.yaml)。
# 存储网: IP 按 inventory 的 storage_ip 渲染, 网卡名按 storage_iface 渲染(不同机型
#   网卡命名可能不一致, 不写死), 网关按方案 A 自动推导 = storage_ip 所在 /24 网段的
#   .254(与 via 172.18.x.254 保持一致的路由目标 172.18.96.0/24 是站点约定, 若目标
#   网段变化需同步改本文件里 vars.storage_route_target)。
# 管理网: 这批机器 bond0/成员网卡/mode/mtu 全部一致, 故写死(不走变量); IP 直接复用
#   ansible_host(即当前 SSH 连接就在用的那个地址, 渲染出来的值天然和现状一致,
#   降低"改错 IP 把自己踢下线"的风险), 网关同样按方案 A 自动推导 .254。
# ⚠ 本文件是单文件自包含的 —— 两份 netplan 内容都内联在 vars 里, 不依赖任何外部
#   模板文件, 只需同步这一个文件就能跑通全流程(拉全量代码不方便时适用)。
#
# ⚠️⚠️ 高风险操作, 且两者风险等级不同:
#   · 存储网(01-storage.yaml): 改错只影响存储网, 当前 SSH 连接(走管理网)不受影响,
#     还能登录进去看日志/回滚。
#   · 管理网(81-mgmt.yaml): 这是【当前 SSH 连接正在用的网卡】。改错的瞬间可能直接
#     断开你此刻的连接, 且没有别的路能进去 —— 只能跑机房用 IPMI/控制台救。
#   因此两者都要求显式确认才会真正 apply, 且用【不同的确认参数】, 避免确认一个
#   顺带误触发另一个:
#     confirm_storage_net=yes   只触发存储网那部分
#     confirm_mgmt_net=yes      只触发管理网那部分(风险更高, 务必单独、谨慎地加)
#   两者都默认走 `netplan try`(90 秒内无人确认自动回滚), 而不是直接 `netplan apply`;
#   仅当目标机器 netplan 版本不支持 try 时才回退用 apply(风险自负)。
#   两者应用前都会自动备份原文件(带时间戳), 方便手工回滚对比。
#   ⚠ netplan try/apply 生效的是 /etc/netplan/ 下【全部】文件, 不是单个文件。所以未确认的
#     那一份【不落盘】(否则确认存储网时会把管理网的新文件一起生效, 或下次重启/别人 apply 时生效);
#     不加确认参数只能用 --check --diff 预览。
#
# 前提: inventory 的 [cluster] 机器行需定义 storage_ip 与 storage_iface, 例如:
#   node027 ansible_host=172.18.8.27 storage_ip=172.18.104.11 storage_iface=ens46np0
#   (管理网 IP 直接取 ansible_host, 不需要额外定义; 管理网网卡名写死, 本机没有这两块网卡会被预检拦住)
#
# 用法(存储网):
#   ansible-playbook playbook/ceph-storage-net.yaml --check --diff -e confirm_storage_net=yes  # 预览, 不落盘
#   ansible-playbook playbook/ceph-storage-net.yaml -e confirm_storage_net=yes  # 落盘 + 生效(netplan try)
#
# 用法(管理网, 风险更高, 务必逐台跑、每台跑完都亲自确认能不能连上再跑下一台):
#   ansible-playbook playbook/ceph-storage-net.yaml --limit <单台> --check --diff -e confirm_mgmt_net=yes
#   ansible-playbook playbook/ceph-storage-net.yaml --limit <单台> -e confirm_mgmt_net=yes
#   (最后这条跑完, 立刻从【另一台机器】ping/ssh 这台的 ansible_host 确认连通;
#    90 秒内不确认 = 自动回滚; 确认没问题要永久生效, 必须在 90 秒内手工登录本机
#    执行 kill -USR1 <netplan try 的 pid>(try 的接受信号, 不是 netplan apply)
#    —— 这一步故意不写进自动化)
#   ⚠ 后台(非 TTY)跑 netplan try 与 USR1 接受这两点尚未在现场实测, 先在 node047 存储网验证一次。

- name: 配置 Ceph 存储网与管理网 netplan
  hosts: cluster
  become: yes
  vars:
    _do_storage: "{{ confirm_storage_net | default('') | string == 'yes' }}"
    _do_mgmt: "{{ confirm_mgmt_net | default('') | string == 'yes' }}"
    _mgmt_ifaces: [ens43f1np1, ens43f0np0]  # 与下面 81-mgmt.yaml 内容里的成员网卡保持一致
    storage_route_target: 172.18.96.0/24   # 站点约定的存储网目标段, 与模板里的路由一致
    mgmt_route_target: default             # 管理网默认路由, 与 81-mgmt.yaml 现状一致(to: default)
    # 01-storage.yaml 的内容内联在这里(不再依赖外部 .j2 文件) —— 拉代码不方便时,
    # 只需同步这一个 playbook 文件即可跑通全流程。内容与原模板逐字一致, 只是把
    # Jinja2 换成了 Ansible 变量里的字符串拼接。
    _storage_netplan_content: |
      network:
        version: 2
        ethernets:
          {{ storage_iface }}:
            dhcp4: false
            addresses:
              - {{ storage_ip }}/24
            routes:
              - to: {{ storage_route_target }}
                via: {{ storage_ip.split('.')[0:3] | join('.') }}.254
    # 81-mgmt.yaml: bond0/成员网卡/mode/mtu 写死(这批机器全一致); IP 复用 ansible_host,
    # 网关按方案 A 自动推导。与你贴的原文件逐字对齐, 只是 IP/网关换成变量。
    _mgmt_netplan_content: |
      network:
        version: 2
        ethernets:
          ens43f1np1:
            dhcp4: false
            dhcp6: false
            mtu: 1500
          ens43f0np0:
            dhcp4: false
            dhcp6: false
            mtu: 1500
        bonds:
          bond0:
            ignore-carrier: true
            interfaces: [ens43f1np1, ens43f0np0]
            parameters:
              mode: 802.3ad
              transmit-hash-policy: layer3+4
            mtu: 1500
            dhcp4: false
            dhcp6: false
            addresses: [{{ ansible_host }}/24]
            routes:
              - to: {{ mgmt_route_target }}
                via: {{ ansible_host.split('.')[0:3] | join('.') }}.254
  tasks:
    - name: 预检 —— 本机必须定义 storage_ip 与 storage_iface
      assert:
        that:
          - storage_ip is defined
          - storage_iface is defined
        fail_msg: >-
          本机 {{ inventory_hostname }} 缺 storage_ip 或 storage_iface, 请在 inventory 的
          [cluster] 机器行补齐, 例如: {{ inventory_hostname }} storage_ip=172.18.104.11 storage_iface=ens46np0
      when: _do_storage | bool

    - name: 预检 —— 管理网写死的成员网卡本机必须存在
      assert:
        that:
          - _mgmt_ifaces | difference(ansible_interfaces) | length == 0
        fail_msg: >-
          本机 {{ inventory_hostname }} 缺网卡 {{ _mgmt_ifaces | difference(ansible_interfaces) | join(',') }},
          81-mgmt.yaml 的拓扑是按另一批机型写死的, 不能套用到这台。
      when: _do_mgmt | bool

    - name: 禁用 cloud-init 的网络配置能力(否则重启后会重新生成 50-cloud-init.yaml 这类占位文件)
      # 官方指定路径与写法, 见 cloud-init 文档 —— 写这个文件后, cloud-init 不再在每次
      # boot 时探测/改写网络配置, 也就不会再生成/覆盖 netplan 目录下的文件。
      # 此举风险很低: 只是关掉"cloud-init 管网络"这一项能力, 不改动任何现有网卡/路由,
      # 也不影响 01-storage.yaml / 81-mgmt.yaml(那两个从来不是 cloud-init 管的)。
      copy:
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
        content: |
          network: {config: disabled}
        owner: root
        group: root
        mode: '0644'
      register: _cloudinit_netcfg_disabled

    - name: 读取 50-cloud-init.yaml(判断是不是空占位用)
      slurp:
        path: /etc/netplan/50-cloud-init.yaml
      register: _cloudinit_netplan_raw
      failed_when: false

    - name: "判断 50-cloud-init.yaml 是否为空占位(network 下除 version 外没有任何非空段, 如 ethernets: {})"
      set_fact:
        _cloudinit_netplan_empty: >-
          {{ ((((_cloudinit_netplan_raw.content | b64decode | from_yaml) or {}).network | default({})) or {})
             | dict2items | rejectattr('key', 'equalto', 'version') | selectattr('value') | list | length == 0 }}
      when: _cloudinit_netplan_raw.content is defined

    - name: 清理 cloud-init 生成的空 netplan 占位文件(仅当内容确认为空)
      # ⚠ 只删这一个已知文件, 且只在上一步确认里面没有任何网卡定义时才删, 不做通配删除 ——
      #   避免误删 01-storage.yaml / 81-mgmt.yaml 或某台机器上 cloud-init 真正在管的网络配置。
      file:
        path: /etc/netplan/50-cloud-init.yaml
        state: absent
      register: _cloudinit_netplan_removed
      when:
        - _cloudinit_netplan_raw.content is defined
        - _cloudinit_netplan_empty | bool

    - name: 提示 —— 50-cloud-init.yaml 里有实际网络配置, 保留未删
      debug:
        msg: >-
          {{ inventory_hostname }}: /etc/netplan/50-cloud-init.yaml 不是空占位, 未删除。
          请人工确认它与 01-storage.yaml / 81-mgmt.yaml 是否冲突(同一网卡被两个文件定义会合并生效)。
      when:
        - _cloudinit_netplan_raw.content is defined
        - not (_cloudinit_netplan_empty | bool)

    - name: 检测 netplan 是否支持 try 子命令
      command: netplan try --help
      register: _netplan_try_check
      changed_when: false
      failed_when: false

    - name: 渲染 01-storage.yaml(仅 confirm_storage_net=yes 时落盘; --check 下只出 diff)
      # 用 copy + vars 里的 _storage_netplan_content(已含 Jinja2 变量, copy 的 content
      # 参数本身会被当模板渲染), 不依赖外部 .j2 文件 —— 只需同步这一个 playbook 文件。
      copy:
        content: "{{ _storage_netplan_content }}"
        dest: /etc/netplan/01-storage.yaml
        owner: root
        group: root
        mode: '0600'
        backup: yes
      register: _storage_netplan_render
      when: _do_storage | bool

    # 管理网(81-mgmt.yaml)用独立的 confirm_mgmt_net 参数, 与存储网的 confirm_storage_net 隔离。
    # 风险高于存储网(改的正是当前 SSH 连接所在的网卡), 务必 --limit 单台跑。
    - name: 渲染 81-mgmt.yaml(仅 confirm_mgmt_net=yes 时落盘; --check 下只出 diff)
      copy:
        content: "{{ _mgmt_netplan_content }}"
        dest: /etc/netplan/81-mgmt.yaml
        owner: root
        group: root
        mode: '0600'
        backup: yes
      register: _mgmt_netplan_render
      when: _do_mgmt | bool

    - name: 未加任何确认参数, 本次不渲染也不生效
      debug:
        msg: >-
          {{ inventory_hostname }}: 未加 -e confirm_storage_net=yes / -e confirm_mgmt_net=yes,
          没有写入也没有生效任何 netplan 文件。预览用 --check --diff 加对应的确认参数。
      when:
        - not (_do_storage | bool)
        - not (_do_mgmt | bool)

    # ================================================================
    # 生效: 一次 netplan try 同时生效 /etc/netplan/ 下全部文件, 所以存储网和管理网
    # 共用这一段, 不分两次起(两个 try 并发会互相打架)。
    # 不看 copy 是否 changed: 文件可能早已落盘但从未生效(旧版本本 playbook 不确认也会落盘),
    # 只要显式确认就生效一次; 配置没变时 try 等于原样重载。
    # ================================================================
    - name: 记录本次生效范围与 netplan try 日志路径
      set_fact:
        _apply_scope: "{{ (['存储网'] if _do_storage | bool else []) + (['管理网'] if _do_mgmt | bool else []) }}"
        _netplan_try_log: "/tmp/netplan-try-{{ ansible_date_time.epoch }}.log"
      when: (_do_storage | bool) or (_do_mgmt | bool)

    - name: 后台起 netplan try(90 秒试用窗口, 不确认自动回滚)
      # ⚠ 不伪造任何输入(不用 `<<< ""`): 空输入/EOF 可能被当成"已确认", 回滚保护就没了。
      #   `sleep 100 |` 给 try 一个 100 秒内既无数据也不 EOF 的 stdin, 覆盖整个 90 秒窗口。
      # 管理网: 新配置生效时本条 SSH 连接可能被重置, 属预期; 判断依据是窗口内外能否重新连上。
      shell: |
        nohup sh -c 'sleep 100 | netplan try --timeout=90' > {{ _netplan_try_log }} 2>&1 &
        echo $! > /run/netplan-try.pid
      when:
        - (_do_storage | bool) or (_do_mgmt | bool)
        - _netplan_try_check.rc == 0
        - not ansible_check_mode
      changed_when: true

    - name: 3 秒后确认 netplan try 仍在试用窗口内(秒退 = 没进入窗口, 打印日志)
      shell: |
        sleep 3
        if pgrep -f 'netplan try' >/dev/null; then echo alive; else echo dead; cat {{ _netplan_try_log }}; fi
      register: _netplan_try_alive
      changed_when: false
      failed_when: "'dead' in _netplan_try_alive.stdout"
      ignore_unreachable: true
      when:
        - (_do_storage | bool) or (_do_mgmt | bool)
        - _netplan_try_check.rc == 0
        - not ansible_check_mode

    - name: 提示 —— 90 秒窗口内人工确认连通并接受新配置
      debug:
        msg: >-
          {{ inventory_hostname }}: netplan try 已后台启动, 生效范围 {{ _apply_scope | join('+') }}, 90 秒窗口。
          {% if _do_storage | bool %}请【现在】从存储网另一端 ping/ssh {{ storage_ip }}。{% endif %}
          {% if _do_mgmt | bool %}请【现在】从【另一台机器】ping/ssh {{ ansible_host }}(别用本条连接判断)。{% endif %}
          连通正常要永久固化: 窗口内登录本机执行 `kill -USR1 $(pgrep -f 'netplan try' | head -1)`
          (netplan try 的接受信号)。不操作 = 到时自动回滚(安全默认)。
          ⚠ 不要用 `netplan apply` 代替接受: try 回滚时会把它备份的旧文件写回。
          日志: {{ _netplan_try_log }}。这一步故意不自动化, 避免整批机器被脚本放行一个暂时还没断连的错误配置。
      when:
        - (_do_storage | bool) or (_do_mgmt | bool)
        - _netplan_try_check.rc == 0
        - not ansible_check_mode

    - name: 应用新配置(netplan apply, 不支持 try 时回退, 无自动回滚保护)
      command: netplan apply
      when:
        - (_do_storage | bool) or (_do_mgmt | bool)
        - _netplan_try_check.rc != 0
        - not ansible_check_mode
      changed_when: true

    - name: 提示 —— 用了 apply 回退路径, 无自动回滚, 请立即手工确认连通性
      debug:
        msg: >-
          ⚠ {{ inventory_hostname }} 的 netplan 不支持 try, {{ _apply_scope | join('+') }} 已用 apply 直接生效,
          没有自动回滚保护。请立即另开一条连接复核; 异常时恢复 /etc/netplan/ 下对应的
          01-storage.yaml.<时间戳>~ / 81-mgmt.yaml.<时间戳>~ 备份并重新 netplan apply
          (管理网已断连只能走 IPMI/控制台)。
      when:
        - (_do_storage | bool) or (_do_mgmt | bool)
        - _netplan_try_check.rc != 0
        - not ansible_check_mode
