- name: 生成随机 root 密码并设置
  hosts: cls
  become: yes
  tasks:
    - name: 生成符合要求的随机密码（兼容 /bin/sh）
      shell: |
        chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#%^&*()_+"
        while true; do
          password=$(cat /dev/urandom | tr -dc "$chars" | head -c 12)
          # 使用 grep 检查密码复杂度（兼容 /bin/sh）
          if echo "$password" | grep -q '[A-Z]' && \
             echo "$password" | grep -q '[a-z]' && \
             echo "$password" | grep -q '[0-9]' && \
             echo "$password" | grep -q '[!@#%^&*()_+]'; then
            echo "$password"
            break
          fi
        done
      register: generated_password
      changed_when: false

    - name: 设置 root 密码
      user:
        name: root
        password: "{{ generated_password.stdout | password_hash('sha512') }}"

    - name: 将密码保存到安全文件
      copy:
        content: "生成的 root 密码: {{ generated_password.stdout }}"
        dest: /root/.ansible_pass
        mode: 0600

    - name: 打印密码（调试用）
      debug:
        msg: "Root 密码已设置为: {{ generated_password.stdout }}"
