---
# 解除集群所有节点 root 的 SSH 免密互信 (ssh-passwordless 的反向操作)
# 作用: 把各节点 root 公钥从每个节点的 authorized_keys 移除, 并删除免交互 ssh 客户端配置。
#       保留 /root/.ssh/id_rsa 密钥对本身(如需彻底清除请手动删)。
# 用法: ansible-playbook ssh-passwordless-remove.yaml
- name: 解除集群 root SSH 免密互信
  hosts: cluster
  become: yes
  gather_facts: no
  tasks:
    - name: 检查 root 公钥是否存在
      stat:
        path: /root/.ssh/id_rsa.pub
      register: root_pub_stat

    - name: 读取存在的 root 公钥
      slurp:
        src: /root/.ssh/id_rsa.pub
      register: root_pubkey
      when: root_pub_stat.stat.exists

    - name: 从每个节点移除所有节点的公钥 (解除互信)
      authorized_key:
        user: root
        state: absent
        key: "{{ hostvars[item].root_pubkey.content | b64decode }}"
      loop: "{{ ansible_play_hosts }}"
      when: hostvars[item].root_pubkey.content is defined

    - name: 移除 root ssh 免交互客户端配置
      file:
        path: /root/.ssh/config
        state: absent

    - name: 提示
      debug:
        msg: "root SSH 免密互信已解除。密钥对 /root/.ssh/id_rsa 保留, 如需彻底清除请手动删除。"
