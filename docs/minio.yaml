# MinIO 分布式部署 —— cpu03 / cpu05 / cpu07 / cpu08
#
# 硬件:每节点 2 块 3.5TB NVMe = 8 drives,裸容量 28TB
# 纠删码:8 drives 单个 erasure set
#   EC:4(默认) → 可用 14TB,容忍任意 4 块盘 = 2 个节点故障
#   EC:2(可选) → 可用 21TB,容忍任意 2 块盘 = 1 个节点故障
#   本文件用默认 EC:4;想要 EC:2 见文末说明
#
# 前置准备(四台节点都做):
#   1. 确认两块 NVMe 的设备名: lsblk -d -o NAME,SIZE,ROTA,TYPE
#   2. 格式化并挂载(XFS 是 MinIO 官方推荐):
#      mkfs.xfs -f /dev/nvmeXn1
#      mkfs.xfs -f /dev/nvmeYn1
#      mkdir -p /data/minio/disk0 /data/minio/disk1
#      # 用 UUID 写入 /etc/fstab,避免重启后设备名漂移:
#      blkid /dev/nvmeXn1
#      echo 'UUID=xxx /data/minio/disk0 xfs defaults,noatime 0 2' >> /etc/fstab
#      echo 'UUID=yyy /data/minio/disk1 xfs defaults,noatime 0 2' >> /etc/fstab
#      mount -a
#      chown -R 1000:1000 /data/minio
#   3. 验证是两个独立挂载点(不是同一文件系统下的两个目录):
#      df -h /data/minio/disk0 /data/minio/disk1   # Filesystem 列必须不同
#   4. 镜像推到 harbor: harbor.local.clusters/minio/minio
#
# PV 容量按 3.5TB 盘格式化后的实际可用量填,先跑 df -h 确认,再改所有 storage 字段
---
apiVersion: v1
kind: Namespace
metadata:
  name: minio-system
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: minio-system
type: Opaque
stringData:
  # 部署前务必改掉,密码至少 8 位
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "ChangeMe-MinIO-2026"
---
# no-provisioner + WaitForFirstConsumer:
# 让调度器先选节点再绑 PV,避免 Pod 调度到没有对应 PV 的节点
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: minio-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
# ==================== PV: cpu03 -> minio-0 ====================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-cpu03-disk0
spec:
  capacity: { storage: 3500Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /data/minio/disk0 }
  claimRef: { namespace: minio-system, name: data0-minio-0 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - { key: kubernetes.io/hostname, operator: In, values: [cpu03] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-cpu03-disk1
spec:
  capacity: { storage: 3500Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /data/minio/disk1 }
  claimRef: { namespace: minio-system, name: data1-minio-0 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - { key: kubernetes.io/hostname, operator: In, values: [cpu03] }
---
# ==================== PV: cpu05 -> minio-1 ====================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-cpu05-disk0
spec:
  capacity: { storage: 3500Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /data/minio/disk0 }
  claimRef: { namespace: minio-system, name: data0-minio-1 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - { key: kubernetes.io/hostname, operator: In, values: [cpu05] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-cpu05-disk1
spec:
  capacity: { storage: 3500Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /data/minio/disk1 }
  claimRef: { namespace: minio-system, name: data1-minio-1 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - { key: kubernetes.io/hostname, operator: In, values: [cpu05] }
---
# ==================== PV: cpu07 -> minio-2 ====================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-cpu07-disk0
spec:
  capacity: { storage: 3500Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /data/minio/disk0 }
  claimRef: { namespace: minio-system, name: data0-minio-2 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - { key: kubernetes.io/hostname, operator: In, values: [cpu07] }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-cpu07-disk1
spec:
  capacity: { storage: 3500Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /data/minio/disk1 }
  claimRef: { namespace: minio-system, name: data1-minio-2 }
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - { key: kubernetes.io/hostname, operator: In, values: [cpu07] }
---
# ==================== PV: cpu08 -> minio-3 ====================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-cpu08-disk0
spec:
  capacity: { storage: 3500Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: minio-local
  local: { path: /data/minio/disk0 }
  claimRef: { namespace: minio-system, name: data0-minio-3 }
  nodeAffinity:
